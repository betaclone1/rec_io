<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rec.io - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/global.css">
  <style>
    /* Login page specific styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      background-image: url('/images/splash_page_bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
    }
    
    .login-container {
      width: 300px;
      margin-right: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .login-logo {
      width: 150px;
      height: auto;
      margin-bottom: 40px;
    }
    
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: white;
      margin-bottom: 4px;
    }
    
    .form-input {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background-color: #e0e0e0;
      color: #333;
      font-size: 14px;
      font-family: inherit;
      transition: background-color 0.2s ease;
    }
    
    .form-input:focus {
      outline: none;
      background-color: #f0f0f0;
    }
    
    .form-input::placeholder {
      color: #666;
    }
    

    
    .remember-device {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    
    .remember-device input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4a90e2;
    }
    
    .remember-device label {
      font-size: 14px;
      color: white;
    }
    
    .login-button {
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 20px;
      width: 100%;
    }
    
    .login-button:hover {
      background-color: #34495e;
    }
    
    .login-button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }
    
    .error-message {
      color: #e74c3c;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
    
    .success-message {
      color: #27ae60;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      display: none;
      position: absolute;
      bottom: -40px;
      left: 0;
      right: 0;
    }
    

    

  </style>
</head>
<body>
  <div class="login-container">
    <img src="/images/rec_logo_trns.png" alt="REC.IO" class="login-logo">
    
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required>
      </div>
      
      <div class="remember-device">
        <input type="checkbox" id="rememberDevice" name="rememberDevice">
        <label for="rememberDevice">Remember this device</label>
      </div>
      
      <button type="submit" class="login-button" id="loginButton">
        <span id="loginButtonText">Sign In</span>
      </button>
      
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
    </form>
    

  </div>

  <script>


    // Check if we're already authenticated
    function checkAuthStatus() {
      const token = localStorage.getItem('rec_auth_token');
      const deviceId = localStorage.getItem('rec_device_id');
      
      if (token && deviceId) {
        // Verify token is still valid
        fetch(window.location.origin + '/api/auth/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token, deviceId })
        })
        .then(response => response.json())
        .then(data => {
          if (data.authenticated) {
            window.location.href = getRedirectUrl(token, deviceId);
          }
        })
        .catch(() => {
          // Token invalid, stay on login page
        });
      }
    }
    
    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const rememberDevice = document.getElementById('rememberDevice').checked;
      
      const loginButton = document.getElementById('loginButton');
      const loginButtonText = document.getElementById('loginButtonText');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      
      // Show loading state
      loginButton.disabled = true;
      loginButtonText.textContent = 'Signing In...';
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      try {
        const response = await fetch(window.location.origin + '/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username,
            password,
            rememberDevice
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Store authentication token and device ID
          localStorage.setItem('rec_auth_token', data.token);
          localStorage.setItem('rec_device_id', data.deviceId);
          
          successMessage.textContent = 'Authentication successful! Redirecting...';
          successMessage.style.display = 'block';
          
          // Redirect to main app
          setTimeout(() => {
            window.location.href = getRedirectUrl(data.token, data.deviceId);
          }, 1000);
        } else {
          errorMessage.textContent = data.error || 'Authentication failed';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = 'Network error. Please try again.';
        errorMessage.style.display = 'block';
      } finally {
        loginButton.disabled = false;
        loginButtonText.textContent = 'Sign In';
      }
    });
    

    
    // Device detection function
    function isMobileDevice() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // Check for mobile devices
      if (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase())) {
        return true;
      }
      
      // Check for touch capability (additional mobile indicator)
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        return true;
      }
      
      // Check screen size (mobile typically < 768px)
      if (window.innerWidth <= 768) {
        return true;
      }
      
      return false;
    }
    
    // Get appropriate redirect URL based on device
    function getRedirectUrl(token, deviceId) {
      // Check for mobile/desktop override in URL
      const urlParams = new URLSearchParams(window.location.search);
      const forceMobile = urlParams.has('mobile');
      const forceDesktop = urlParams.has('desktop');
      
      if (forceMobile) {
        return `/mobile?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
      } else if (forceDesktop) {
        return `/app?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
      } else if (isMobileDevice()) {
        return `/mobile?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
      } else {
        return `/app?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
      }
    }
    
    // Check auth status on page load
    checkAuthStatus();
  </script>
</body>
</html>
