<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/rec_session.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>rec.io - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      background: url('/images/splash_page_bg.jpg') center/cover no-repeat;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      touch-action: auto;
    }
    .login-container {
      width: 300px;
      margin-right: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @media (max-width: 768px) {
      body { justify-content: center; }
      .login-container { margin-right: 0; width: 90%; max-width: 350px; }
    }
    .login-logo {
      width: 150px;
      height: auto;
      margin-bottom: 40px;
    }
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      -webkit-touch-callout: default;
      touch-action: auto;
      z-index: 5;
    }
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: white;
    }
    .form-input {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #e0e0e0;
      color: #333;
      font-size: 16px;
      font-family: inherit;
    }
    .form-input:focus {
      outline: none;
      background: #f0f0f0;
    }
    .remember-device {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .remember-device input[type="checkbox"] { width: 16px; height: 16px; accent-color: #4a90e2; }
    .remember-device label { font-size: 14px; color: white; }
    .login-button {
      background: #2c3e50;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
    .login-button:hover { background: #34495e; }
    .login-button:disabled { background: #666; cursor: not-allowed; }
    .error-message, .success-message {
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
    .error-message { color: #e74c3c; }
    .success-message { color: #27ae60; }
    .nav-links {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }
    .nav-links a {
      color: rgba(255, 255, 255, 0.95);
      text-decoration: underline;
    }
    .nav-links a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="/images/rec_logo_trns.png" alt="REC.IO" class="login-logo">
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>
      <div class="remember-device">
        <input type="checkbox" id="rememberDevice" name="rememberDevice">
        <label for="rememberDevice">Remember this device</label>
      </div>
      <button type="submit" class="login-button" id="loginButton">
        <span id="loginButtonText">Sign In</span>
      </button>
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
    </form>
    <div class="nav-links">
      <a href="/register">Create a New Account</a>
    </div>
  </div>

  <script>
    function getRedirectUrl(token, deviceId) {
      var params = new URLSearchParams(window.location.search);
      if (params.has('mobile')) return '/mobile?token=' + encodeURIComponent(token) + '&deviceId=' + encodeURIComponent(deviceId);
      if (params.has('desktop')) return '/app?token=' + encodeURIComponent(token) + '&deviceId=' + encodeURIComponent(deviceId);
      var ua = navigator.userAgent || '';
      if (/iphone|ipad|ipod|android|mobile/i.test(ua)) return '/mobile?token=' + encodeURIComponent(token) + '&deviceId=' + encodeURIComponent(deviceId);
      return '/app?token=' + encodeURIComponent(token) + '&deviceId=' + encodeURIComponent(deviceId);
    }

    var authCheckInProgress = false;
    var authCheckDone = false;
    function checkAuthStatus() {
      if (authCheckInProgress || authCheckDone) return;
      var token = localStorage.getItem('rec_auth_token');
      var deviceId = localStorage.getItem('rec_device_id');
      if (!token || !deviceId) return;
      authCheckInProgress = true;
      fetch(window.location.origin + '/api/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, deviceId: deviceId })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.authenticated) {
          authCheckDone = true;
          if (d.userNo) { localStorage.setItem('rec_user_no', String(d.userNo)); }
          if (typeof recSyncAuthCookie === 'function') recSyncAuthCookie();
          window.location.href = getRedirectUrl(token, deviceId);
        } else {
          localStorage.removeItem('rec_auth_token');
          localStorage.removeItem('rec_device_id');
          if (typeof recClearAuthCookie === 'function') recClearAuthCookie();
        }
      })
      .catch(function() {
        localStorage.removeItem('rec_auth_token');
        localStorage.removeItem('rec_device_id');
        if (typeof recClearAuthCookie === 'function') recClearAuthCookie();
      })
      .finally(function() { authCheckInProgress = false; });
    }
    if (window.location.pathname === '/login') setTimeout(checkAuthStatus, 500);

    document.getElementById('loginForm').onsubmit = function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var rememberDevice = document.getElementById('rememberDevice').checked;
      var btn = document.getElementById('loginButton');
      var btnText = document.getElementById('loginButtonText');
      var errMsg = document.getElementById('errorMessage');
      var okMsg = document.getElementById('successMessage');
      errMsg.style.display = 'none';
      okMsg.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Signing In...';
      fetch(window.location.origin + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password, rememberDevice: rememberDevice })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success && d.pending_email_verification) {
          var uid = d.user_id || '';
          var q = uid ? ('user_id=' + encodeURIComponent(uid)) : '';
          if (d.email) q += (q ? '&' : '') + 'email=' + encodeURIComponent(d.email);
          window.location.href = '/register/verify' + (q ? ('?' + q) : '');
          return;
        }
        if (d.success && d.application_pending) {
          var qs = [];
          if (d.first_name) qs.push('first_name=' + encodeURIComponent(d.first_name));
          if (d.email) qs.push('email=' + encodeURIComponent(d.email));
          if (d.submitted_on) qs.push('submitted_on=' + encodeURIComponent(d.submitted_on));
          window.location.href = '/register/application-submitted' + (qs.length ? ('?' + qs.join('&')) : '');
          return;
        }
        if (d.success) {
          localStorage.setItem('rec_remember_device', rememberDevice ? '1' : '0');
          localStorage.setItem('rec_auth_token', d.token);
          localStorage.setItem('rec_device_id', d.deviceId);
          if (d.userNo) { localStorage.setItem('rec_user_no', String(d.userNo)); }
          if (typeof recSyncAuthCookie === 'function') recSyncAuthCookie(rememberDevice);
          okMsg.textContent = 'Authentication successful! Redirecting...';
          okMsg.style.display = 'block';
          setTimeout(function() { window.location.href = getRedirectUrl(d.token, d.deviceId); }, 1000);
        } else {
          errMsg.textContent = d.error || 'Authentication failed';
          errMsg.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      })
      .catch(function() {
        errMsg.textContent = 'Network error. Please try again.';
        errMsg.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Sign In';
      });
      return false;
    };
  </script>
</body>
</html>
