<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/global.css">
  
  <!-- Preload critical images -->
  <link rel="preload" href="../images/icons/list_view_icon.png" as="image" type="image/png">
  <link rel="preload" href="../images/icons/tile_view_icon.png" as="image" type="image/png">
  <link rel="preload" href="../images/icons/pie_chart_icon.png" as="image" type="image/png">
  <link rel="preload" href="../images/icons/bar_chart_icon.png" as="image" type="image/png">
  
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="../js/monitor_history_display.js"></script>
  <style>
    /* Dashboard Container */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 10px;
    }

    /* Portfolio Panel - Mobile: Full width */
    .portfolio-panel {
      min-height: 300px;
      width: 100%;
    }

    /* New Panel - Mobile: Hide */
    .new-panel {
      display: none;
    }

    /* Markets List */
    .markets-list {
      padding: 0;
    }

    .market-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      margin-bottom: 8px;
      border-bottom: none;
    }


    .market-item:last-child {
      border-bottom: none;
    }

    .market-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .market-symbol {
      font-weight: 600;
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .market-name {
      font-size: 12px;
      color: #a0aec0;
    }

    .market-data {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      min-width: 0;
    }

    .market-price {
      font-weight: 600;
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .market-changes {
      font-size: 11px;
      color: #a0aec0;
      line-height: 1.4;
    }

    .market-changes span {
      color: #28a745;
      background-color: rgba(40, 167, 69, 0.1);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 500;
    }

    .market-changes span.negative {
      color: #dc3545;
      background-color: rgba(220, 53, 69, 0.1);
    }



    /* Allocation Panel - Mobile: Full width */
    .allocation-panel {
      min-height: 400px;
      width: 100%;
    }

    /* Rebalance Icon Container */
    .rebalance-icon-container {
      display: flex !important;
      justify-content: flex-end !important;
      margin-top: 5px !important;
      margin-bottom: 5px !important;
      width: 100% !important;
      text-align: right !important;
      transform: translateX(-10px);

    }

    .allocation-chart-container {
      min-height: 300px;
      margin-top: 10px;
      position: relative;
      background-color: #1f2530;
      border-radius: 5px;
      overflow: visible;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    #allocation-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Monitors Panel - Mobile: Full width */
    .monitors-panel {
      min-height: 400px;
      width: 100%;
    }

    .monitors-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0;
    }

    .monitors-grid.list-view {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 10px 0;
    }

    /* Monitor Tile Base */
    .monitor-tile {
      background-color: #1f2530;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #34495e;
      user-select: none;
      min-width: 280px;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      pointer-events: none;
    }
    
    /* Disable all hover effects on monitor tiles */
    .monitor-tile:hover {
      background-color: #1f2530 !important;
      border-color: #34495e !important;
      transform: none !important;
    }
    
    /* Re-enable pointer events for auto trade toggle */
    .auto-trade-toggle {
      pointer-events: auto !important;
    }


    /* Monitor Name */
    .monitor-name {
      font-size: 11px;
      color: #a0aec0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .list-view .monitor-name {
      display: block;
      margin-left: 16px;
      min-width: 120px;
      text-align: left;
    }

    .tile-view .monitor-name {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 9px;
    }

    /* Monitor Controls */
    .monitor-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .list-view .monitor-controls {
      position: static;
      margin-left: auto;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tile-view .monitor-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }

    /* Monitor Symbol */
    .monitor-symbol {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    .list-view .monitor-symbol {
      font-size: 14px;
      margin-bottom: 2px;
    }

    .tile-view .monitor-symbol {
      font-size: 18px;
    }

    /* Monitor Strategy */
    .monitor-strategy {
      font-size: 12px;
      color: #a0aec0;
    }

    .list-view .monitor-strategy {
      font-size: 11px;
    }

    .tile-view .monitor-strategy {
      font-size: 12px;
      margin-bottom: 10px;
    }

    /* Monitor Status */
    .monitor-status {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-align: center;
      width: fit-content;
      letter-spacing: 0.5px;
    }

    .list-view .monitor-status {
      min-width: 70px;
      margin-right: 16px;
      transform: translateY(0px);
    }

    .tile-view .monitor-status {
      transform: translateY(30px);
    }

    .monitor-status.active {
      background-color: #48bb78;
      color: #ffffff;
    }

    .monitor-status.inactive {
      background-color: #dcb610;
      color: #ffffff;
    }

    .monitor-status.disabled {
      background-color: #404144;
      color: #ffffff;
    }

    .monitor-status.paused {
      background-color: #e53e3e;
      color: #ffffff;
    }

    /* Loss Prevention Status Badge */
    .loss-prevention-status {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-align: center;
      width: fit-content;
      letter-spacing: 0.5px;
      border: 2px solid #e53e3e;
      background-color: transparent;
      color: #e53e3e;
      margin-right: 8px;
    }

    .list-view .loss-prevention-status {
      min-width: 70px;
      margin-right: 8px;
      transform: translateY(0px);
    }

    .tile-view .loss-prevention-status {
      transform: translateY(30px);
      margin-right: 8px;
    }

    /* Monitor Stats */
    .monitor-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .list-view .monitor-stats {
      display: flex;
      gap: 12px;
      margin: 0;
      margin-right: 16px;
    }

    .tile-view .monitor-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Stat Value */
    .stat-value {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .list-view .stat-value {
      font-size: 13px;
      margin: 0;
    }

    .tile-view .stat-value {
      font-size: 14px;
      margin-bottom: 2px;
    }

    /* Stat Label */
    .stat-label {
      font-size: 10px;
      color: #a0aec0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .list-view .stat-label {
      font-size: 9px;
    }

    .tile-view .stat-label {
      font-size: 10px;
    }

    /* Monitor Uptime */
    .monitor-uptime {
      font-size: 10px;
      color: #a0aec0;
    }

    .list-view .monitor-uptime {
      min-width: 80px;
      text-align: center;
      margin-right: 16px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile-view .monitor-uptime {
      text-align: left;
      margin-top: 10px;
    }

    /* Auto Trade Label */
    .auto-trade-label {
      font-size: 10px;
      color: #a0aec0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .list-view .auto-trade-label {
      margin-right: 8px;
    }

    .tile-view .auto-trade-label {
      margin-right: 0px;
    }

    /* Auto Trade Toggle */
    .auto-trade-toggle {
      width: 32px;
      height: 17px;
      background-color: #444;
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s;
      border: none;
      outline: none;
    }

    .list-view .auto-trade-toggle {
      margin-bottom: 4px;
    }

    .tile-view .auto-trade-toggle {
      margin-bottom: 0;
    }

    .auto-trade-toggle.active {
      background-color: #007bff;
    }

    .auto-trade-toggle.disabled {
      background-color: #2d3748;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .auto-trade-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .auto-trade-toggle.active::after {
      transform: translateX(15px);
    }

    /* Monitor Settings Icon */
    .list-view .monitor-settings-icon {
      width: 14px;
      height: 14px;
      opacity: 0.3;
      transition: opacity 0.2s;
      cursor: pointer;
      margin-right: 6px;
    }


    .tile-view .monitor-settings-icon {
      width: 14px;
      height: 14px;
      opacity: 0.3;
      transition: opacity 0.2s;
      cursor: pointer;
      margin-right: 6px;
    }


    .monitor-symbol-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .monitor-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .monitor-icon {
      width: 11px;
      height: 11px;
      opacity: 0.4;
      transition: opacity 0.2s ease;
      cursor: pointer;
    }


    .status-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transition: background-color 0.2s ease;
      transform: translateY(10px); /* Move down */
    }

    .status-light.active {
      background-color: #48bb78;
      box-shadow: 0 0 6px rgba(72, 187, 120, 0.6);
    }


    .status-light.inactive {
      background-color: #3d3f41;
      box-shadow: none;
    }


    /* List View Status Light - positioned for horizontal layout */
    .list-status-light {
      width: 12px;
      height: 12px;
      margin-right: 0px;
      transform: translateY(0px); /* Move down */
      flex-shrink: 0; /* Prevent shrinking */
    }

    /* Darken inactive monitor tiles */
    .monitor-tile.inactive {
      opacity: 0.4;
      filter: brightness(0.7);
    }

    /* List View Tile Layout */
    .list-view .monitor-tile {
      width: 80%;
      height: 40px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      margin-bottom: 8px;
    }

    /* New Monitor Tile */
    .list-view .monitor-tile.new-monitor {
      border: 2px dashed #4a5568;
      background: transparent;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      width: 80%;
      height: 40px;
    }

    .tile-view .monitor-tile.new-monitor {
      border: 2px dashed #4a5568;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }



    .list-view .monitor-tile.new-monitor:active {
      cursor: pointer;
    }

    .tile-view .monitor-tile.new-monitor:active {
      cursor: pointer;
    }


    .list-view .new-monitor .monitor-symbol {
      font-size: 24px;
      color: #4a5568;
      font-weight: 600;
      margin-right: 8px;
    }

    .tile-view .new-monitor .monitor-symbol {
      font-size: 32px;
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .list-view .new-monitor .monitor-strategy {
      font-size: 11px;
      color: #4a5568;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .tile-view .new-monitor .monitor-strategy {
      font-size: 12px;
      color: #4a5568;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Tooltip */
    .monitor-tooltip {
      position: absolute;
      background: #2a3a4a;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .monitor-tooltip.show {
      opacity: 1;
    }

    /* Sortable Styles */
    .sortable-ghost {
      opacity: 0.3;
    }

    .sortable-chosen {
      background-color: #293745;
    }

    .sortable-drag {
      opacity: 0.8;
    }

    .sortable-fallback {
      opacity: 0.8;
    }

    /* Portfolio Chart */
    .portfolio-chart-container {
      height: 200px;
      margin-top: 0px;
      position: relative;
      background-color: #1f2530;
      border-radius: 5px;
      overflow: hidden;
      padding: 10px;
    }

    .portfolio-controls {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 12px;
      margin-bottom: 0px;
    }

    .portfolio-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .portfolio-value {
      font-size: 17.5px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1;
    }

    .portfolio-change-container {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
    }

    .change-element {
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ffffff;
      line-height: 1;
    }

    .change-element::before {
      content: '';
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }

    .change-element.positive::before {
      border-bottom: 8px solid #4caf50;
    }

    .change-element.negative::before {
      border-top: 8px solid #f44336;
    }

    .view-buttons {
      display: flex;
      gap: 5px;
    }

    .view-btn {
      background-color: #323c4e;
      border: 0px solid #4a9eff;
      color: #c4c4c4;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }

    .view-btn.active {
      background-color: #4a9eff;
      color: #ffffff;
    }

    /* Panels Row - Mobile: Stack vertically */
    .panels-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panels-row .panel-container {
      margin-bottom: 0;
    }

    /* Stat Panel */
    .stat-panel {
      background-color: #34495e;
      border-radius: 4px;
      padding: 8px;
      text-align: center;
    }

    .stat-value.positive {
      color: #48bb78;
    }

    .stat-value.negative {
      color: #f56565;
    }

    .stat-value.neutral {
      color: #a0aec0;
    }

    /* Symbol Status Row */
    .symbol-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Archive Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #2d3748;
      border-radius: 8px;
      padding: 0;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #4a5568;
    }

    .modal-header {
      background-color: #4a5568;
      padding: 16px 20px;
      border-radius: 8px 8px 0 0;
      border-bottom: 1px solid #2d3748;
    }

    .modal-header h3 {
      margin: 0;
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-body {
      padding: 20px;
      color: #e2e8f0;
    }

    .modal-body p {
      margin: 0 0 12px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-warning {
      color: #f6ad55;
      font-size: 12px;
      font-style: italic;
      margin-top: 8px;
    }

    .modal-keyboard-hint {
      color: #a0aec0;
      font-size: 11px;
      margin-top: 12px;
      text-align: center;
    }

    .modal-keyboard-hint kbd {
      background-color: #4a5568;
      border: 1px solid #718096;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: monospace;
      color: #e2e8f0;
    }

    .modal-footer {
      padding: 16px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid #4a5568;
      background-color: #2d3748;
      border-radius: 0 0 8px 8px;
    }

    .modal-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn-cancel {
      background-color: #4a5568;
      color: #e2e8f0;
    }


    .modal-btn-confirm {
      background-color: #e53e3e;
      color: white;
    }


    /* New Monitor Modal Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
    }

    .modal-dropdown,
    .modal-input {
      width: 100%;
      padding: 8px 12px;
      background-color: #4a5568;
      border: 1px solid #2d3748;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 13px;
      box-sizing: border-box;
    }

    .modal-dropdown {
      cursor: pointer;
    }

    .modal-dropdown:focus,
    .modal-input:focus {
      outline: none;
      border-color: #4299e1;
      box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Portfolio and New Panel Row -->
    <div class="panels-row">
      <!-- Portfolio Panel -->
      <div class="panel-container portfolio-panel">
        <div class="panel-header">
          Portfolio
          <div class="portfolio-controls">
            <div class="portfolio-info">
              <span class="portfolio-value" id="portfolio-value" style="padding-left: 20px; margin-right: 15px;"">Loading...</span>
              <div class="portfolio-change-container">
                <div class="change-element" id="portfolio-change"></div>
              </div>
            </div>
            <div class="view-buttons">
              <button data-view="1d" class="view-btn active">1d</button>
              <button data-view="1w" class="view-btn">1w</button>
              <button data-view="1m" class="view-btn">1m</button>
              <button data-view="1y" class="view-btn">1y</button>
              <button data-view="all" class="view-btn">All</button>
            </div>
          </div>
        </div>
        <div class="portfolio-chart-container">
          <canvas id="portfolio-chart"></canvas>
        </div>
      </div>


    <!-- Monitors and Allocation Row -->
    <div class="panels-row">
      <!-- Monitors Panel -->
      <div class="panel-container monitors-panel">
        <div class="panel-header">
          <span>Monitors</span>
        </div>
        <div class="monitors-grid" id="monitors-grid">
          <!-- Monitor tiles will be dynamically generated here -->
        </div>
      </div>

      <!-- Allocation Panel -->
      <div class="panel-container allocation-panel">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Allocation</span>
          <div style="font-size: 12px; user-select: none; color: white; display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer;" id="chartTypeToggle" onclick="toggleChartType()">
            <img 
              id="pieChartIcon"
              src="../images/icons/pie_chart_icon.png" 
              alt="Pie Chart" 
              title="Pie Chart" 
              style="width: 12px; height: 12px; opacity: 1; transition: opacity 0.2s;"
            />
            <img 
              id="barChartIcon"
              src="../images/icons/bar_chart_icon.png" 
              alt="Bar Chart" 
              title="Bar Chart" 
              style="width: 12px; height: 12px; opacity: 0.2; transition: opacity 0.2s;"
            />
          </div>
        </div>
        <div class="panel-content">
          <div class="allocation-chart-container">
            <div id="allocation-chart"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Mobile dashboard functionality

    // Load account mode and fetch portfolio data
    let GLOBAL_ACCOUNT_MODE = 'prod'; // Default to production mode
    let portfolioChart = null;
    let allHistoryData = []; // Store all data
    let currentView = 'all'; // Current view
    let currentViewMode = 'tile'; // Current view mode (tile/list)
    let currentSortBy = 'name'; // Current sort criteria
    let currentChartType = 'pie'; // Current chart type (pie/bar)

    // Load account mode from localStorage or default to prod
    document.addEventListener('DOMContentLoaded', async function() {
      const savedMode = localStorage.getItem('rec_account_mode');
      if (savedMode) {
        GLOBAL_ACCOUNT_MODE = savedMode;
      }
      
      // STEP 1: Load dashboard preferences FIRST - this sets currentView
      await loadDashboardPreferences();
      console.log('Dashboard: Preferences loaded, currentView is:', currentView);
      
      // STEP 2: Load portfolio data and history
      await loadPortfolioData();
      await loadPortfolioHistory();
      
      // STEP 3: Load monitors data
      await loadMonitors();
      
      // STEP 3.5: Load allocation data
      await loadAllocationData();
      
      // STEP 4: Initialize monitor history display with correct view BEFORE rendering
      if (window.monitorHistoryDisplay) {
        console.log('Dashboard: Initializing monitor history display with view:', currentView);
        await window.monitorHistoryDisplay.init(currentView);
      }
      
      // STEP 5: NOW render everything with correct values
      applyCurrentSort();
      initializeMonitors();
      initializeSortable();
      initializeTooltips();

      // STEP 5.5: Monitor breakdown refresh removed
      
      // Add event listeners for chart view buttons
      document.querySelectorAll('.view-btn[data-view]').forEach(button => {
        button.addEventListener('click', function() {
          const view = this.getAttribute('data-view');
          setChartView(view);
        });
      });
      
      // Connect to WebSocket after everything is loaded
      connectWebSocket();
    });

    // Monitors data - will be loaded from API
    let monitors = [];

    // Function to update only stat values without re-rendering tiles
    function updateMonitorStatValues(oldMonitors, newMonitors) {
      // Find all monitor tiles on the page
      const monitorTiles = document.querySelectorAll('.monitor-tile[data-monitor-id]');
      
      monitorTiles.forEach(tile => {
        const monitorId = tile.getAttribute('data-monitor-id');
        const newMonitor = newMonitors.find(m => m.id === monitorId);
        
        if (newMonitor) {
          // Update win streak
          const winStreakElement = tile.querySelector('.stat-win-streak');
          if (winStreakElement) {
            winStreakElement.textContent = newMonitor.win_streak || 0;
          }
          
          // Update W/L
          const winLossElement = tile.querySelector('.stat-win-loss');
          if (winLossElement) {
            winLossElement.textContent = newMonitor.winRate || '0%';
          }
          
          // Update Ret%
          const retPctElement = tile.querySelector('.stat-ret-pct');
          if (retPctElement) {
            retPctElement.textContent = newMonitor.return || '0%';
          }
          
          // Update PnL
          const pnlElement = tile.querySelector('.stat-pnl');
          if (pnlElement) {
            pnlElement.textContent = newMonitor.pnl || '$0';
          }
          
          // Update uptime
          const uptimeElement = tile.querySelector('.monitor-uptime');
          if (uptimeElement) {
            uptimeElement.textContent = newMonitor.uptime || '0d 0h 0m';
          }
          
          // Update auto trade status
          const statusElement = tile.querySelector('.monitor-status');
          if (statusElement) {
            const status = newMonitor.auto_trade_status;
            statusElement.textContent = getStatusText(status, newMonitor.id);
            statusElement.className = `monitor-status ${getStatusClass(status)}`;
          }
          
          // Update loss prevention badge
          const statusParent = statusElement ? statusElement.parentElement : null;
          if (statusParent) {
            const existingLossPreventionBadge = statusParent.querySelector('.loss-prevention-status');
            if (newMonitor.loss_prevention && newMonitor.loss_prevention !== 'none' && newMonitor.loss_prevention !== 'off') {
              if (!existingLossPreventionBadge) {
                const lossPreventionBadge = document.createElement('div');
                lossPreventionBadge.className = 'loss-prevention-status';
                lossPreventionBadge.textContent = 'LOSS PREVENTION';
                statusParent.insertBefore(lossPreventionBadge, statusElement);
              }
            } else {
              if (existingLossPreventionBadge) {
                existingLossPreventionBadge.remove();
              }
            }
          }
        }
      });
    }

    // Helper function to get monitor stat value (calculated or default)
    function getMonitorStatValue(monitor, statType, defaultValue) {
      // Check if monitor history display has calculated values
      if (window.monitorHistoryDisplay && window.monitorHistoryDisplay.isInitialized) {
        const stats = window.monitorHistoryDisplay.getMonitorStats(monitor.id);
        if (stats) {
          switch (statType) {
            case 'win_streak':
              return stats.win_streak || 0;
            case 'win_loss':
              return `${stats.win_loss}%`;
            case 'ret_pct':
              return `${stats.ret_pct}%`;
            case 'pnl':
              const pnlValue = Math.round(stats.pnl);
              const formattedPnl = pnlValue.toLocaleString();
              return pnlValue >= 0 ? `$${formattedPnl}` : `-$${Math.abs(pnlValue).toLocaleString()}`;
          }
        }
      }
      
      // Fallback to direct monitor data from API
      switch (statType) {
        case 'win_streak':
          return monitor.win_streak || 0;
        case 'win_loss':
          return monitor.winRate || defaultValue;
        case 'ret_pct':
          return monitor.return || defaultValue;
        case 'pnl':
          return monitor.pnl || defaultValue;
        default:
          return defaultValue;
      }
    }

    // Create monitor tile HTML
    function createMonitorTile(monitor, index) {
      const isListView = currentViewMode === 'list';
      
      if (monitor.id === 'NEW_MONITOR') {
        // Special layout for new monitor tile
        return `
          <div class="monitor-tile new-monitor" data-index="${index}" onclick="showNewMonitorModal()">
            <div class="monitor-symbol">${monitor.symbol}</div>
            <div class="monitor-strategy">${monitor.strategy}</div>
          </div>
        `;
      }
      
      if (isListView) {
        // List view layout - horizontal data arrangement
        return `
          <div class="monitor-tile list-view ${monitor.status === 'inactive' ? 'inactive' : ''}" data-monitor-id="${monitor.id}" data-monitor-name="${monitor.id}" data-index="${index}">
            <!-- Column 1: Status Light -->
            <div class="status-light list-status-light ${monitor.status === 'active' ? 'active' : 'inactive'}" onclick="toggleMonitorStatus('${monitor.id}', '${monitor.name}', '${monitor.status}')" style="cursor: pointer;" title="${monitor.status === 'active' ? 'Click to deactivate monitor' : 'Click to activate monitor'}"></div>
            
            <!-- Column 2: Symbol/Icons and Strategy -->
            <div style="display: flex; flex-direction: column; min-width: 100px; margin-right: 16px; margin-left: 12px;">
              <div class="monitor-symbol-container">
                <span class="monitor-symbol">${monitor.symbol}</span>
                                  <div class="monitor-icons">
                    <img src="/images/icons/trade_monitor_icon.png" alt="Monitor" title="Monitor" class="monitor-icon monitor-icon" onclick="switchToTradeMonitor('${monitor.id}')">
                    <img src="/images/icons/trade_history.png" alt="History" title="History" class="monitor-icon history-icon" onclick="loadTradeHistory('${monitor.name}')">
                    <img src="/images/icons/trash_icon.png" alt="Archive" title="Archive" class="monitor-icon trash-icon" onclick="showArchiveConfirmation('${monitor.id}', '${monitor.name}')">
                  </div>
              </div>
              <div class="monitor-strategy">${monitor.strategy}</div>
            </div>
            ${monitor.loss_prevention && monitor.loss_prevention !== 'none' && monitor.loss_prevention !== 'off' ? '<div class="loss-prevention-status">LOSS PREVENTION</div>' : ''}
            <div class="monitor-status ${monitor.auto_trade_status === 'active' || monitor.auto_trade_status === 'ACTIVE' ? 'active' : monitor.auto_trade_status === 'inactive' || monitor.auto_trade_status === 'INACTIVE' ? 'inactive' : monitor.auto_trade_status === 'disabled' || monitor.auto_trade_status === 'DISABLED' ? 'disabled' : monitor.auto_trade_status === 'paused' || monitor.auto_trade_status === 'PAUSED' ? 'paused' : ''}">${monitor.auto_trade_status === 'active' || monitor.auto_trade_status === 'ACTIVE' ? 'ACTIVE' : monitor.auto_trade_status === 'inactive' || monitor.auto_trade_status === 'INACTIVE' ? 'INACTIVE' : monitor.auto_trade_status === 'disabled' || monitor.auto_trade_status === 'DISABLED' ? 'DISABLED' : monitor.auto_trade_status === 'paused' || monitor.auto_trade_status === 'PAUSED' ? 'PAUSED' : monitor.auto_trade_status}</div>
            <div class="monitor-stats">
              <div style="text-align: center; min-width: 45px;">
                <div class="stat-value stat-win-streak">${monitor.win_streak || 0}</div>
                <div class="stat-label">Win Streak</div>
              </div>
              <div style="text-align: center; min-width: 45px;">
                <div class="stat-value stat-win-loss">${getMonitorStatValue(monitor, 'win_loss', '0%')}</div>
                <div class="stat-label">W/L</div>
              </div>
              <div style="text-align: center; min-width: 60px;">
                <div class="stat-value stat-ret-pct">${getMonitorStatValue(monitor, 'ret_pct', '0%')}</div>
                <div class="stat-label">Ret%</div>
              </div>
              <div style="text-align: center; min-width: 70px;">
                <div class="stat-value stat-pnl">${getMonitorStatValue(monitor, 'pnl', '$0')}</div>
                <div class="stat-label">PnL</div>
              </div>
            </div>
            <div class="monitor-uptime">${monitor.uptime}</div>
            <div class="monitor-name">${monitor.id === 'NEW_MONITOR' ? monitor.name : `Monitor ${monitor.name.slice(-5)}`}</div>
            <div class="monitor-controls">
              <div style="display: flex; align-items: center;">
                <img 
                  class="monitor-settings-icon"
                  src="/images/icons/panel_settings.png" 
                  alt="Monitor Settings" 
                  title="Monitor Settings" 
                  onclick="console.log('Monitor Settings icon clicked for ${monitor.id}');"
                />
                <div class="auto-trade-label">AUTO TRADE</div>
                <div class="auto-trade-toggle ${monitor.autoTrade ? 'active' : ''} ${monitor.status === 'inactive' ? 'disabled' : ''}" ${monitor.status !== 'inactive' ? `onclick="toggleAutoTrade('${monitor.id}')"` : ''}></div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Tile view layout - original vertical arrangement
        return `
          <div class="monitor-tile tile-view ${monitor.status === 'inactive' ? 'inactive' : ''}" data-monitor-id="${monitor.id}" data-monitor-name="${monitor.id}" data-index="${index}">
            <div class="monitor-name">${monitor.id === 'NEW_MONITOR' ? monitor.name : `Monitor ${monitor.name.slice(-5)}`}</div>
            <div style="display: flex; align-items: flex-start; margin-bottom: 10px;">
              <!-- Column 1: Status Light -->
              <div class="status-light ${monitor.status === 'active' ? 'active' : 'inactive'}" onclick="toggleMonitorStatus('${monitor.id}', '${monitor.name}', '${monitor.status}')" style="cursor: pointer;" title="${monitor.status === 'active' ? 'Click to deactivate monitor' : 'Click to activate monitor'}"></div>
              
              <!-- Column 2: Symbol/Icons and Strategy -->
              <div style="display: flex; flex-direction: column; align-items: flex-start; margin-left: 12px; margin-right: auto;">
                <div class="monitor-symbol-container">
                  <span class="monitor-symbol">${monitor.symbol}</span>
                  <div class="monitor-icons">
                    <img src="/images/icons/trade_monitor_icon.png" alt="Monitor" title="Monitor" class="monitor-icon monitor-icon" onclick="switchToTradeMonitor('${monitor.id}')">
                    <img src="/images/icons/trade_history.png" alt="History" title="History" class="monitor-icon history-icon" onclick="loadTradeHistory('${monitor.name}')">
                    <img src="/images/icons/trash_icon.png" alt="Archive" title="Archive" class="monitor-icon trash-icon" onclick="showArchiveConfirmation('${monitor.id}', '${monitor.name}')">
                  </div>
                </div>
                <div class="monitor-strategy">${monitor.strategy}</div>
              </div>
              
              <!-- Column 3: Auto Trade Controls and Status -->
              <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div class="monitor-controls">
                  <img 
                    class="monitor-settings-icon"
                    src="/images/icons/panel_settings.png" 
                    alt="Monitor Settings" 
                    title="Monitor Settings" 
                    onclick="console.log('Monitor Settings icon clicked for ${monitor.id}');"
                  />
                  <span class="auto-trade-label">AUTO TRADE</span>
                  <div class="auto-trade-toggle ${monitor.autoTrade ? 'active' : ''} ${monitor.status === 'inactive' ? 'disabled' : ''}" ${monitor.status !== 'inactive' ? `onclick="toggleAutoTrade('${monitor.id}')"` : ''}></div>
                </div>
                <div style="display: flex; align-items: center;">
                  ${monitor.loss_prevention && monitor.loss_prevention !== 'none' && monitor.loss_prevention !== 'off' ? '<div class="loss-prevention-status">LOSS PREVENTION</div>' : ''}
                  <div class="monitor-status ${monitor.auto_trade_status === 'active' || monitor.auto_trade_status === 'ACTIVE' ? 'active' : monitor.auto_trade_status === 'inactive' || monitor.auto_trade_status === 'INACTIVE' ? 'inactive' : monitor.auto_trade_status === 'disabled' || monitor.auto_trade_status === 'DISABLED' ? 'disabled' : monitor.auto_trade_status === 'paused' || monitor.auto_trade_status === 'PAUSED' ? 'paused' : ''}">${monitor.auto_trade_status === 'active' || monitor.auto_trade_status === 'ACTIVE' ? 'ACTIVE' : monitor.auto_trade_status === 'inactive' || monitor.auto_trade_status === 'INACTIVE' ? 'INACTIVE' : monitor.auto_trade_status === 'disabled' || monitor.auto_trade_status === 'DISABLED' ? 'DISABLED' : monitor.auto_trade_status === 'paused' || monitor.auto_trade_status === 'PAUSED' ? 'PAUSED' : monitor.auto_trade_status}</div>
                </div>
              </div>
            </div>
            <div class="monitor-stats">
              <div class="stat-panel">
                <div class="stat-value stat-win-streak">${monitor.win_streak || 0}</div>
                <div class="stat-label">Win Streak</div>
              </div>
              <div class="stat-panel">
                <div class="stat-value stat-win-loss">${getMonitorStatValue(monitor, 'win_loss', '0%')}</div>
                <div class="stat-label">W/L</div>
              </div>
              <div class="stat-panel">
                <div class="stat-value stat-ret-pct">${getMonitorStatValue(monitor, 'ret_pct', '0%')}</div>
                <div class="stat-label">Ret%</div>
              </div>
              <div class="stat-panel">
                <div class="stat-value stat-pnl">${getMonitorStatValue(monitor, 'pnl', '$0')}</div>
                <div class="stat-label">PnL</div>
              </div>
            </div>
            <div class="monitor-uptime">${monitor.uptime}</div>
          </div>
        `;
      }
    }

    // Load monitors from API
    async function loadMonitors() {
      try {
        const response = await fetch('/api/monitors?user_id=user_0001');
        const data = await response.json();
        
        if (data.status === 'ok') {
          monitors = data.monitors;
          
          // Initialize cooldown timers from API data
          monitors.forEach(monitor => {
            if (monitor.cooldown_timer && monitor.cooldown_timer > 0) {
              cooldownTimers.set(monitor.id, monitor.cooldown_timer);
              console.log(`Initialized cooldown timer for ${monitor.id}: ${monitor.cooldown_timer}s`);
            }
          });
          
          console.log(`Loaded ${data.count} monitors from API`);
        } else {
          console.error('Failed to load monitors:', data.message);
          // Fallback to empty array with NEW_MONITOR
          monitors = [{
            "id": "NEW_MONITOR",
            "symbol": "+",
            "strategy": "NEW MONITOR",
            "status": "new",
            "autoTrade": false,
            "trades": "",
            "winRate": "",
            "return": "",
            "pnl": "",
            "uptime": "",
            "name": "NEW_MONITOR",
            "bankroll_allotment": 0,
            "auto_trade_status": "inactive"
          }];
        }
      } catch (error) {
        console.error('Error loading monitors:', error);
        // Fallback to empty array with NEW_MONITOR
        monitors = [{
          "id": "NEW_MONITOR",
          "symbol": "+",
          "strategy": "NEW MONITOR",
          "status": "new",
          "autoTrade": false,
          "trades": "",
          "winRate": "",
          "return": "",
          "pnl": "",
          "uptime": "",
          "name": "NEW_MONITOR",
          "bankroll_allotment": 0,
          "auto_trade_status": "inactive"
        }];
      }
    }

    // Initialize monitors
    function initializeMonitors() {
      const grid = document.getElementById('monitors-grid');
      if (grid) {
        // Filter out archived monitors - only show active and inactive
        const visibleMonitors = monitors.filter(monitor => 
          monitor.status !== 'archived' && monitor.id !== 'NEW_MONITOR'
        );
        
        // Add NEW_MONITOR back at the end
        const newMonitor = monitors.find(m => m.id === 'NEW_MONITOR');
        if (newMonitor) {
          visibleMonitors.push(newMonitor);
        }
        
        grid.innerHTML = visibleMonitors.map((monitor, index) => createMonitorTile(monitor, index)).join('');
        
        // Update status displays to show cooldown timers if available
        visibleMonitors.forEach(monitor => {
          if ((monitor.auto_trade_status === 'PAUSED' || monitor.auto_trade_status === 'paused') && cooldownTimers.has(monitor.id)) {
            const statusElement = document.querySelector(`[data-monitor-id="${monitor.id}"] .monitor-status`);
            if (statusElement) {
              statusElement.textContent = getStatusText(monitor.auto_trade_status, monitor.id);
              console.log(`Updated initial timer display for ${monitor.id}`);
            }
          }
        });
        
        // Add cross-highlighting event listeners to monitor tiles
        addMonitorTileHighlighting();
      }
    }

    // Add cross-highlighting event listeners to monitor tiles
    function addMonitorTileHighlighting() {
      const monitorTiles = document.querySelectorAll('.monitor-tile[data-monitor-id]');
      monitorTiles.forEach(tile => {
        const monitorId = tile.getAttribute('data-monitor-id');
        
        // Skip NEW_MONITOR as it doesn't have allocation data
        if (monitorId === 'NEW_MONITOR') return;
        
        tile.addEventListener('mouseover', function() {
          // Highlight the corresponding pie chart segment
          const pieSegment = d3.select(`[data-allocation-id="${monitorId}"]`);
          if (!pieSegment.empty()) {
            pieSegment
              .transition()
              .duration(200)
              .attr('stroke-width', 4)
              .attr('fill-opacity', 0.6);
          }
          
          // Highlight the corresponding allocation list item
          const listItem = document.querySelector(`div[data-allocation-id="${monitorId}"]`);
          if (listItem) {
            listItem.style.background = 'rgba(74, 158, 255, 0.2)';
            listItem.style.transition = 'background-color 0.2s ease';
            listItem.style.boxShadow = '0 0 8px rgba(74, 158, 255, 0.01)';
          }
          
          // Highlight this monitor tile
          tile.style.background = '#3a4a5c';
          tile.style.transition = 'background-color 0.2s ease';
          tile.style.boxShadow = '0 0 5px rgba(74, 158, 255, 0.05)';
        });
        
        tile.addEventListener('mouseout', function() {
          // Remove highlight from pie chart segment
          const pieSegment = d3.select(`[data-allocation-id="${monitorId}"]`);
          if (!pieSegment.empty()) {
            pieSegment
              .transition()
              .duration(200)
              .attr('stroke-width', 3)
              .attr('fill-opacity', 0.1);
          }
          
          // Remove highlight from allocation list item
          const listItem = document.querySelector(`div[data-allocation-id="${monitorId}"]`);
          if (listItem) {
            listItem.style.background = '';
            listItem.style.transition = '';
            listItem.style.boxShadow = '';
          }
          
          // Remove highlight from this monitor tile
          tile.style.background = '';
          tile.style.transition = '';
          tile.style.boxShadow = '';
        });
      });
    }

    // Apply current sort criteria to monitors array
    function applyCurrentSort() {
      // Separate the new monitor from regular monitors and filter out archived
      const newMonitor = monitors.find(m => m.id === 'NEW_MONITOR');
      const regularMonitors = monitors.filter(m => m.id !== 'NEW_MONITOR' && m.status !== 'archived');
      
      let sortedMonitors;
      
      if (currentSortBy === 'custom') {
        // For custom sort, use dashboard_order from database (already loaded in correct order)
        sortedMonitors = [...regularMonitors].sort((a, b) => {
          const aOrder = a.dashboard_order || 0;
          const bOrder = b.dashboard_order || 0;
          return aOrder - bOrder; // Ascending order by dashboard_order
        });
      } else {
        // Apply other sorting criteria
        sortedMonitors = [...regularMonitors].sort((a, b) => {
          switch (currentSortBy) {
            case 'name':
              return a.id.localeCompare(b.id);
            case 'symbol':
              return a.symbol.localeCompare(b.symbol);
            case 'strategy':
              return a.strategy.localeCompare(b.strategy);
            case 'win_streak':
              return (b.win_streak || 0) - (a.win_streak || 0); // Descending order
            case 'winRate':
              return parseFloat(b.winRate) - parseFloat(a.winRate); // Descending order
            case 'return':
              return parseFloat(b.return.replace(/[+%]/g, '')) - parseFloat(a.return.replace(/[+%]/g, '')); // Descending order
            case 'pnl':
              return parseFloat(b.pnl.replace(/[+$,-]/g, '')) - parseFloat(a.pnl.replace(/[+$,-]/g, '')); // Descending order
            case 'uptime':
              // Convert uptime to minutes for comparison
              const aMinutes = convertUptimeToMinutes(a.uptime);
              const bMinutes = convertUptimeToMinutes(b.uptime);
              return bMinutes - aMinutes; // Descending order
            default:
              return 0;
          }
        });
      }
      
      // Update the monitors array - new monitor always at the end
      monitors.length = 0;
      monitors.push(...sortedMonitors);
      if (newMonitor) {
        monitors.push(newMonitor);
      }
    }

    // Tooltip functionality
    function initializeTooltips() {
      const tooltip = document.createElement('div');
      tooltip.className = 'monitor-tooltip';
      document.body.appendChild(tooltip);

      let tooltipTimeout;

      document.addEventListener('mouseover', function(e) {
        const monitorTile = e.target.closest('.monitor-tile');
        if (monitorTile && monitorTile.classList.contains('list-view')) {
          const monitorId = monitorTile.getAttribute('data-monitor-id');
          if (monitorId) {
            tooltipTimeout = setTimeout(() => {
              const rect = monitorTile.getBoundingClientRect();
              tooltip.textContent = monitorId;
              tooltip.style.left = (rect.right + 10) + 'px';
              tooltip.style.top = (rect.top + rect.height / 2 - tooltip.offsetHeight / 2) + 'px';
              tooltip.classList.add('show');
            }, 500);
          }
        }
      });

      document.addEventListener('mouseout', function(e) {
        const monitorTile = e.target.closest('.monitor-tile');
        if (monitorTile) {
          clearTimeout(tooltipTimeout);
          tooltip.classList.remove('show');
        }
      });
    }

    // Initialize Sortable for monitor tiles
    function initializeSortable() {
      const grid = document.getElementById('monitors-grid');
      if (grid) {
        new Sortable(grid, {
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          dragClass: 'sortable-drag',
          fallbackClass: 'sortable-fallback',
          forceFallback: true,
          filter: '.new-monitor, .monitor-icon, .monitor-icons', // Prevent new monitor tile and icon areas from being dragged
          onMove: function(evt) {
            // Prevent dropping any tile after the new monitor tile
            const newMonitorIndex = monitors.findIndex(m => m.id === 'NEW_MONITOR');
            const draggedIndex = evt.dragged.dataset.index;
            const newIndex = evt.dragged.parentNode.children.length - 1; // Last position is reserved for new monitor
            
            if (evt.related && evt.related.classList.contains('new-monitor')) {
              return false; // Prevent dropping on new monitor tile
            }
            
            // Prevent dropping after the new monitor tile
            if (evt.newIndex >= newMonitorIndex) {
              return false;
            }
            
            return true;
          },
          onEnd: function(evt) {
            // When tiles are manually reordered, show "Custom" in the sort picker
            const sortPicker = document.getElementById('sortPicker');
            const customOption = sortPicker.querySelector('option[value="custom"]');
            if (customOption) {
              customOption.style.display = ''; // Show the custom option
              sortPicker.value = 'custom';
            }
            
            // Update the current sort criteria to custom
            currentSortBy = 'custom';
            
            // Save the new order to the database
            saveMonitorOrder();
            
            // Save the custom sort preference to the database
            saveDashboardPreferences();
          }
        });
      }
    }

    // Sort monitors by the selected criteria
    function sortMonitors(criteria) {
      currentSortBy = criteria;
      
      if (criteria === 'custom') {
        // For custom sort, reload from database to get the saved dashboard_order
        loadMonitors().then(() => {
          applyCurrentSort();
          initializeMonitors();
        });
      } else {
        // For other sorts, apply the sort criteria
        applyCurrentSort();
        initializeMonitors();
      }
      
      // Save preferences
      saveDashboardPreferences();
    }

    // Helper function to convert uptime string to minutes
    function convertUptimeToMinutes(uptime) {
      const match = uptime.match(/(\d+)d\s*(\d+)h\s*(\d+)m/);
      if (match) {
        const days = parseInt(match[1]) || 0;
        const hours = parseInt(match[2]) || 0;
        const minutes = parseInt(match[3]) || 0;
        return days * 24 * 60 + hours * 60 + minutes;
      }
      return 0;
    }

    // Add keyboard event listeners for rebalance mode
    function addRebalanceKeyboardListeners() {
      // Remove any existing listeners first
      removeRebalanceKeyboardListeners();
      
      // Store the handler function so we can remove it later
      window.rebalanceKeyHandler = function(event) {
        if (!isRebalanceMode) return;
        
        if (event.key === 'Enter') {
          event.preventDefault();
          saveRebalanceChanges();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          cancelRebalanceChanges();
        }
      };
      
      // Add the event listener
      document.addEventListener('keydown', window.rebalanceKeyHandler);
    }

    // Remove keyboard event listeners for rebalance mode
    function removeRebalanceKeyboardListeners() {
      if (window.rebalanceKeyHandler) {
        document.removeEventListener('keydown', window.rebalanceKeyHandler);
        window.rebalanceKeyHandler = null;
      }
    }

    // Save rebalance changes
    async function saveRebalanceChanges() {
      const listContainer = document.querySelector('.allocation-list');
      if (!listContainer) return;

      const updatedAllocations = [];
      const items = listContainer.querySelectorAll('[data-allocation-id]');
      
      items.forEach(item => {
        const allocationId = item.getAttribute('data-allocation-id');
        const percentageInput = item.querySelector('input[type="number"]');
        
        if (percentageInput && allocationId !== 'unallocated') {
          updatedAllocations.push({
            id: allocationId,
            percentage: parseFloat(percentageInput.value)
          });
        }
      });

      try {
        if (updatedAllocations.length === 0) {
          toggleRebalanceMode();
          return;
        }

        console.log('Saving rebalance changes:', updatedAllocations);
        
        // Send updates to backend
        const response = await fetch('/api/monitors/allocation/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ updates: updatedAllocations })
        });
        
        console.log('Response status:', response.status);
        console.log('Response ok:', response.ok);

        if (response.ok) {
          const result = await response.json();
          console.log('Save result:', result);
          
          // Exit rebalance mode
          toggleRebalanceMode();
          
          // Reload allocation data to reflect changes
          await loadAllocationData();
        } else {
          const errorText = await response.text();
          console.error('Failed to save allocation changes:', errorText);
          alert('Failed to save changes. Please try again.');
        }
        
      } catch (error) {
        console.error('Error saving rebalance changes:', error);
        alert('Error saving changes. Please try again.');
      }
    }

    // Cancel rebalance changes
    function cancelRebalanceChanges() {
      // Exit rebalance mode (this will restore original values)
      toggleRebalanceMode();
    }

    function updatePortfolioChange() {
      if (allHistoryData.length < 2) {
        document.getElementById('portfolio-change').textContent = '';
        return;
      }

      const filteredData = filterDataByView(allHistoryData, currentView);
      if (filteredData.length < 2) {
        document.getElementById('portfolio-change').textContent = '';
        return;
      }

      // Get first and last values in the filtered data
      const firstValue = filteredData[0].portfolio || 0; // Portfolio values are already in dollars
      const lastValue = filteredData[filteredData.length - 1].portfolio || 0; // Portfolio values are already in dollars
      
      const change = lastValue - firstValue;
      const percentChange = firstValue !== 0 ? (change / firstValue) * 100 : 0;
      
      // Format the consolidated change display
      const changeElement = document.getElementById('portfolio-change');
      const isPositive = change >= 0;
      
      const changeText = `$${Math.abs(change).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} (${percentChange.toFixed(2)}%)`;
      
      changeElement.textContent = changeText;
      changeElement.className = `change-element ${isPositive ? 'positive' : 'negative'}`;
    }

          portfolioElement.textContent = 'Error loading data';
          portfolioElement.style.color = '#ff6b6b';

    async function loadPortfolioHistory() {
      try {
        const response = await fetch(`${window.location.origin}/api/portfolio/history?period=1y`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        const history = data.data || []; // The portfolio/history endpoint returns data in 'data' field

    // Function to apply a simple moving average
    function applyMovingAverage(data, windowSize) {
      if (windowSize <= 1) {
        return data; // No smoothing needed
      }

      const smoothedData = [];
      for (let i = 0; i < data.length; i++) {
        const start = Math.max(0, i - windowSize + 1);
        const window = data.slice(start, i + 1);
        const sum = window.reduce((a, b) => a + b, 0);
        smoothedData.push(sum / window.length);
      }
      return smoothedData;
    }

        return formatLabel(date, currentView);

      // Apply moving average for smoothing
      const smoothingWindow = currentView === '1d' ? 4 : 60; // Less smoothing for 1d view
      const smoothedPortfolioData = applyMovingAverage(portfolioData, smoothingWindow);
      
      // Ensure the last value is the actual current value (not smoothed)
      if (smoothedPortfolioData.length > 0 && portfolioData.length > 0) {
        smoothedPortfolioData[smoothedPortfolioData.length - 1] = portfolioData[portfolioData.length - 1];
      }
      
      // Custom plugin to add X-axis label at the rightmost point
      const customPlugin = {
        id: 'customXAxisLabel',
        afterDraw: function(chart) {
          // Don't add extra label for 1d view since we have hourly labels
          if (currentView === '1d') return;
          
          const ctx = chart.ctx;
          const chartArea = chart.chartArea;
          
          // Get the last data point

          // Position at the right edge of the chart with more padding
          const x = chartArea.right - 30;

          ctx.save();

          ctx.fillStyle = '#ccc';
          ctx.textAlign = 'right';
          ctx.fillText(lastLabel, x, y);
          ctx.restore();
        }
      };

      // Custom plugin to add crosshair on hover with fade effect
      const crosshairPlugin = {
        id: 'crosshair',
        afterDraw: function(chart) {
          // Check if tooltip is active (this is how Chart.js tracks hover state)
          if (chart.tooltip && chart.tooltip.opacity > 0) {
            const ctx = chart.ctx;
            const chartArea = chart.chartArea;
            const dataset = chart.getDatasetMeta(0);
            
            // Get the active data point from tooltip
            if (chart.tooltip.dataPoints && chart.tooltip.dataPoints.length > 0) {
              const dataPoint = dataset.data[chart.tooltip.dataPoints[0].dataIndex];
              
              if (dataPoint) {
                // Use tooltip opacity for fade effect
                const opacity = chart.tooltip.opacity;
                
                // Draw vertical line with fade
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.strokeStyle = '#4a9eff';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); // Dashed line
                ctx.beginPath();
                ctx.moveTo(dataPoint.x, chartArea.top);
                ctx.lineTo(dataPoint.x, chartArea.bottom);
                ctx.stroke();
                ctx.restore();
                
                // Draw horizontal line with fade
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.strokeStyle = '#4a9eff';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); // Dashed line
                ctx.beginPath();
                ctx.moveTo(chartArea.left, dataPoint.y);
                ctx.lineTo(chartArea.right, dataPoint.y);
                ctx.stroke();
                ctx.restore();
                
                // Draw intersection dot with fade
                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#4a9eff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(dataPoint.x, dataPoint.y, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
              }
            }
          }
        }
      };

      // Plugin for custom Y-axis labels inside chart area
      const yAxisLabelsPlugin = {
        id: 'customYAxisLabels',
        afterDraw: function(chart) {
          const ctx = chart.ctx;
          const chartArea = chart.chartArea;
          
          // Get Y-axis scale
          const yScale = chart.scales.y;
          if (!yScale) return;
          
          // Define which ticks to show (every 2nd tick, but exclude the top tick)
          const ticks = yScale.ticks;
          const visibleTicks = ticks.filter((tick, index) => index % 2 === 0 && index < ticks.length - 1);
          
          ctx.save();
          ctx.font = '10px Arial';
          ctx.fillStyle = '#ccc';
          ctx.textAlign = 'left';
          
          visibleTicks.forEach(tick => {
            const y = yScale.getPixelForValue(tick.value);
            
            // Only draw if the tick is within the chart area
            if (y >= chartArea.top && y <= chartArea.bottom) {
              const label = '$' + Math.round(tick.value).toLocaleString();
              ctx.fillText(label, chartArea.left + 5, y + 3);
            }
          });
          
          ctx.restore();
        }
      };

      // Plugin to add glow effect to the line
      const glowPlugin = {
        id: 'glowEffect',
        beforeDraw: function(chart) {
          const ctx = chart.ctx;
          const dataset = chart.getDatasetMeta(0);
          
          if (dataset && dataset.data && dataset.data.length > 0) {
            // Apply glow effect by drawing the line multiple times with increasing blur
            ctx.save();
            
            // Draw glow layers
            for (let i = 3; i >= 1; i--) {
              ctx.shadowColor = 'rgba(74, 158, 255, 0.3)';
              ctx.shadowBlur = i * 5;
              ctx.shadowOffsetX = 0;
              ctx.shadowOffsetY = 0;
              
              ctx.strokeStyle = '#4a9eff';
              ctx.lineWidth = 2;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              
              ctx.beginPath();
              const firstPoint = dataset.data[0];
              ctx.moveTo(firstPoint.x, firstPoint.y);
              
              for (let j = 1; j < dataset.data.length; j++) {
                const point = dataset.data[j];
                ctx.lineTo(point.x, point.y);
              }
              
              ctx.stroke();
            }
            
            ctx.restore();
          }
        }
      };
      
      // Create chart configuration
      const config = {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Portfolio Value ($)',
            data: smoothedPortfolioData, // Use smoothed data here
            borderColor: '#4a9eff',

        plugins: [customPlugin, crosshairPlugin, yAxisLabelsPlugin, glowPlugin],
        options: {

            const canvas = event.native.target;

    function filterDataByView(data, view) {
      const now = new Date();
      let startDate;
      
      switch (view) {
        case '1d':
          // Current day starting at 06:00
          startDate = new Date(now);
          startDate.setHours(6, 0, 0, 0);
          
          // For 1d view, create 15-minute data points from 06:00 to current time
          if (data.length > 0) {
            const quarterHourlyData = [];
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            
            for (let hour = 6; hour <= currentHour; hour++) {
              for (let minute = 0; minute < 60; minute += 15) {
                // Skip if this time is in the future
                if (hour === currentHour && minute > currentMinute) break;
                
                const timeDate = new Date(now);
                timeDate.setHours(hour, minute, 0, 0);
                
                // Find the latest data point before or at this time
                const latestData = data.filter(item => {
                  const itemDate = new Date(item.timestamp);
                  return itemDate <= timeDate;
                }).pop();
                
                if (latestData) {
                  quarterHourlyData.push({
                    ...latestData,
                    timestamp: timeDate.toISOString()
                  });
                }
              }
            }
            return quarterHourlyData;
          }
          break;
        case '1w':
          // Previous 7 days
          startDate = new Date(now);
          startDate.setDate(startDate.getDate() - 7);
          break;
        case '1m':
          // Previous 30 days
          startDate = new Date(now);
          startDate.setDate(startDate.getDate() - 30);
          break;
        case '1y':
          // Previous 365 days
          startDate = new Date(now);
          startDate.setDate(startDate.getDate() - 365);
          break;
        case 'all':
        default:
          return data; // Return all data
      }
      
      return data.filter(item => {
        const itemDate = new Date(item.timestamp);
        return itemDate >= startDate;
      });
    }

    function formatLabel(date, view) {
      switch (view) {
        case '1d':
          const hour = date.getHours();
          const minute = date.getMinutes();
          // Show labels at 15-minute intervals
          if (minute % 15 === 0) {
            return hour.toString().padStart(2, '0') + ':' + minute.toString().padStart(2, '0');
          }
          return ''; // Don't show labels for non-15-minute marks
        case '1w':
          const month = date.getMonth() + 1;
          const day = date.getDate();
          return `${month}/${day}`;
        case '1m':
          const month1 = date.getMonth() + 1;
          const day1 = date.getDate();
          return `${month1}/${day1}`;
        case '1y':
          const month2 = date.getMonth() + 1;
          const day2 = date.getDate();
          return `${month2}/${day2}`;
        case 'all':
        default:
          const month3 = date.getMonth() + 1;
          const day3 = date.getDate();
          return `${month3}/${day3}`;
      }
    }

    function formatTooltipTitle(date, view) {
      // Format in Eastern Time to match database timestamps
      const options = { 
        timeZone: 'America/New_York',
        hour12: false 
      };
      
      switch (view) {
        case '1d':
          return date.toLocaleDateString('en-US', { 
            ...options,
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          }) + ' ' + date.toLocaleTimeString('en-US', { 
            ...options,
            hour: '2-digit', 
            minute: '2-digit' 
          });
        case '1w':
          return date.toLocaleDateString('en-US', { 
            ...options,
            month: 'short', 
            day: 'numeric' 
          }) + ' ' + date.toLocaleTimeString('en-US', { 
            ...options,
            hour: '2-digit', 
            minute: '2-digit' 
          });
        case '1m':
          return date.toLocaleDateString('en-US', { 
            ...options,
            month: 'short', 
            day: 'numeric' 
          }) + ' ' + date.toLocaleTimeString('en-US', { 
            ...options,
            hour: '2-digit', 
            minute: '2-digit' 
          });
        case '1y':
          return date.toLocaleDateString('en-US', { 
            ...options,
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          });
        case 'all':
        default:
          return date.toLocaleDateString('en-US', { 
            ...options,
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          });
      }
    }

      // Clear previous chart
      container.innerHTML = '';
      
      // Filter out monitors with 0% allocation
      const activeAllocations = allocations.filter(alloc => alloc.bankroll_pct > 0);
      console.log('Active allocations:', activeAllocations);
      
      // Calculate total allocated percentage
      const totalAllocated = activeAllocations.reduce((sum, alloc) => sum + alloc.bankroll_pct, 0);
      const unallocatedPct = Math.max(0, 100 - totalAllocated);
      
      // Add unallocated segment if there's unallocated percentage
      let chartData = [...activeAllocations];
      if (unallocatedPct > 0) {
        chartData.push({
          id: 'unallocated',
          name: 'unallocated',
          symbol: 'UNALLOCATED',
          strategy: 'Available',
          bankroll_pct: unallocatedPct
        });
      }
      
      // Sort by allocation percentage (highest to lowest)
      chartData.sort((a, b) => b.bankroll_pct - a.bankroll_pct);
      
      console.log('Chart data with unallocated:', chartData);
      
      if (chartData.length === 0) {
        container.innerHTML = '<div style="color: #a0aec0; font-size: 14px; text-align: center; padding-top: 150px;">No active allocations</div>';
        return;
      }
      
      // Chart dimensions
      const width = 300;
      const height = 300;
      const radius = Math.min(width, height) / 2 - 20;
      const explodeDistance = 8; // Distance to pull each slice away from center
      const gapWidth = 3; // Pixel width of gaps between slices
      
      // Create SVG
      try {
        const svg = d3.select(container)
          .append('svg')
          .attr('width', width)
          .attr('height', height)
          .style('display', 'block')
          .style('margin', '0 auto');
        
        // Add glow filter definition
        const defs = svg.append('defs');
        const glowFilter = defs.append('filter')
          .attr('id', 'glow')
          .attr('x', '-50%')
          .attr('y', '-50%')
          .attr('width', '200%')
          .attr('height', '200%');
        
        glowFilter.append('feGaussianBlur')
          .attr('stdDeviation', '2')
          .attr('result', 'coloredBlur');
        
        const feMerge = glowFilter.append('feMerge');
        feMerge.append('feMergeNode').attr('in', 'coloredBlur');
        feMerge.append('feMergeNode').attr('in', 'SourceGraphic');
        
        const g = svg.append('g')
          .attr('transform', `translate(${width/2},${height/2})`);
        
        console.log('SVG created successfully');
      
      // Colors
      const colors = [
        '#4a9eff', '#48bb78', '#f56565', '#ed8936', '#9f7aea', 
        '#38b2ac', '#e53e3e', '#d69e2e', '#805ad5', '#319795'
      ];
      
      // Calculate total for percentages
      const total = d3.sum(chartData, d => d.bankroll_pct);
      
      // Create pie generator
      const pie = d3.pie()
        .value(d => d.bankroll_pct)
        .sort(null);
      
      // Generate pie data
      const pieData = pie(chartData);
      
      // Calculate gap angles to maintain consistent visual width
      const gapAngles = pieData.map((d, i) => {
        // Convert pixel gap width to angular gap
        const gapAngle = 2 * Math.asin(gapWidth / (2 * radius));
        return gapAngle;
      });
      
      // Adjust pie data to include gaps
      let currentAngle = 0;
      const adjustedPieData = pieData.map((d, i) => {
        const startAngle = currentAngle;
        const endAngle = currentAngle + d.endAngle - d.startAngle - gapAngles[i];
        currentAngle = d.endAngle;
        
        return {
          ...d,
          startAngle: startAngle,
          endAngle: endAngle
        };
      });
      
      // Create arc generator for exploded pie chart
      const arc = d3.arc()
        .innerRadius(0)
        .outerRadius(radius);
      
      // Create arcs
      const arcs = g.selectAll('.arc')
        .data(adjustedPieData)
        .enter()
        .append('g')
        .attr('class', 'arc');
      
      // Calculate explosion offset for each slice
      arcs.each(function(d, i) {
        const centroid = arc.centroid(d);
        const angle = (d.startAngle + d.endAngle) / 2;
        const x = Math.cos(angle - Math.PI / 2) * explodeDistance;
        const y = Math.sin(angle - Math.PI / 2) * explodeDistance;
        
        d3.select(this)
          .attr('transform', `translate(${x}, ${y})`);
      });
      
      // Add paths
      arcs.append('path')
        .attr('d', arc)
        .attr('data-allocation-id', d => d.data.id)
        .attr('fill', (d, i) => d.data.id === 'unallocated' ? '#6b7280' : colors[i % colors.length])

              monitorTile.style.boxShadow = '0 0 5px rgba(74, 158, 255, 0.05)';

          // Highlight the corresponding allocation list item (only div elements, not path elements)

      if (portfolioElement) {

        const match = text.match(/\$([\d,]+\.?\d*)/);
        if (match) {
          return parseFloat(match[1].replace(/,/g, ''));
        }
      }
      // Fallback to a default value if we can't parse the portfolio
      return 1871.27; // Default value from your dummy data
    }

    // Function to check and update auto trade status every 10 seconds
    async function checkAutoTradeStatus() {
      try {
        // Fetch current monitor data to get latest auto trade status
        const response = await fetch('/api/monitors?user_id=user_0001');
        if (response.ok) {
          const data = await response.json();
          const currentMonitors = data.monitors || [];
          
          // Update local monitor data with latest auto trade status and toggle state
          currentMonitors.forEach(apiMonitor => {
            const localMonitor = monitors.find(m => m.id === apiMonitor.id);
            if (localMonitor) {
              // Update auto trade status if changed
              if (localMonitor.auto_trade_status !== apiMonitor.auto_trade_status) {
                console.log(`Auto trade status changed for ${apiMonitor.id}: ${localMonitor.auto_trade_status} -> ${apiMonitor.auto_trade_status}`);
                localMonitor.auto_trade_status = apiMonitor.auto_trade_status;
                
                // Update the visual status indicator
                const statusElement = document.querySelector(`[data-monitor-id="${apiMonitor.id}"] .monitor-status`);
                if (statusElement) {
                  statusElement.className = `monitor-status ${getStatusClass(apiMonitor.auto_trade_status)}`;
                  statusElement.textContent = apiMonitor.auto_trade_status.toUpperCase();
                }
              }
              
              // Update auto trade toggle state if changed
              if (localMonitor.autoTrade !== apiMonitor.autoTrade) {
                console.log(`Auto trade toggle changed for ${apiMonitor.id}: ${localMonitor.autoTrade} -> ${apiMonitor.autoTrade}`);
                localMonitor.autoTrade = apiMonitor.autoTrade;
                
                // Update the visual toggle state
                const toggleElement = document.querySelector(`[data-monitor-id="${apiMonitor.id}"] .auto-trade-toggle`);
                if (toggleElement) {
                  if (apiMonitor.autoTrade) {
                    toggleElement.classList.add('active');
                  } else {
                    toggleElement.classList.remove('active');
                  }
                } else {
                  // Try alternative selector using onclick attribute
                  const altToggleElement = document.querySelector(`[onclick*="toggleAutoTrade('${apiMonitor.id}')"]`);
                  if (altToggleElement) {
                    if (apiMonitor.autoTrade) {
                      altToggleElement.classList.add('active');
                    } else {
                      altToggleElement.classList.remove('active');
                    }
                  }
                }
              }
            }
          });
        }
      } catch (error) {
        console.error('Error checking auto trade status:', error);
      }
    }

    // Market data functions
    function formatUSD(val) {
      if (typeof val !== "number" || isNaN(val)) return "$0.00";
      return "$" + val.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function decorateChange(el, val) {
      const num = parseFloat(val);
      if (isNaN(num)) {
        el.textContent = "—";
        el.className = "";
        return;
      }
      const triangle = num >= 0 ? " ▲" : " ▼";
      el.textContent = `${Math.abs(num).toFixed(2)}%${triangle}`;
      el.className = num >= 0 ? "" : "negative";
    }

    // Helper function to extract numeric monitor ID from full monitor ID
    function extractMonitorId(fullMonitorId) {
      if (!fullMonitorId) return null;
      if (fullMonitorId === 'NEW_MONITOR') return fullMonitorId;
      
      // Handle MON_0001_24078 format
      if (fullMonitorId.includes('_') && fullMonitorId.startsWith('MON_')) {
        const parts = fullMonitorId.split('_');
        if (parts.length >= 3) {
          return parts[2]; // Return the numeric part (24078)
        }
      }
      
      // If it's already just a numeric ID, return as is
      return fullMonitorId;
    }
