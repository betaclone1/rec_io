                console.log('Message sent to trade history frame for monitor:', monitorId);
                
                // Also send a message to reset all other dropdowns to ALL values and set date range
                const resetMessage = {
                  type: 'RESET_DROPDOWNS',
                  dateRange: currentView // Pass the current dashboard date range
                };
                console.log('Sending reset message:', resetMessage);
                tradeHistoryFrame.contentWindow.postMessage(resetMessage, '*');
                console.log('Reset message sent to trade history frame with date range:', currentView);
              } else {
                // If not ready, try again in 50ms
                console.log('Frame not ready, retrying in 50ms...');
                setTimeout(sendMessage, 50);
              }
            } catch (error) {
              console.error('Error sending message to trade history frame:', error);
              // Try again in 100ms if there was an error
              setTimeout(sendMessage, 100);
            }
          };
          
          // Start trying to send the message
          sendMessage();
        }
      }
    }

    // Switch to trade monitor tab with specific monitor selected
    function switchToTradeMonitor(monitorId) {
      console.log('Switching to trade monitor for:', monitorId);
      
      // Extract numeric ID from full monitor ID (e.g., "mon_0001_10002" -> "10002")
      const numericId = monitorId.replace(/^mon_\d+_/, '');
      console.log('Extracted numeric ID:', numericId);
      
      // Get the parent window (index.html)
      const parentWindow = window.parent;
      
      // Get the trade monitor frame BEFORE switching tabs
      const tradeMonitorFrame = parentWindow.document.getElementById('tradeMonitorFrame');
      
      // Set the dropdown value BEFORE switching tabs to avoid flicker
      const setDropdownValue = () => {
        try {
          if (tradeMonitorFrame && tradeMonitorFrame.contentWindow && tradeMonitorFrame.contentWindow.document.readyState === 'complete') {
            const monitorPicker = tradeMonitorFrame.contentWindow.document.getElementById('monitor-picker');
            if (monitorPicker && monitorPicker.options.length > 0) {
              const monitorExists = Array.from(monitorPicker.options).some(option => option.value === numericId);
              if (monitorExists) {
                console.log('Setting monitor picker to:', numericId, 'BEFORE tab switch');
                monitorPicker.value = numericId;
                // Trigger the change event to load monitor details
                monitorPicker.dispatchEvent(new Event('change'));
                return true;
              }
            }
          }
          return false;
        } catch (error) {
          console.error('Error setting dropdown value:', error);
          return false;
        }
      };
      
      // Try to set the dropdown value immediately
      if (!setDropdownValue()) {
        // If not ready, try a few times with short delays
        let attempts = 0;
        const trySetValue = () => {
          attempts++;
          if (setDropdownValue() || attempts >= 5) {
            // Now switch to trade monitor tab (like clicking the sidebar menu)
            const tradeMonitorNavItem = parentWindow.document.querySelector('[data-page="trade-monitor"]');
            if (tradeMonitorNavItem) {
              // Remove active class from all nav items
              const allNavItems = parentWindow.document.querySelectorAll('.nav-item');
              allNavItems.forEach(item => item.classList.remove('active'));
              
              // Add active class to trade monitor nav item
              tradeMonitorNavItem.classList.add('active');
              
              // Hide all frames
              const allFrames = parentWindow.document.querySelectorAll('.content-frame');
              allFrames.forEach(frame => frame.classList.remove('active'));
              
              // Show trade monitor frame
              tradeMonitorFrame.classList.add('active');
            }
          } else {
            setTimeout(trySetValue, 10);
          }
        };
        trySetValue();
      } else {
        // Dropdown was set successfully, now switch tabs
        const tradeMonitorNavItem = parentWindow.document.querySelector('[data-page="trade-monitor"]');
        if (tradeMonitorNavItem) {
          // Remove active class from all nav items
          const allNavItems = parentWindow.document.querySelectorAll('.nav-item');
          allNavItems.forEach(item => item.classList.remove('active'));
          
          // Add active class to trade monitor nav item
          tradeMonitorNavItem.classList.add('active');
          
          // Hide all frames
          const allFrames = parentWindow.document.querySelectorAll('.content-frame');
          allFrames.forEach(frame => frame.classList.remove('active'));
          
          // Show trade monitor frame
          tradeMonitorFrame.classList.add('active');
        }
      }
    }

    // Initialize market data on page load
    document.addEventListener('DOMContentLoaded', function() {
      // Fetch initial data
      fetchBTCCurrentPrice();
      fetchETHCurrentPrice();
      fetchBTCPriceChanges();
      fetchETHPriceChanges();
      
      // Update data every 30 seconds
      setInterval(() => {
        fetchBTCCurrentPrice();
        fetchETHCurrentPrice();
        fetchBTCPriceChanges();
        fetchETHPriceChanges();
      }, 30000);
    });

    // Archive confirmation modal functions
    function showArchiveConfirmation(monitorId, monitorName) {
      console.log('showArchiveConfirmation called');
      const modal = document.getElementById('archiveModal');
      if (modal) {
        console.log('Showing archive confirmation modal');
        const monitorNumber = monitorName.slice(-5); // Extract the last 5 characters as monitor number
        document.getElementById('archiveModalText').textContent = `Are you sure you want to archive Monitor ${monitorNumber}?`;
        document.getElementById('archiveModal').setAttribute('data-monitor-id', monitorId);
        document.getElementById('archiveModal').setAttribute('data-monitor-name', monitorName);
        modal.style.display = 'flex';
        
        // Add keyboard event listeners for ENTER and ESC
        const handleKeyDown = (event) => {
          console.log('Key pressed:', event.key, 'Modal display:', modal.style.display);
          // Only handle keyboard events if the modal is visible
          if (modal.style.display !== 'flex') {
            console.log('Modal not visible, ignoring key press');
            return;
          }
          
          if (event.key === 'Enter') {
            event.preventDefault();
            console.log('ENTER pressed - triggering confirm');
            // Trigger confirm button click
            const confirmButton = document.querySelector('.modal-btn-confirm');
            console.log('Confirm button found:', confirmButton);
            if (confirmButton) {
              confirmButton.click();
            }
          } else if (event.key === 'Escape') {
            event.preventDefault();
            console.log('ESC pressed - triggering cancel');
            // Trigger cancel button click
            const cancelButton = document.querySelector('.modal-btn-cancel');
            console.log('Cancel button found:', cancelButton);
            if (cancelButton) {
              cancelButton.click();
            }
          }
        };
        
        // Add event listener to document for global keyboard handling
        document.addEventListener('keydown', handleKeyDown);
        console.log('Keyboard event listener attached to document');
        
        // Store the handler reference for cleanup
        modal._keydownHandler = handleKeyDown;
      } else {
        console.log('archiveModal not found');
      }
    }

    function hideArchiveModal() {
      console.log('hideArchiveModal called');
      const modal = document.getElementById('archiveModal');
      if (modal) {
        console.log('Hiding archive confirmation modal');
        modal.style.display = 'none';
        
        // Clean up keyboard event listener
        if (modal._keydownHandler) {
          document.removeEventListener('keydown', modal._keydownHandler);
          delete modal._keydownHandler;
        }
      } else {
        console.log('archiveModal not found');
      }
    }

    function confirmArchive() {
      const modal = document.getElementById('archiveModal');
      const monitorId = modal.getAttribute('data-monitor-id');
      const monitorName = modal.getAttribute('data-monitor-name');
      
      // Call the archive API
      archiveMonitor(monitorId, monitorName);
      
      // Hide the modal
      hideArchiveModal();
    }

    async function archiveMonitor(monitorId, monitorName) {
      try {
        const response = await fetch('/api/monitor/archive', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            monitor_id: monitorId,
            monitor_name: monitorName,
            user_id: 'user_0001'
          })
        });

        const result = await response.json();
        
        if (result.status === 'ok') {
          console.log('Monitor archived successfully:', monitorName);
          // Refresh the dashboard to hide the archived monitor
          await loadMonitors(); // Fetch fresh data from backend
          initializeMonitors(); // Re-render with updated data
        } else {
          console.error('Failed to archive monitor:', result.message);
          alert('Failed to archive monitor: ' + result.message);
        }
      } catch (error) {
        console.error('Error archiving monitor:', error);
        alert('Error archiving monitor: ' + error.message);
      }
    }

    async function deactivateMonitor(monitorId, monitorName) {
      try {
        const response = await fetch('/api/monitor/deactivate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            monitor_id: monitorId,
            monitor_name: monitorName,
            user_id: 'user_0001'
          })
        });

        const result = await response.json();
        
        if (result.status === 'ok') {
          console.log('Monitor deactivated successfully:', monitorName);
          // Refresh the dashboard to show updated status
          await loadMonitors(); // Fetch fresh data from backend
          initializeMonitors(); // Re-render with updated data
        } else {
          console.error('Failed to deactivate monitor:', result.message);
          alert('Failed to deactivate monitor: ' + result.message);
        }
      } catch (error) {
        console.error('Error deactivating monitor:', error);
        alert('Error deactivating monitor: ' + error.message);
      }
    }

    async function toggleMonitorStatus(monitorId, monitorName, currentStatus) {
      try {
        const isActive = currentStatus === 'active';
        const endpoint = isActive ? '/api/monitor/deactivate' : '/api/monitor/activate';
        const action = isActive ? 'deactivate' : 'activate';
        
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            monitor_id: monitorId,
            monitor_name: monitorName,
            user_id: 'user_0001'
          })
        });

        const result = await response.json();
        
        if (result.status === 'ok') {
          console.log(`Monitor ${action}d successfully:`, monitorName);
          // Refresh the dashboard to show updated status
          await loadMonitors(); // Fetch fresh data from backend
          initializeMonitors(); // Re-render with updated data
        } else {
          console.error(`Failed to ${action} monitor:`, result.message);
          alert(`Failed to ${action} monitor: ` + result.message);
        }
      } catch (error) {
        console.error(`Error ${action}ing monitor:`, error);
        alert(`Error ${action}ing monitor: ` + error.message);
      }
    }

    // New Monitor Modal Functions
    function showNewMonitorModal() {
      const modal = document.getElementById('newMonitorModal');
      if (modal) {
        modal.style.display = 'flex';
        loadSymbolOptions();
        loadStrategyOptions();
      }
    }

    function hideNewMonitorModal() {
      const modal = document.getElementById('newMonitorModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    async function loadSymbolOptions() {
      try {
        console.log('Loading symbol options...');
        const response = await fetch('/api/symbols');
        const data = await response.json();
        console.log('Symbol data received:', data);
        
        const symbolSelect = document.getElementById('newMonitorSymbol');
        if (symbolSelect && data.status === 'ok') {
          symbolSelect.innerHTML = '<option value="">Select Symbol</option>';
          console.log('Symbols array:', data.symbols);
          data.symbols.forEach(symbol => {
            console.log('Processing symbol:', symbol, 'Type:', typeof symbol);
            const option = document.createElement('option');
            option.value = symbol;
            option.textContent = symbol;
            symbolSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading symbol options:', error);
      }
    }

    async function loadStrategyOptions() {
      try {
        const response = await fetch('/api/strategies');
        const data = await response.json();
        
        const strategySelect = document.getElementById('newMonitorStrategy');
        if (strategySelect && data.status === 'ok') {
          strategySelect.innerHTML = '<option value="">Select Strategy</option>';
          data.strategies.forEach(strategy => {
            const option = document.createElement('option');
            option.value = strategy;
            option.textContent = strategy;
            strategySelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading strategy options:', error);
      }
    }

    function confirmNewMonitor() {
      const symbol = document.getElementById('newMonitorSymbol').value;
      const strategy = document.getElementById('newMonitorStrategy').value;
      const bankrollPct = document.getElementById('newMonitorBankroll').value;
      const positionSize = document.getElementById('newMonitorPositionSize').value;
      const multiplier = document.getElementById('newMonitorMultiplier').value;
      
      if (!symbol || !strategy) {
        alert('Please select both Symbol and Strategy');
        return;
      }
      
      if (!bankrollPct || !positionSize || !multiplier) {
        alert('Please fill in all fields');
        return;
      }
      
      createNewMonitor(symbol, strategy, bankrollPct, positionSize, multiplier);
      hideNewMonitorModal();
    }

    async function createNewMonitor(symbol, strategy, bankrollPct, positionSize, multiplier) {
      try {
        const response = await fetch('/api/monitor/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            symbol: symbol,
            strategy: strategy,
            bankroll_allotment_pct: parseInt(bankrollPct),
            position_size: parseInt(positionSize),
            multiplier: parseFloat(multiplier),
            user_id: 'user_0001'
          })
        });

        const result = await response.json();
        
        if (result.status === 'ok') {
          console.log('Monitor created successfully:', result.monitor_name);
          await loadMonitors();
          initializeMonitors();
        } else {
          console.error('Failed to create monitor:', result.message);
          alert('Failed to create monitor: ' + result.message);
        }
      } catch (error) {
        console.error('Error creating monitor:', error);
        alert('Error creating monitor: ' + error.message);
      }
    }

    // WebSocket connection for real-time updates
    let ws = null;

    // Store cooldown timers for each monitor
    const cooldownTimers = new Map();

    // Helper function to get CSS class for auto trade status
    function getStatusClass(status) {
      const statusLower = status.toLowerCase();
      if (statusLower === 'active') return 'active';
      if (statusLower === 'inactive') return 'inactive';
      if (statusLower === 'disabled') return 'disabled';
      if (statusLower === 'paused') return 'paused';
      return ''; // Default no class
    }

    // Helper function to format cooldown timer as MM:SS
    function formatCooldownTimer(seconds) {
      if (!seconds || seconds <= 0) return '';
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Helper function to get status text with optional timer
    function getStatusText(status, monitorId) {
      const statusUpper = status.toUpperCase();
      if (statusUpper === 'PAUSED') {
        const timer = cooldownTimers.get(monitorId);
        if (timer && timer > 0) {
          return formatCooldownTimer(timer);
        }
      }
      return statusUpper;
    }

    function connectWebSocket() {
      // Close existing connection if any
      if (ws) {
        ws.close();
      }

      // Connect to WebSocket
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}/ws/preferences`);

      ws.onopen = function() {
        console.log('Dashboard WebSocket connected');
        console.log('WebSocket URL:', `${protocol}//${window.location.host}/ws/preferences`);
      };

      ws.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          console.log('WebSocket message received:', data);
          
          // Handle auto trade toggle updates
          if (data.type === 'auto_trade_toggled') {
            console.log('Auto trade toggle received:', data);
            
            // Convert backend format (MON_0001_10002) to frontend format (mon_0001_10002)
            const backendMonitorId = data.monitor_id; // e.g., MON_0001_10002
            const frontendMonitorId = backendMonitorId.replace('MON_', 'mon_'); // e.g., mon_0001_10002
            
            console.log('Converting monitor ID:', backendMonitorId, '->', frontendMonitorId);
            
            // Find the monitor in local data and update it
            const monitor = monitors.find(m => m.id === frontendMonitorId);
            if (monitor) {
              monitor.autoTrade = data.auto_trade;
              console.log('Updated monitor', frontendMonitorId, 'autoTrade to:', data.auto_trade);
              
              // Update the visual state of the toggle
              const toggleElement = document.querySelector(`[data-monitor-id="${frontendMonitorId}"] .auto-trade-toggle`);
              if (toggleElement) {
                if (data.auto_trade) {
                  toggleElement.classList.add('active');
                } else {
                  toggleElement.classList.remove('active');
                }
                console.log('Updated toggle visual state for', frontendMonitorId);
              } else {
                console.warn('Toggle element not found for monitor:', frontendMonitorId);
              }
            } else {
              console.warn('Monitor not found in local data:', frontendMonitorId);
              console.log('Available monitor IDs:', monitors.map(m => m.id));
            }
          }
          
          // Handle monitor list updates
          if (data.type === 'monitor_list_updated') {
            // Refresh monitors data to update the display
            loadMonitors().then(() => {
              initializeMonitors();
            });
          }
          
          // Handle cooldown timer changes
          if (data.type === 'cooldown_timer_change') {
            console.log('Cooldown timer change received:', data);
            
            const monitorId = data.data.monitor_id;
            const cooldownTimer = data.data.cooldown_timer;
            
            // Store the cooldown timer value
            cooldownTimers.set(monitorId, cooldownTimer);
            console.log(`Stored cooldown timer for ${monitorId}: ${cooldownTimer}s`);
            
            // Update the display if monitor is currently PAUSED
            const monitor = monitors.find(m => m.id === monitorId);
            if (monitor && (monitor.auto_trade_status === 'PAUSED' || monitor.auto_trade_status === 'paused')) {
              const statusElement = document.querySelector(`[data-monitor-id="${monitorId}"] .monitor-status`);
              if (statusElement) {
                statusElement.textContent = getStatusText('PAUSED', monitorId);
                console.log(`Updated timer display for ${monitorId}`);
              }
            }
          }
          
          // Handle auto trade status changes from auto_entry_supervisor
          if (data.type === 'auto_trade_status_change') {
            console.log('Auto trade status change received:', data);
            console.log('Available monitor IDs:', monitors.map(m => m.id));
            console.log('Looking for monitor ID:', data.data.monitor_id);
            
            // Find the monitor in local data and update its auto_trade_status
            const monitor = monitors.find(m => m.id === data.data.monitor_id);
            if (monitor) {
              monitor.auto_trade_status = data.data.auto_trade_status;
              
              // Clear cooldown timer if status is not PAUSED
              if (data.data.auto_trade_status.toUpperCase() !== 'PAUSED') {
                cooldownTimers.delete(data.data.monitor_id);
              }
              
              // Update the visual status indicator
              const statusElement = document.querySelector(`[data-monitor-id="${data.data.monitor_id}"] .monitor-status`);
              if (statusElement) {
                // Update the CSS classes and text content
                statusElement.className = `monitor-status ${getStatusClass(data.data.auto_trade_status)}`;
                statusElement.textContent = getStatusText(data.data.auto_trade_status, data.data.monitor_id);
              }
              
              console.log(`Updated monitor ${data.data.monitor_id} auto trade status to: ${data.data.auto_trade_status}`);
            } else {
              console.warn(`Monitor ${data.data.monitor_id} not found for status update`);
            }
          }
        } catch (error) {
          console.error('Error parsing WebSocket message in dashboard:', error);
        }
      };

      ws.onclose = function() {
        // Reconnect after a delay
        setTimeout(connectWebSocket, 5000);
      };

      ws.onerror = function(error) {
        console.error('Dashboard WebSocket error:', error);
      };
    }


  </script>
