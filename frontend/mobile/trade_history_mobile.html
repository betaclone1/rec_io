    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #101018;
            color: white;
            overflow-x: hidden;
        }

        .mobile-container {
            padding: 10px;
            max-width: 100vw;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 10px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 6px 10px;
            border: 1px solid #787878;
            background-color: #1f2530;
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        /* Toggle Switch Styles */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4a5568;
            transition: .4s;
            border-radius: 20px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #007bff;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        /* Hide elements when % Mode is ON */
        .percent-mode .pnl-panel {
            display: none !important;
        }

        /* Show Avg % panel when % Mode is ON */
        .percent-mode .avg-percent-panel {
            display: block !important;
        }

        .percent-mode .position-column,
        .percent-mode .fees-column,
        .percent-mode .pnl-column {
            display: none !important;
        }

        /* Summary Section */
        .summary-section {
            margin-bottom: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: center;
        }

        .summary-item {
            padding: 10px;
            background-color: #1f2530;
            border-radius: 4px;
        }

        .summary-label {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        /* Results Section */
        .results-section {
            height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid #787878;
            padding: 6px 10px;
            text-align: center;
        }

        .results-table th {
            background-color: #1f2530;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            position: relative;
        }

        /* Remove default alternating row colors to allow group-based coloring */
        .results-table tbody tr {
            background-color: transparent;
        }

        .results-table tbody tr:hover:not(.test-filter-trade-row) {
            background-color: #4d586f !important;
            cursor: pointer;
        }

        .results-table tbody tr.test-filter-trade-row:hover {
            cursor: pointer;
        }

        /* Group-based coloring - these should override the transparent background */
        .results-table tbody tr.group-odd {
            background-color: #394559;
        }

        .results-table tbody tr.group-even {
            background-color: #1f2633;
        }

        .results-table tbody tr.paper-trade-row {
            font-style: italic;
        }

        .results-table tbody tr.test-filter-trade-row,
        .results-table tbody tr.test-filter-trade-row td {
            background-color: #3d1418 !important;
        }

        .results-table tbody tr.test-filter-trade-row:hover,
        .results-table tbody tr.test-filter-trade-row:hover td {
            background-color: #4f1a20 !important;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #ccc;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .results-table {
                font-size: 0.6rem;
            }
            
            .results-table th,
            .results-table td {
                padding: 4px 6px;
            }
        }
    </style>

                </div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="summary-section">
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">Ret %</div>
                    <div class="summary-value" id="ret-percentage">0.00%</div>
                </div>
                <div class="summary-item pnl-panel">
                    <div class="summary-label">PnL</div>
                    <div class="summary-value" id="total-pnl">$0.00</div>
                </div>
                <div class="summary-item avg-percent-panel" style="display: none;">
                    <div class="summary-label">Avg %</div>
                    <div class="summary-value" id="avg-percent">0.00%</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Trades</div>
                    <div class="summary-value" id="trade-count">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">W/L %</div>
                    <div class="summary-value" id="win-loss-percentage">0%</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Avg Buy</div>
                    <div class="summary-value" id="avg-buy">0.00</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Avg Prob</div>
                    <div class="summary-value" id="avg-prob">0.00</div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div id="trade-history-fetch-banner" style="display:none; padding:8px 10px; background:#4a3728; color:#f6e05e; font-size:12px; margin-bottom:6px; border-radius:4px;" role="status" aria-live="polite"></div>
            <table id="trade-log-table" class="results-table">
                <thead>
                    <tr>
                        <th data-key="id">ID</th>
                        <th data-key="status">Status</th>
                        <th data-key="date">Date</th>
                        <th data-key="time">Time</th>
                        <th data-key="symbol">Symbol</th>
                        <th data-key="trade_strategy">Strategy</th>
                        <th data-key="contract">Contract</th>
                        <th data-key="strike">Strike</th>
                        <th data-key="side">Side</th>
                        <th data-key="prob">Prob</th>
                        <th data-key="diff">Diff</th>
                        <th data-key="buy_price">Buy</th>
                        <th data-key="sell_price">Sell</th>
                        <th data-key="position" class="position-column">Position</th>
                        <th data-key="fees" class="fees-column">Fees</th>
                        <th data-key="pnl" class="pnl-column">PnL</th>
                        <th data-key="ret_pct">Ret</th>
                        <th data-key="closed_at">Closed</th>
                        <th data-key="symbol_open">Symbol Open</th>
                        <th data-key="symbol_close">Symbol Close</th>
                        <th data-key="momentum_percentile">Mom</th>
                        <th data-key="win_loss">W/L</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="23">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentSort = { key: 'id', asc: false };
        let trades = [];
        let filteredTrades = [];

        function displayPnL(trade) {
            if (trade.pnl !== null && trade.pnl !== undefined) {
                return Number(trade.pnl).toFixed(2);
            }
            return '';
        }

        // === DATE FILTER LOGIC ===
        function filterTradesByDate(trades, filter) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const today = `${year}-${month}-${day}`;
            
            // Helper to get the date string for a given day of week in this week
            function getDateOfThisWeek(dayOfWeek) {
                const curr = new Date(now);
                const currDay = curr.getDay();
                const diff = dayOfWeek - currDay;
                curr.setDate(curr.getDate() + diff);
                return formatDate(curr);
            }
            
            // Helper to get the date string for a given day of week in last week
            function getDateOfLastWeek(dayOfWeek) {
                const curr = new Date(now);
                const currDay = curr.getDay();
                // Go to previous Sunday, then add dayOfWeek
                curr.setDate(curr.getDate() - currDay - 7 + dayOfWeek);
                return formatDate(curr);
            }
            
            // Helper to get the latest Sunday (start of this week)
            function getLatestSunday() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay());
                return formatDate(curr);
            }
            
            // Helper to get previous Sunday (start of last week)
            function getPrevSunday() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay() - 7);
                return formatDate(curr);
            }
            
            // Helper to get following Saturday (end of last week)
            function getNextSaturdayOfPrevWeek() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay() - 1); // previous Saturday
                return formatDate(curr);
            }
            
            return trades.filter(trade => {
                if (!trade.date) return false;
                switch (filter) {
                    case 'TODAY':
                        return trade.date === today;
                    case 'THIS_WEEK': {
                        const sunday = getLatestSunday();
                        return trade.date >= sunday && trade.date <= today;
                    }
                    case 'SUNDAY':
                        return trade.date === getDateOfThisWeek(0);
                    case 'MONDAY':
                        return trade.date === getDateOfThisWeek(1);
                    case 'TUESDAY':
                        return trade.date === getDateOfThisWeek(2);
                    case 'WEDNESDAY':
                        return trade.date === getDateOfThisWeek(3);
                    case 'THURSDAY':
                        return trade.date === getDateOfThisWeek(4);
                    case 'FRIDAY':
                        return trade.date === getDateOfThisWeek(5);
                    case 'SATURDAY':
                        return trade.date === getDateOfThisWeek(6);
                    case 'LAST_WEEK': {
                        const prevSunday = getPrevSunday();
                        const nextSaturday = getNextSaturdayOfPrevWeek();
                        return trade.date >= prevSunday && trade.date <= nextSaturday;
                    }
                    case 'MONTH': {
                        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                        const monthStartStr = formatDate(monthStart);
                        return trade.date >= monthStartStr && trade.date <= today;
                    }
                    case 'PREV_30': {
                        const prev30 = new Date(now);
                        prev30.setDate(now.getDate() - 30);
                        const prev30Str = formatDate(prev30);
                        return trade.date >= prev30Str && trade.date <= today;
                    }
                    case 'YTD': {
                        const ytdStr = `${year}-01-01`;
                        return trade.date >= ytdStr && trade.date <= today;
                    }
                    case 'PREV_YEAR': {
                        const prevYear = new Date(now);
                        prevYear.setFullYear(now.getFullYear() - 1);
                        const prevYearStr = formatDate(prevYear);
                        return trade.date >= prevYearStr && trade.date <= today;
                    }
                    case 'CUSTOM': {
                        // Check for custom date inputs
                        const startDateInput = document.getElementById('start-date');
                        const endDateInput = document.getElementById('end-date');
                        const customStartDate = startDateInput ? startDateInput.value : null;
                        const customEndDate = endDateInput ? endDateInput.value : null;
                        
                        // If custom dates are set, use them
                        if (customStartDate && customEndDate) {
                            return trade.date >= customStartDate && trade.date <= customEndDate;
                        }
                        // If no custom dates set, show all trades
                        return true;
                    }
                    default:
                        return true;
                }
            });
        }
        
        // === WIN/LOSS FILTER LOGIC ===
        function filterTradesByWinLoss(trades) {
            const showWin = document.getElementById('filter-win').checked;
            const showLoss = document.getElementById('filter-loss').checked;
            
            return trades.filter(trade => {
                const winLoss = trade.win_loss;
                if (winLoss === 'W' || winLoss === 'Win') {
                    return showWin;
                } else if (winLoss === 'L' || winLoss === 'Loss') {
                    return showLoss;
                }
                // If win_loss is null/undefined/empty, show it regardless of filters
                return true;
            });
        }
        
        // === PAPER TRADE FILTER LOGIC ===
        function filterTradesByPaperTrade(trades) {
            const liveCheckbox = document.getElementById('filter-live');
            const paperCheckbox = document.getElementById('filter-paper');
            
            // If checkboxes don't exist yet, return all trades (no filtering)
            if (!liveCheckbox || !paperCheckbox) {
                return trades;
            }
            
            const showLive = liveCheckbox.checked;
            const showPaper = paperCheckbox.checked;
            
            return trades.filter(trade => {
                const paperTrade = trade.paper_trade;
                
                // Convert to boolean - handle various formats (boolean, string, number, null)
                let isPaperTrade = false;
                if (paperTrade === true || paperTrade === 1 || paperTrade === 'true' || paperTrade === '1' || paperTrade === 'True') {
                    isPaperTrade = true;
                } else if (paperTrade === false || paperTrade === 0 || paperTrade === 'false' || paperTrade === '0' || paperTrade === 'False' || paperTrade === null || paperTrade === undefined) {
                    isPaperTrade = false;
                }
                
                // If it's a paper trade (paper_trade = TRUE), show only if PAPER checkbox is checked
                if (isPaperTrade) {
                    return showPaper;
                }
                // If it's a live trade (paper_trade = FALSE), show only if LIVE checkbox is checked
                return showLive;
            });
        }
        
        // Helper function to format date as YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function applyCurrentSort() {
            if (currentSort.key === null) return;

            filteredTrades.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];

                // Normalize side values for sorting
                if (currentSort.key === 'side') {
                    const mapSide = v => (v === 'Yes' || v === 'Y' ? 'Y' : v === 'No' || v === 'N' ? 'N' : '');
                    valA = mapSide(valA);
                    valB = mapSide(valB);
                }

                // Normalize null/undefined to empty string
                if (valA === null || valA === undefined) valA = '';
                if (valB === null || valB === undefined) valB = '';

                // Try to parse as numbers for numeric fields
                const numericKeys = ['id', 'strike', 'buy_price', 'sell_price', 'position', 'symbol_open', 'symbol_close', 'momentum', 'win_loss', 'pnl', 'prob', 'diff'];
                if (numericKeys.includes(currentSort.key)) {
                    valA = Number(valA);
                    valB = Number(valB);
                    if (isNaN(valA)) valA = -Infinity;
                    if (isNaN(valB)) valB = -Infinity;
                }

                // For date and time, compare as strings (assuming ISO or consistent format)
                // For other strings, localeCompare
                if (typeof valA === 'string' && typeof valB === 'string') {
                    const cmp = valA.localeCompare(valB);
                    return currentSort.asc ? cmp : -cmp;
                } else {
                    if (valA < valB) return currentSort.asc ? -1 : 1;
                    if (valA > valB) return currentSort.asc ? 1 : -1;
                    return 0;
                }
            });
        }

        function sortTrades(key) {
            if (currentSort.key === key) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.key = key;
                currentSort.asc = true;
            }
            applyCurrentSort();
            renderTrades(filteredTrades);
        }

        function formatSummaryNumber(n, fractionDigits) {
            const v = Number(n);
            if (isNaN(v)) return String(n);
            if (Math.abs(v) < 1000) return v.toFixed(fractionDigits);
            return v.toLocaleString('en-US', {
                minimumFractionDigits: fractionDigits,
                maximumFractionDigits: fractionDigits,
            });
        }
        function formatSummaryTradeCount(n) {
            const v = Math.floor(Number(n));
            if (isNaN(v) || Math.abs(v) < 1000) return String(isNaN(v) ? n : v);
            return v.toLocaleString('en-US');
        }
        function formatSummaryPnL(n) {
            const v = Number(n);
            if (isNaN(v)) return '$0.00';
            if (Math.abs(v) < 1000) return `$${v.toFixed(2)}`;
            const neg = v < 0;
            const body = Math.abs(v).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });
            return (neg ? '-$' : '$') + body;
        }

        function updateSummary(trades) {
            const tradeCountEl = document.getElementById('trade-count');
            const avgProbEl = document.getElementById('avg-prob');
            const winLossEl = document.getElementById('win-loss-percentage');
            const totalPnlEl = document.getElementById('total-pnl');
            const retPercentageEl = document.getElementById('ret-percentage');
            const avgBuyEl = document.getElementById('avg-buy');
            const avgPercentEl = document.getElementById('avg-percent');
            
            if (!Array.isArray(trades) || trades.length === 0) {
                tradeCountEl.textContent = '0';
                avgProbEl.textContent = '0.00';
                winLossEl.textContent = '0%';
                totalPnlEl.textContent = '$0.00';
                retPercentageEl.textContent = '0.00%';
                avgBuyEl.textContent = '0.00';
                avgPercentEl.textContent = '0.00%';
                return;
            }
            
            // Count total trades
            const tradeCount = trades.length;
            
            // Calculate average probability
            let totalProb = 0;
            let probCount = 0;
            trades.forEach(trade => {
                if (trade.prob !== null && trade.prob !== undefined && trade.prob !== '') {
                    const prob = Number(trade.prob);
                    if (!isNaN(prob)) {
                        totalProb += prob;
                        probCount++;
                    }
                }
            });
            const avgProb = probCount > 0 ? (totalProb / probCount) : 0; // Keep as percentage
            
            // Calculate win/loss percentage
            let winCount = 0;
            let totalTrades = 0;
            
            trades.forEach(trade => {
                if (trade.win_loss !== null && trade.win_loss !== undefined && trade.win_loss !== '') {
                    // win_loss is stored as 'W' for win, 'L' for loss
                    if (trade.win_loss === 'W' || trade.win_loss === 'L') {
                        totalTrades++;
                        if (trade.win_loss === 'W') winCount++;
                    }
                }
            });
            
            const winPercentage = totalTrades > 0 ? ((winCount / totalTrades) * 100) : 0;
            
            // Calculate average buy price
            let totalBuy = 0;
            let buyCount = 0;
            trades.forEach(trade => {
                if (trade.buy_price !== null && trade.buy_price !== undefined && trade.buy_price !== '') {
                    const buyPrice = Number(trade.buy_price);
                    if (!isNaN(buyPrice)) {
                        totalBuy += buyPrice;
                        buyCount++;
                    }
                }
            });
            const avgBuy = buyCount > 0 ? (totalBuy / buyCount) : 0;
            
            // Calculate Ret %: sum of all ret_pct values from filtered results
            let totalRetPct = 0;
            let retPctCount = 0;
            trades.forEach(trade => {
                if (trade.ret_pct !== null && trade.ret_pct !== undefined && trade.ret_pct !== '') {
                    const retPct = Number(trade.ret_pct);
                    if (!isNaN(retPct)) {
                        totalRetPct += retPct;
                        retPctCount++;
                    }
                }
            });
            const retValue = retPctCount > 0 ? totalRetPct : 0;
            const retPercentage = `${formatSummaryNumber(retValue, 2)}%`;
            
            // Calculate average of all Ret % values
            const avgRetPercent = retPctCount > 0 ? (totalRetPct / retPctCount) : 0;
            
            // Calculate total PnL
            let totalPnlDisplay = 0;
            trades.forEach(trade => {
                if (trade.pnl !== null && trade.pnl !== undefined && trade.pnl !== '') {
                    const pnl = Number(trade.pnl);
                    if (!isNaN(pnl)) {
                        totalPnlDisplay += pnl;
                    }
                }
            });
            
            // Update the display
            tradeCountEl.textContent = formatSummaryTradeCount(tradeCount);
            avgProbEl.textContent = `${formatSummaryNumber(avgProb, 1)}%`;
            winLossEl.textContent = `${formatSummaryNumber(winPercentage, 1)}%`;
            avgBuyEl.textContent = formatSummaryNumber(avgBuy, 2);
            retPercentageEl.textContent = retPercentage;
            avgPercentEl.textContent = `${formatSummaryNumber(avgRetPercent, 2)}%`;
            totalPnlEl.textContent = formatSummaryPnL(totalPnlDisplay);
            
            // Color coding for Ret %
            if (retValue > 0) {
                retPercentageEl.style.color = '#28a745'; // Green for positive
            } else if (retValue < 0) {
                retPercentageEl.style.color = '#dc3545'; // Red for negative
            } else {
                retPercentageEl.style.color = 'white'; // White for zero
            }
            
            // Color coding for Avg %
            if (avgRetPercent > 0) {
                avgPercentEl.style.color = '#28a745'; // Green for positive
            } else if (avgRetPercent < 0) {
                avgPercentEl.style.color = '#dc3545'; // Red for negative
            } else {
                avgPercentEl.style.color = 'white'; // White for zero
            }
            
            // Color coding for PnL
            if (totalPnlDisplay > 0) {
                totalPnlEl.style.color = '#28a745'; // Green for positive
            } else if (totalPnlDisplay < 0) {
                totalPnlEl.style.color = '#dc3545'; // Red for negative
            } else {
                totalPnlEl.style.color = 'white'; // White for zero
            }
        }

        function renderTrades(tradesToRender) {
            const tbody = document.querySelector('#trade-log-table tbody');
            tbody.innerHTML = '';
            if (!Array.isArray(tradesToRender) || tradesToRender.length === 0) {
                const isPercentMode = document.body.classList.contains('percent-mode');
                const colSpan = isPercentMode ? 20 : 23; // 3 fewer columns when % Mode is ON
                tbody.innerHTML = `<tr><td colspan="${colSpan}">No trades found.</td></tr>`;
                updateSummary(tradesToRender); // Update summary even when no trades
                return;
            }

            let lastContract = null;
            let groupIndex = 0;
            for (const trade of tradesToRender) {
                const isNewGroup = trade.contract !== lastContract;
                if (isNewGroup) {
                    groupIndex++;
                }
                lastContract = trade.contract;
                const tr = document.createElement('tr');
                tr.style.borderTop = isNewGroup ? '2px solid #666' : '';
                // Assign group-odd or group-even class based on groupIndex
                tr.classList.add(groupIndex % 2 === 1 ? 'group-odd' : 'group-even');
                if (trade.paper_trade === true || trade.paper_trade === 1 || trade.paper_trade === 'true' || trade.paper_trade === '1' || trade.paper_trade === 'True') {
                    tr.classList.add('paper-trade-row');
                }
                if (trade.test_filter === true || trade.test_filter === 1 || trade.test_filter === 'true' || trade.test_filter === '1') {
                    tr.classList.add('test-filter-trade-row');
                }
                // Helper to format numbers with + sign for positive values, no decimals
                function plusSign(val) {
                    if (val === null || val === undefined || val === '') return '';
                    const num = Number(val);
                    if (isNaN(num)) return val;
                    return (num > 0 ? '+' : '') + Math.round(num);
                }
                // Check if % Mode is enabled
                const isPercentMode = document.body.classList.contains('percent-mode');
                
                tr.innerHTML = `
                    <td>${trade.id !== null ? trade.id : ''}</td>
                    <td>${trade.status !== null ? trade.status : ''}</td>
                    <td>${trade.date !== null ? trade.date : ''}</td>
                    <td>${trade.time !== null ? trade.time : ''}</td>
                    <td>${trade.symbol !== null ? trade.symbol : ''}</td>
                    <td>${trade.trade_strategy !== null ? trade.trade_strategy : ''}</td>
                    <td>${trade.contract !== null ? trade.contract : ''}</td>
                    <td>${trade.strike !== null ? trade.strike : ''}</td>
                    <td>${trade.side === 'Yes' || trade.side === 'Y' ? 'Y' : trade.side === 'No' || trade.side === 'N' ? 'N' : ''}</td>
                    <td>${trade.prob !== null && trade.prob !== undefined && trade.prob !== '' ? (Number(trade.prob) / 100).toFixed(2) : ''}</td>
                    <td>${plusSign(trade.diff)}</td>
                    <td>${trade.buy_price !== null ? Number(trade.buy_price).toFixed(2) : ''}</td>
                    <td>${trade.sell_price !== null ? Number(trade.sell_price).toFixed(2) : ''}</td>
                    ${!isPercentMode ? `<td>${trade.position !== null ? trade.position : ''}</td>` : ''}
                    ${!isPercentMode ? `<td>${trade.fees !== null ? Number(trade.fees).toFixed(2) : ''}</td>` : ''}
                    ${!isPercentMode ? `<td>${trade.pnl !== null && trade.pnl !== undefined && trade.pnl !== '' ? Number(trade.pnl).toFixed(2) : ''}</td>` : ''}
                    <td>${trade.ret_pct !== null && trade.ret_pct !== undefined && trade.ret_pct !== '' ? Number(trade.ret_pct).toFixed(2) : ''}</td>
                    <td>${trade.closed_at !== null ? trade.closed_at : ''}</td>
                    <td>${formatTradeSymbolSpot(trade.symbol, trade.symbol_open)}</td>
                    <td>${formatTradeSymbolSpot(trade.symbol, trade.symbol_close)}</td>
                    <td>${trade.momentum_percentile !== null && trade.momentum_percentile !== undefined ? Math.round(Number(trade.momentum_percentile)) : ''}</td>
                    <td>${plusSign(trade.win_loss)}</td>
                `;
                tbody.appendChild(tr);
            }
            
            // Update summary statistics
            updateSummary(tradesToRender);
        }

        // === CONTRACT FILTER LOGIC ===
        function filterTradesByContract(trades) {
            const contract12amChecked = document.getElementById('contract-12am').checked;
            const contract1amChecked = document.getElementById('contract-1am').checked;
            const contract2amChecked = document.getElementById('contract-2am').checked;
            const contract3amChecked = document.getElementById('contract-3am').checked;
            const contract4amChecked = document.getElementById('contract-4am').checked;
            const contract5amChecked = document.getElementById('contract-5am').checked;
            const contract6amChecked = document.getElementById('contract-6am').checked;
            const contract7amChecked = document.getElementById('contract-7am').checked;
            const contract8amChecked = document.getElementById('contract-8am').checked;
            const contract9amChecked = document.getElementById('contract-9am').checked;
            const contract10amChecked = document.getElementById('contract-10am').checked;
            const contract11amChecked = document.getElementById('contract-11am').checked;
            const contract12pmChecked = document.getElementById('contract-12pm').checked;
            const contract1pmChecked = document.getElementById('contract-1pm').checked;
            const contract2pmChecked = document.getElementById('contract-2pm').checked;
            const contract3pmChecked = document.getElementById('contract-3pm').checked;
            const contract4pmChecked = document.getElementById('contract-4pm').checked;
            const contract5pmChecked = document.getElementById('contract-5pm').checked;
            const contract6pmChecked = document.getElementById('contract-6pm').checked;
            const contract7pmChecked = document.getElementById('contract-7pm').checked;
            const contract8pmChecked = document.getElementById('contract-8pm').checked;
            const contract9pmChecked = document.getElementById('contract-9pm').checked;
            const contract10pmChecked = document.getElementById('contract-10pm').checked;
            const contract11pmChecked = document.getElementById('contract-11pm').checked;
            
            // If no contracts are selected, show no trades
            if (!contract12amChecked && !contract1amChecked && !contract2amChecked && !contract3amChecked && !contract4amChecked &&
                !contract5amChecked && !contract6amChecked && !contract7amChecked && !contract8amChecked && !contract9amChecked &&
                !contract10amChecked && !contract11amChecked && !contract12pmChecked && !contract1pmChecked && !contract2pmChecked &&
                !contract3pmChecked && !contract4pmChecked && !contract5pmChecked && !contract6pmChecked && !contract7pmChecked &&
                !contract8pmChecked && !contract9pmChecked && !contract10pmChecked && !contract11pmChecked) {
                return [];
            }
            
            return trades.filter(trade => {
                const contract = trade.contract;
                if (!contract) return true; // Show trades without contract
                
                // Check if contract contains any of the selected times
                if (contract12amChecked && contract.includes('12am')) return true;
                if (contract1amChecked && contract.includes('1am')) return true;
                if (contract2amChecked && contract.includes('2am')) return true;
                if (contract3amChecked && contract.includes('3am')) return true;
                if (contract4amChecked && contract.includes('4am')) return true;
                if (contract5amChecked && contract.includes('5am')) return true;
                if (contract6amChecked && contract.includes('6am')) return true;
                if (contract7amChecked && contract.includes('7am')) return true;
                if (contract8amChecked && contract.includes('8am')) return true;
                if (contract9amChecked && contract.includes('9am')) return true;
                if (contract10amChecked && contract.includes('10am')) return true;
                if (contract11amChecked && contract.includes('11am')) return true;
                if (contract12pmChecked && contract.includes('12pm')) return true;
                if (contract1pmChecked && contract.includes('1pm')) return true;
                if (contract2pmChecked && contract.includes('2pm')) return true;
                if (contract3pmChecked && contract.includes('3pm')) return true;
                if (contract4pmChecked && contract.includes('4pm')) return true;
                if (contract5pmChecked && contract.includes('5pm')) return true;
                if (contract6pmChecked && contract.includes('6pm')) return true;

        // === DAY FILTER LOGIC ===
        function filterTradesByDay(trades) {
            const sundayChecked = document.getElementById('day-sunday')?.checked;
            const mondayChecked = document.getElementById('day-monday')?.checked;
            const tuesdayChecked = document.getElementById('day-tuesday')?.checked;
            const wednesdayChecked = document.getElementById('day-wednesday')?.checked;
            const thursdayChecked = document.getElementById('day-thursday')?.checked;
            const fridayChecked = document.getElementById('day-friday')?.checked;
            const saturdayChecked = document.getElementById('day-saturday')?.checked;
            const allChecked = sundayChecked && mondayChecked && tuesdayChecked && wednesdayChecked && thursdayChecked && fridayChecked && saturdayChecked;
            if (allChecked) return trades;
            if (!sundayChecked && !mondayChecked && !tuesdayChecked && !wednesdayChecked && !thursdayChecked && !fridayChecked && !saturdayChecked) {
                return [];
            }
            
            // Filter trades based on selected days
            return trades.filter(trade => {
                // Parse date string to avoid timezone issues
                // Split date string (e.g., "2025-01-15") and create local date
                const dateParts = trade.date.split('-');
                if (dateParts.length !== 3) return false;
                
                const year = parseInt(dateParts[0]);
                const month = parseInt(dateParts[1]) - 1; // JavaScript months are 0-based
                const day = parseInt(dateParts[2]);
                
                const tradeDate = new Date(year, month, day);
                const dayOfWeek = tradeDate.getDay(); // 0 = Sunday, 1 = Monday, etc.
                
                if (dayOfWeek === 0 && sundayChecked) return true;
                if (dayOfWeek === 1 && mondayChecked) return true;
                if (dayOfWeek === 2 && tuesdayChecked) return true;
                if (dayOfWeek === 3 && wednesdayChecked) return true;
                if (dayOfWeek === 4 && thursdayChecked) return true;
                if (dayOfWeek === 5 && fridayChecked) return true;
                if (dayOfWeek === 6 && saturdayChecked) return true;
                
                return false;
            });
        }
        
        // Core strategy display order (same as desktop; rest alpha-sorted)
        const STRATEGY_CORE_ORDER = ['Hourly HTC', '15m HTC', 'Momentum Contain', 'Momentum Breakout'];

        function sortStrategiesForDisplay(names) {
            // Clean up: drop falsy, dedupe, then put core strategies first and sort the rest alphabetically
            const cleaned = Array.from(new Set(names.filter(Boolean)));
            const core = STRATEGY_CORE_ORDER.filter(n => cleaned.includes(n));
            const rest = cleaned
                .filter(n => !STRATEGY_CORE_ORDER.includes(n))
                .sort((a, b) => a.localeCompare(b));
            return [...core, ...rest];
        }

        let _thmTradesFetchInFlight = false;

        let _thmTradesFetchQueuedReason = null;
        let _thmLastTradesFetchErrorLogMs = 0;

        function _thmSetFetchBanner(text, show) {
            const el = document.getElementById('trade-history-fetch-banner');
            if (!el) return;
            if (show && text) {
                el.textContent = text;
                el.style.display = 'block';
            } else {

                el.textContent = '';
            }
        }

        async function fetchAllTrades(reason) {
            const r = reason || 'unspecified';
            if (_thmTradesFetchInFlight) {
                _thmTradesFetchQueued = true;
                _thmTradesFetchQueuedReason = r;
                return;
            }
            _thmTradesFetchInFlight = true;
            if (localStorage.getItem('trade_history_debug') === '1') {
                console.log('[trade_history_mobile] GET /trades — reason:', r);
            }
            try {
                let retries = 0;
                const maxRetries = 10;
                while (retries < maxRetries) {
                    try {
                        const apiBaseUrl = getMainAppUrl();
                        const res = await fetch(`${apiBaseUrl}/trades`, { cache: 'no-store' });
                        const raw = await res.text();
                        if (!res.ok) {
                            let msg = res.status === 503 ? 'Service unavailable' : ('HTTP ' + res.status);
                            try {
                                const err = JSON.parse(raw);
                                if (err && typeof err.detail === 'string') msg = err.detail;
                            } catch (_) { /* ignore */ }
                            throw new Error(msg);
                        }
                        trades = JSON.parse(raw);
                        if (!Array.isArray(trades)) throw new Error('Invalid trades response');
                        _thmSetFetchBanner('', false);
                        applyFilters();
                        return;
                    } catch (portError) {
                        if (portError.message.includes('Port configuration not loaded')) {
                            retries++;
                            if (retries < maxRetries) {
                                await new Promise(resolve => setTimeout(resolve, 500));
                                continue;
                            }
                        }
                        throw portError;
                    }
                }
                throw new Error('Port configuration failed to load after multiple attempts');
            } catch (error) {
                const hadRows = Array.isArray(trades) && trades.length > 0;
                const now = Date.now();
                if (now - _thmLastTradesFetchErrorLogMs > 8000) {
                    _thmLastTradesFetchErrorLogMs = now;
                    console.warn('[trade_history_mobile] /trades failed:', error.message || error, hadRows ? '(keeping last loaded rows)' : '');
                }
                const tbody = document.querySelector('#trade-log-table tbody');
                const isPercentMode = document.body.classList.contains('percent-mode');
                const colSpan = isPercentMode ? 20 : 23;
                if (hadRows) {
                    _thmSetFetchBanner(
                        'Could not refresh (database may be busy). Showing last loaded data.',
                        true
                    );
                } else {
                    _thmSetFetchBanner('', false);
                    if (tbody) {
                        tbody.innerHTML = `<tr><td colspan="${colSpan}" style="color:red;">Failed to load trades: ${error.message}</td></tr>`;
                    }
                }
            } finally {
                _thmTradesFetchInFlight = false;
                if (_thmTradesFetchQueued) {
                    _thmTradesFetchQueued = false;
                    const nextReason = _thmTradesFetchQueuedReason || 'queued-follow-up';
                    _thmTradesFetchQueuedReason = null;
                    setTimeout(() => fetchAllTrades(nextReason), 0);
                }
            }
        }

        // Update date range display and populate date inputs
        function updateDateRangeDisplay() {
            const filterPicker = document.getElementById('date-filter-picker');
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            if (!filterPicker || !startDateInput || !endDateInput) return;
            
            const selectedValue = filterPicker.value;
            const now = new Date();
            let startDate = '';
            let endDate = '';
            
            function getDateOfThisWeek(dayOfWeek) {
                const curr = new Date(now);
                const currDay = curr.getDay();
                const diff = dayOfWeek - currDay;
                curr.setDate(curr.getDate() + diff);
                return formatDate(curr);
            }
            
            function getDateOfLastWeek(dayOfWeek) {
                const curr = new Date(now);
                const currDay = curr.getDay();
                curr.setDate(curr.getDate() - currDay - 7 + dayOfWeek);
                return formatDate(curr);
            }
            
            function getLatestSunday() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay());
                return formatDate(curr);
            }
            
            function getPrevSunday() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay() - 7);
                return formatDate(curr);
            }
            
            function getNextSaturdayOfPrevWeek() {
                const curr = new Date(now);
                curr.setDate(curr.getDate() - curr.getDay() - 1);
                return formatDate(curr);
            }
            
            switch (selectedValue) {
                case 'TODAY': {
                    const today = formatDate(now);
                    startDate = today;
                    endDate = today;
                    break;
                }
                case 'THIS_WEEK': {
                    const sunday = getLatestSunday();
                    const today = formatDate(now);
                    startDate = sunday;
                    endDate = today;
                    break;
                }
                case 'SUNDAY':
                    startDate = endDate = getDateOfThisWeek(0);
                    break;
                case 'MONDAY':
                    startDate = endDate = getDateOfThisWeek(1);
                    break;
                case 'TUESDAY':
                    startDate = endDate = getDateOfThisWeek(2);
                    break;
                case 'WEDNESDAY':
                    startDate = endDate = getDateOfThisWeek(3);
                    break;
                case 'THURSDAY':
                    startDate = endDate = getDateOfThisWeek(4);
                    break;
                case 'FRIDAY':
                    startDate = endDate = getDateOfThisWeek(5);
                    break;
                case 'SATURDAY':
                    startDate = endDate = getDateOfThisWeek(6);
                    break;
                case 'LAST_WEEK': {
                    const prevSunday = getPrevSunday();
                    const nextSaturday = getNextSaturdayOfPrevWeek();
                    startDate = prevSunday;
                    endDate = nextSaturday;
                    break;
                }
                case 'MONTH': {
                    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                    const today = formatDate(now);
                    startDate = formatDate(monthStart);
                    endDate = today;
                    break;
                }
                case 'PREV_30': {
                    const prev30 = new Date(now);
                    prev30.setDate(now.getDate() - 30);
                    const today = formatDate(now);
                    startDate = formatDate(prev30);
                    endDate = today;
                    break;
                }
                case 'YTD': {
                    const ytdStart = `${now.getFullYear()}-01-01`;
                    const today = formatDate(now);
                    startDate = ytdStart;
                    endDate = today;
                    break;
                }
                case 'PREV_YEAR': {
                    const prevYear = new Date(now);
                    prevYear.setFullYear(now.getFullYear() - 1);
                    startDate = formatDate(prevYear);
                    endDate = formatDate(now);
                    break;
                }
                case 'CUSTOM':
                    // Don't change the date inputs for custom selection
                    return;
                default:
                    break;
            }
            
            // Update the date input fields
            if (startDate) startDateInput.value = startDate;
            if (endDate) endDateInput.value = endDate;
        }

        function formatTradeHistoryMonitorLabel(monitor) {
            const key = monitor.name || '';
            let idPart = monitor.id != null && monitor.id !== '' ? String(monitor.id) : '';
            if (!idPart && key) {
                const parts = key.split('_');
                const last = parts[parts.length - 1];
                if (/^[0-9]+$/.test(last)) idPart = last;
            }
            if (!idPart) idPart = key || '?';
            const sym = (monitor.symbol || '').trim();
            const strat = (monitor.strategy || '').trim();
            const mktRaw = (monitor.market || '').toString().trim().toLowerCase();
            const mkt = mktRaw === '15m' ? '15m' : (mktRaw === 'hourly' ? 'Hourly' : (monitor.market || '').toString().trim());
            if (sym && strat) {
                return mkt ? (idPart + ' - ' + sym + ' ' + strat + ', ' + mkt) : (idPart + ' - ' + sym + ' ' + strat);
            }
            return key || idPart;
        }

        // Load monitor options from API
        async function loadMonitorOptions() {
            try {
                const response = await fetch('/api/trades/monitors');
                const data = await response.json();
                
                if (data.status === 'ok' && data.monitors) {
                    const monitorDropdownContent = document.getElementById('monitor-dropdown-content');
                    const existingOptions = monitorDropdownContent.querySelectorAll('label');
                    existingOptions.forEach(option => option.remove());
                    
                    data.monitors.forEach(monitor => {
                        const label = document.createElement('label');
                        label.style.cssText = 'display: flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #4a5568;';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `monitor-${monitor.name.replace(/[^a-zA-Z0-9]/g, '-')}`;
                        checkbox.style.cssText = 'width: 14px; height: 14px;';
                        checkbox.checked = true;
                        checkbox.setAttribute('data-monitor-id', monitor.name);
                        
                        const text = document.createElement('span');
                        text.className = 'trade-history-monitor-label';
                        text.textContent = formatTradeHistoryMonitorLabel(monitor);
                        
                        label.appendChild(checkbox);
                        label.appendChild(text);
                        monitorDropdownContent.appendChild(label);
                    });
                    if (typeof updateMonitorButtonText === 'function') updateMonitorButtonText();
                }
            } catch (error) {
                console.error('Error loading monitor options:', error);
            }
        }

        // Load % Mode preference from database
        async function loadPercentModePreference() {
            try {
                console.log('🔄 Loading % Mode preference...');

                console.log('📡 API response status:', response.status);

        // Save paper trade preferences to database
        async function savePaperTradePreferences() {
            try {
                const filterLive = document.getElementById('filter-live');
                const filterPaper = document.getElementById('filter-paper');
                
                if (!filterLive || !filterPaper) return;
                
                const strategySelection = {};
                document.querySelectorAll('#strategy-checkboxes-container input[type="checkbox"][data-strategy-name]').forEach(cb => {
                    strategySelection[cb.getAttribute('data-strategy-name')] = cb.checked;
                });
                const symbolSelection = {};
                document.querySelectorAll('#symbol-checkboxes-container input[type="checkbox"][data-symbol]').forEach(cb => {
                    symbolSelection[cb.getAttribute('data-symbol')] = cb.checked;
                });
                const includeTestTrades = document.getElementById('include-test-trades');
                const response = await fetch('/api/set_trade_history_preferences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        live_filter: filterLive.checked,
                        paper_filter: filterPaper.checked,
                        include_test_trades: includeTestTrades ? includeTestTrades.checked : false,
                        strategy_selection: strategySelection,
                        symbol_selection: symbolSelection
                    })
                });
                
                if (response.ok) {
                    console.log('✅ Paper trade preferences saved');
                } else {
                    console.error('❌ Failed to save paper trade preferences');
                }
            } catch (error) {
                console.error('❌ Error saving paper trade preferences:', error);
            }
        }

        // Load paper trade preferences from database
        async function loadPaperTradePreferences() {
            try {
                const response = await fetch('/api/get_trade_history_preferences');
                
                if (response.ok) {
                    const preferences = await response.json();
                    const filterLive = document.getElementById('filter-live');
                    const filterPaper = document.getElementById('filter-paper');
                    
                    if (filterLive && preferences.live_filter !== undefined) {
                        filterLive.checked = preferences.live_filter;
                    }
                    if (filterPaper && preferences.paper_filter !== undefined) {
                        filterPaper.checked = preferences.paper_filter;
                    }
                    const includeTestTrades = document.getElementById('include-test-trades');
                    if (includeTestTrades && preferences.include_test_trades !== undefined) {
                        includeTestTrades.checked = preferences.include_test_trades;
                    }
                    if (preferences.strategy_selection && typeof preferences.strategy_selection === 'object') {
                        document.querySelectorAll('#strategy-checkboxes-container input[type="checkbox"][data-strategy-name]').forEach(cb => {
                            const name = cb.getAttribute('data-strategy-name');
                            if (preferences.strategy_selection[name] !== undefined) cb.checked = !!preferences.strategy_selection[name];
                        });
                        if (typeof updateStrategyButtonText === 'function') updateStrategyButtonText();
                    }
                    if (preferences.symbol_selection && typeof preferences.symbol_selection === 'object') {
                        document.querySelectorAll('#symbol-checkboxes-container input[type="checkbox"][data-symbol]').forEach(cb => {
                            const sym = cb.getAttribute('data-symbol');
                            if (preferences.symbol_selection[sym] !== undefined) cb.checked = !!preferences.symbol_selection[sym];
                        });
                        if (typeof updateSymbolButtonText === 'function') updateSymbolButtonText();
                    }
                    
                    // Return promise for chaining
                    return Promise.resolve();
                }
            } catch (error) {
                console.error('❌ Error loading paper trade preferences:', error);
                return Promise.resolve(); // Return resolved promise even on error
            }
        }

        let _thmTradeDbRefreshTimer = null;
        function scheduleTradeHistoryMobileRefetchFromWs() {
            if (window.TRADE_HISTORY_MOBILE_PAUSED) return;
            if (_thmTradeDbRefreshTimer) clearTimeout(_thmTradeDbRefreshTimer);
            _thmTradeDbRefreshTimer = setTimeout(() => {
                _thmTradeDbRefreshTimer = null;
                fetchAllTrades('ws-db_change-trades');
            }, 800);
        }

        // /ws/db_changes: stream "trades" for users.trades_0001 (no interval polling)
        function setupTradeHistoryWebSocket() {
            if (window.TRADE_HISTORY_MOBILE_PAUSED) return;
            if (window._thmDbChangesWs) {
                try { window._thmDbChangesWs.close(); } catch (e) {}
                window._thmDbChangesWs = null;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/db_changes`);
            window._thmDbChangesWs = ws;

            ws.onmessage = function(event) {
                try {
                    const raw = event.data;
                    if (typeof recDbChangeRawMentionsStream === 'function' &&
                        !recDbChangeRawMentionsStream(raw, 'trades')) {
                      return;
                    }
                    const data = JSON.parse(raw);
                    if (data.type === 'db_change' && data.database === 'trades') {
                        scheduleTradeHistoryMobileRefetchFromWs();
                    }
                } catch (error) {
                    console.error('Error parsing WebSocket message (trade history mobile):', error);
                }
            };

            ws.onerror = function() {};

            ws.onclose = function() {
                window._thmDbChangesWs = null;
                if (!window.TRADE_HISTORY_MOBILE_PAUSED) {
                    setTimeout(() => setupTradeHistoryWebSocket(), 5000);
                }
            };
        }
        
        setupTradeHistoryWebSocket();
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'tab-visibility') {
                const visible = event.data.visible === true;
                window.TRADE_HISTORY_MOBILE_PAUSED = !visible;
                if (visible) {
                    if (_thmTradeDbRefreshTimer) {
                        clearTimeout(_thmTradeDbRefreshTimer);
                        _thmTradeDbRefreshTimer = null;
                    }
                    setupTradeHistoryWebSocket();
                    fetchAllTrades('tab-visible');
                } else {
                    if (_thmTradeDbRefreshTimer) {
                        clearTimeout(_thmTradeDbRefreshTimer);
                        _thmTradeDbRefreshTimer = null;
                    }
                    if (window._thmDbChangesWs) { try { window._thmDbChangesWs.close(); } catch (e) {} window._thmDbChangesWs = null; }
                }
            }
        });
        
        // Mobile iframe coordination message handling
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'refresh_data') {
                // Trigger immediate data refresh
                fetchAllTrades('parent-refresh_data');
                // Notify parent of data update
                window.parent.postMessage({
                    type: 'data_updated',
                    source: 'trade_history_mobile',
                    timestamp: Date.now()
                }, '*');
            }
        });

    <script>
    (function() {
      if (window.parent === window) return;
      var threshold = 216;
      var startY = 0, currentPull = 0;
      function atTop() { var se = document.scrollingElement || document.documentElement; return se && se.scrollTop <= 0; }
      document.addEventListener('touchstart', function(e) { if (e.touches.length === 1) { startY = e.touches[0].clientY; currentPull = 0; } }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1 || !atTop()) return;
        var pull = e.touches[0].clientY - startY;
        if (pull <= 0) return;
        currentPull = Math.min(pull, 280);
        window.parent.postMessage({ type: 'pull-to-refresh-progress', pull: currentPull >= threshold ? currentPull : 0 }, window.location.origin);
      }, { passive: true });
      document.addEventListener('touchend', function() {
        if (currentPull >= threshold) {
          window.parent.postMessage({ type: 'pull-to-refresh-triggered' }, window.location.origin);
        } else {
          window.parent.postMessage({ type: 'pull-to-refresh-progress', pull: 0 }, window.location.origin);
        }
        currentPull = 0;
      }, { passive: true });
      window.addEventListener('message', function(e) {
        if (e.origin !== window.location.origin || !e.data || e.data.type !== 'pull-to-refresh-do') return;
        var p = typeof window.__onPullToRefresh === 'function' ? window.__onPullToRefresh() : null;
        if (p && typeof p.then === 'function') {
          p.then(function() { window.parent.postMessage({ type: 'pull-to-refresh-done' }, window.location.origin); }).catch(function() { window.parent.postMessage({ type: 'pull-to-refresh-done' }, window.location.origin); });
        } else {
          window.parent.postMessage({ type: 'pull-to-refresh-done' }, window.location.origin);
          if (p === null || p === undefined) location.reload();
        }
      });
    })();
    </script>
