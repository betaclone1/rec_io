  <script>
    // Device detection and mobile redirect
    function isMobileDevice() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // Check for mobile devices
      if (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase())) {
        return true;
      }
      
      // Check for touch capability (additional mobile indicator)
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        return true;
      }
      
      // Check screen size (mobile typically < 768px)
      if (window.innerWidth <= 768) {
        return true;
      }
      
      return false;
    }
    
    // Redirect to mobile if accessing desktop on mobile device
    function checkMobileRedirect() {
      // Check for mobile/desktop override in URL
      const urlParams = new URLSearchParams(window.location.search);
      const forceMobile = urlParams.has('mobile');
      const forceDesktop = urlParams.has('desktop');
      
      if (forceMobile) {
        const token = localStorage.getItem('rec_auth_token');
        const deviceId = localStorage.getItem('rec_device_id');
        
        if (token && deviceId) {
          window.location.href = `/mobile?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
        } else {
          window.location.href = '/login';
        }
      } else if (forceDesktop) {
        // Stay on desktop (no redirect needed)
        return;
      } else if (isMobileDevice()) {
        const token = localStorage.getItem('rec_auth_token');
        const deviceId = localStorage.getItem('rec_device_id');
        
        if (token && deviceId) {
          window.location.href = `/mobile?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}`;
        } else {
          window.location.href = '/login';
        }
      }
    }
    
    // Check for mobile redirect on page load
    document.addEventListener('DOMContentLoaded', checkMobileRedirect);
    
    // Localhost detection for development visual indicator
    function checkLocalhostEnvironment() {
      const hostname = window.location.hostname;
      const isLocalhost = hostname === 'localhost' || 
                         hostname === '127.0.0.1' || 
                         hostname.startsWith('192.168.') || 
                         hostname.startsWith('10.') ||
                         hostname.endsWith('.local');
      
      if (isLocalhost) {
        document.body.classList.add('localhost-dev');
      }
    }
    
    function setRealViewportHeight() {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    }
    window.addEventListener('resize', setRealViewportHeight);
    window.addEventListener('load', setRealViewportHeight);
    setRealViewportHeight();
  </script>

  <style>
    /* Minimal layout CSS - no custom colors, only structure */
    body {
      padding: 0; /* Override global padding for full-height layout */
      overflow: hidden; /* Prevent horizontal scrolling */
    
    }
    
    /* Localhost development indicator */
    body.localhost-dev {
      border: 4px solid #22c55e !important;
      box-sizing: border-box;
    }
    
    body.localhost-dev::before {
      content: "LOCAL DEV";
      position: fixed;
      top: 0;
      left: 0;
      background: #22c55e;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      font-family: monospace;
      z-index: 9999;
      border-radius: 0 0 4px 0;
    }
    
    html {
      overflow: hidden; /* Prevent horizontal scrolling */
    }
    
    .app-container {
      display: flex;
      height: calc(var(--vh, 1vh) * 100);
      max-height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }
    
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 180px;
      min-width: 50px;
      height: calc(var(--vh, 1vh) * 100);
      max-height: calc(var(--vh, 1vh) * 100);
      overflow: visible;
      transition: width 0.3s ease;
      padding-left: 1px;
    }
    
    .sidebar.collapsed {
      width: 10px;
      overflow-x: visible;
    }
    
    .sidebar-header {
      display: flex;
      align-items: center;
      height: 60px;
      min-height: 60px;
      padding-left: 15px;
      flex-shrink: 0;
    }
    
    .sidebar-logo {
      height: 32px;
      width: 32px;
      object-fit: contain;
    }
    
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      overflow-y: auto;
      min-height: 0;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 0 12px 15px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      border: none;
      background: none;
      font-family: inherit;
      cursor: pointer;
      opacity: 0.5;
      transition: background-color 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }
    
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      min-width: 32px;
      height: 32px;
      font-size: 18px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    
    .nav-item:not(.active):hover {
      position: relative;
      opacity: 1;
    }
    
    .nav-item:not(.active):hover::before {
      content: '';
      position: absolute;
      top: 7px;
      left: 11px;
      right: 0;
      bottom: 7px;
      background: rgba(50, 60, 78, 0.5);
      border-radius: 6px;
      z-index: -1;
    }
    
    .nav-item.active {
      position: relative;
      z-index: 1;
      opacity: 1;
    }
    
    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 7px;
      left: 11px;
      right: 0;
      bottom: 7px;
      background: #323c4e;
      border-radius: 6px;
      z-index: -1;
    }
    
    .nav-item.active .nav-icon {
      opacity: 1;
    }

    /* Trade Monitor: primary row + same-origin “new tab” (shares localStorage with this shell). */
    .nav-item-with-action {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      min-width: 0;
    }
    .nav-item-with-action > .nav-item {
      flex: 1;
      min-width: 0;
    }
    .nav-external-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      min-width: 28px;
      padding: 0 4px 0 0;
      text-decoration: none;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1;
      opacity: 0.75;
      transition: color 0.15s, opacity 0.15s;
    }
    .nav-external-tab:hover {
      color: #e2e8f0;
      opacity: 1;
    }
    .sidebar.collapsed .nav-external-tab {
      display: none;
    }
    
    .nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 1;
      max-width: 180px;
      transition: 
        opacity 0.2s ease,
        max-width 0.2s ease,
        visibility 0.2s ease;
      margin-left: 5px;
      visibility: visible;
    }
    
    .sidebar.collapsed .nav-label {
      opacity: 0;
      max-width: 0;
      visibility: hidden;
    }
    
    .sidebar-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0 12px 15px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      border: none;
      background: none;
      font-size: 14px;
      width: 100%;
      color: inherit;
      outline: none;
      position: relative;
      opacity: 0.5;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .sidebar-toggle .toggle-icon {
      display: inline-block;
      width: 32px;
      min-width: 32px;
      text-align: center;
      font-size: 18px;
      margin-left: 0;
    }
    .sidebar-toggle .toggle-label {
      margin-left: 0px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 1;
      max-width: 180px;
      transition: 
        opacity 0.3s ease,
        max-width 0.3s ease,
        visibility 0.3s ease;
      visibility: visible;
    }
    .sidebar.collapsed .sidebar-toggle .toggle-label {
      opacity: 0;
      max-width: 0;
      visibility: hidden;
    }
    .sidebar-toggle:hover {
      opacity: 1;
    }
    .sidebar-toggle:hover .toggle-icon {

    }
    .sidebar-toggle:hover::before {

      top: 10px;
      left: 11px;
      right: 0;
      bottom: 10px;
      background: rgba(50, 60, 78, 0.5);
      border-radius: 6px;
      z-index: -1;
    }
    
    .main-content {
      flex: 1;
      height: calc(var(--vh, 1vh) * 100);
      overflow: hidden;
      position: relative;
    }
    
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .content-frame.active {
      opacity: 1;
      z-index: 1;
    }
    

    
    /* Prevent sound icon from rotating and center it */
    #soundToggle .nav-icon img {
      transform: none !important;
      transition: none !important;
      display: block;
      margin: 0 auto;
    }
    
    /* User Section Styles */
    .user-section {
      margin-top: auto;
      margin-bottom: 0px;
      flex-shrink: 0;
      min-height: 0;
    }
    
    /* System Health Tooltip - Updated to match sidebar tooltips */
    .system-health-tooltip {

      left: 100%;

      pointer-events: none;
      white-space: nowrap;
      font-size: 13px;
      color: #fff;
      font-weight: 500;
      min-width: auto;
      width: fit-content;
    }
    
    #systemMenuItem:hover .system-health-tooltip {
      opacity: 1;
      visibility: visible;
    }
    
    /* Collapsed Sidebar Hover Labels - Kraken Style */
    .sidebar-tooltip {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 10px;

      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
      font-size: 13px;
      color: #fff;
      font-weight: 500;
      min-width: auto;

    }
    
    .sidebar.collapsed .nav-item,

      color: #dc2626;

      }
      
      .sidebar-header {

        min-height: 50px;
      }
      

    }


    /* Sidebar styles */
  </style>

  <script>
    // Sidebar functionality
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const navItems = document.querySelectorAll('.nav-item');
    const contentFrames = document.querySelectorAll('.content-frame');
    
    // Sound control system
    let soundEnabled = localStorage.getItem('soundEnabled') !== 'false'; // Default to true
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = soundToggle.querySelector('.toggle-label');
    
    // Initialize sound toggle state
    function initializeSoundToggle() {
      updateSoundToggleDisplay();
    }
    
    // Update sound toggle visual state
    function updateSoundToggleDisplay() {
      if (soundEnabled) {
        soundLabel.textContent = 'Sound ON';
        soundIcon.src = '/images/icons/sound_on_icon.png';
        soundToggle.setAttribute('data-tooltip', 'Sound ON');
      } else {
        soundLabel.textContent = 'Sound OFF';
        soundIcon.src = '/images/icons/sound_off_icon.png';
        soundToggle.setAttribute('data-tooltip', 'Sound OFF');
      }
    }
    
    // Toggle sound on/off
    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('soundEnabled', soundEnabled);
      updateSoundToggleDisplay();
    });
    
    // Global sound control function that can be used by other scripts
    window.playSound = function(audioElement) {
      if (soundEnabled && audioElement) {
        audioElement.play().catch(e => console.log('Sound play failed:', e));
      }
    };
    
    // Global sound state getter
    window.isSoundEnabled = function() {
      return soundEnabled;
    };
    
    // Tab configuration
    const tabConfig = {
      'dashboard': 'dashboardFrame',
      'trade-monitor': 'tradeMonitorFrame',
      'history': 'tradeHistoryFrame', 
      'account': 'accountManagerFrame',
      'backtester': 'backtesterFrame',
      'strategy-lab': 'strategyLabFrame',
      'help': 'helpFrame',
      'settings': 'settingsFrame',
      'admin-tools': 'adminToolsFrame',
      'user-settings': 'userSettingsFrame',
      'system': 'systemFrame'
    };
    
    // Toggle sidebar collapse/expand
    sidebarToggle.addEventListener('click', () => {
      const isCollapsed = sidebar.classList.contains('collapsed');
      const toggleIcon = document.getElementById('sidebarToggleIcon');
      const toggleLabel = sidebarToggle.querySelector('.toggle-label');
      
      if (isCollapsed) {
        // Expanding - show collapse icon
        sidebar.classList.remove('collapsed');
        toggleIcon.src = '/images/icons/sidebar_collapse.png';
        toggleLabel.textContent = 'Collapse';
        sidebarToggle.setAttribute('data-tooltip', 'Collapse');
      } else {
        // Collapsing - show expand icon
        sidebar.classList.add('collapsed');
        toggleIcon.src = '/images/icons/sidebar_expand.png';
        toggleLabel.textContent = 'Expand';
        sidebarToggle.setAttribute('data-tooltip', 'Expand');
      }
      
      // Update system tooltip text based on new sidebar state
      updateSystemTooltipForSidebarState();
      
      // Update user settings tooltip based on new sidebar state
      const userDisplay = document.getElementById('userDisplay');
      if (userDisplay) {
        updateUserSettingsTooltip(userDisplay.textContent);
      }
    });
    
    // Navigation functionality
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        // Remove active class from all items
        navItems.forEach(nav => nav.classList.remove('active'));
        
        // Add active class to clicked item
        item.classList.add('active');
        
        // Get the target frame ID
        const pageType = item.getAttribute('data-page');
        const targetFrameId = tabConfig[pageType];
        
        if (targetFrameId) {
          const targetFrame = document.getElementById(targetFrameId);
          if (!targetFrame) return;

          // Lazy-load: set src on first visit so tab content loads only when opened
          const tabSrc = targetFrame.getAttribute('data-tab-src');
          const tabAlreadyLoaded = targetFrame.dataset.srcSet === 'true';
          if (tabSrc && !tabAlreadyLoaded) {
            targetFrame.dataset.srcSet = 'true';
            targetFrame.src = tabSrc;
            targetFrame.addEventListener('load', function onTabLoad() {
              targetFrame.removeEventListener('load', onTabLoad);
              notifyTabSessionContext(targetFrame);
              broadcastTabVisibility();
            }, { once: true });
          } else if (tabAlreadyLoaded) {
            notifyTabSessionContext(targetFrame);
          }

          // Hide all frames, then show target
          contentFrames.forEach(frame => frame.classList.remove('active'));
          targetFrame.classList.add('active');

          // Notify all frames of visibility (tabs like Trade Monitor pause when hidden)
          broadcastTabVisibility();
        }
        
        // Prevent URL from showing in browser status bar
        return false;
      });
    });
    


    /**
     * Push shell session hints into a tab iframe (same origin as this index).
     * Tab scripts listen for `rec-tab-session-context` to refresh cookies from localStorage
     * and align with the logged-in tenant (e.g. Trade Monitor NEW).
     */
    function notifyTabSessionContext(frame) {
      if (!frame || !frame.contentWindow) return;
      const origin = window.location.origin;
      try {
        frame.contentWindow.postMessage(
          { type: 'rec-tab-session-context', origin: origin },
          origin
        );
      } catch (e) {
        /* not loaded or cross-origin */
      }
    }

    // Notify all tab iframes of their visibility (so Trade Monitor etc. can pause when hidden)
    function broadcastTabVisibility() {
      const origin = window.location.origin;
      contentFrames.forEach(frame => {
        try {
          if (frame.contentWindow) {
            frame.contentWindow.postMessage(
              { type: 'tab-visibility', visible: frame.classList.contains('active') },
              origin
            );
          }
        } catch (e) { /* cross-origin or not loaded */ }
      });
    }
    
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        localStorage.setItem('rec_io_main_app_origin', window.location.origin);
      } catch (e) {
        /* ignore private mode */
      }
      // Only dashboard loads initially; other tabs load on first view. Tell visible tab it's active.
      setTimeout(broadcastTabVisibility, 400);
      
      // Check for localhost environment and add visual indicator
      checkLocalhostEnvironment();
      
      // Load and display user ID
      await loadUserDisplay();
      
      // Initialize system health tooltip
      initializeSystemHealthTooltip();
      
      // Start system health monitoring for icon updates
      startSystemHealthMonitoring();

      // Initialize sound toggle
      initializeSoundToggle();
      
      // Initialize collapsed sidebar tooltips
      initializeCollapsedSidebarTooltips();
    });
    
    // Master-admin: highlight Admin Tools when any user is pending_admin_approval (WS + initial fetch).
    const ADMIN_TOOLS_ICON_DEFAULT = '/images/icons/admin_tools_icon.png';
    const ADMIN_TOOLS_ICON_ATTN = '/images/icons/admin_tools_icon_attn.png';
    let _adminIndexPendingWs = null;
    let _adminIndexPendingWsStopped = true;
    let _adminIndexPendingRefreshTimer = null;
    const _ADMIN_INDEX_PENDING_WS_DEBOUNCE_MS = 500;

    async function refreshAdminToolsAttentionIcon() {
      const adminItem = document.getElementById('adminToolsItem');
      const icon = document.getElementById('adminToolsIcon');
      if (!adminItem || !icon || adminItem.style.display === 'none') return;
      try {
        const res = await fetch(window.location.origin + '/api/user/admin/master_users', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json().catch(function () { return null; });
        if (!data || !Array.isArray(data.rows)) return;
        const pending = data.rows.some(function (r) {
          return String(r.status || '').trim() === 'pending_admin_approval';
        });
        icon.src = pending ? ADMIN_TOOLS_ICON_ATTN : ADMIN_TOOLS_ICON_DEFAULT;
      } catch (e) { /* keep current icon */ }
    }

    function scheduleAdminToolsAttentionRefresh() {
      if (_adminIndexPendingWsStopped) return;
      if (_adminIndexPendingRefreshTimer) clearTimeout(_adminIndexPendingRefreshTimer);
      _adminIndexPendingRefreshTimer = setTimeout(function () {
        _adminIndexPendingRefreshTimer = null;
        refreshAdminToolsAttentionIcon();
      }, _ADMIN_INDEX_PENDING_WS_DEBOUNCE_MS);
    }

    function setupAdminToolsPendingDbChangesWs() {
      if (_adminIndexPendingWsStopped) return;
      if (_adminIndexPendingWs) return;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(protocol + '//' + window.location.host + '/ws/db_changes');
      _adminIndexPendingWs = ws;
      ws.onmessage = function (event) {
        try {
          const raw = event.data;
          if (typeof recDbChangeRawMentionsStream === 'function' &&
              !recDbChangeRawMentionsStream(raw, 'master_users')) {
            return;
          }
          const data = JSON.parse(raw);
          if (data.type === 'db_change' && data.database === 'master_users') {
            scheduleAdminToolsAttentionRefresh();
          }
        } catch (e) { /* ignore malformed frames */ }
      };
      ws.onerror = function () {};
      ws.onclose = function () {
        _adminIndexPendingWs = null;
        if (!_adminIndexPendingWsStopped) {
          setTimeout(setupAdminToolsPendingDbChangesWs, 5000);
        }
      };
    }

    function stopAdminToolsPendingIndicator() {
      _adminIndexPendingWsStopped = true;
      if (_adminIndexPendingRefreshTimer) {
        clearTimeout(_adminIndexPendingRefreshTimer);
        _adminIndexPendingRefreshTimer = null;
      }
      if (_adminIndexPendingWs) {
        try { _adminIndexPendingWs.close(); } catch (e) {}
        _adminIndexPendingWs = null;
      }
      const icon = document.getElementById('adminToolsIcon');
      if (icon) icon.src = ADMIN_TOOLS_ICON_DEFAULT;
    }

    // Sidebar display name: GET /api/user/info only. Blank if missing or error (no placeholders).
    function clearSidebarUserLabel() {
      const userDisplay = document.getElementById('userDisplay');
      if (userDisplay) {
        userDisplay.textContent = '';
      }
      const userSettingsItem = document.getElementById('userSettingsItem');
      if (userSettingsItem) {
        userSettingsItem.setAttribute('data-tooltip', 'User Settings');
      }
      const adminToolsItem = document.getElementById('adminToolsItem');
      if (adminToolsItem) {
        adminToolsItem.style.display = 'none';
      }
      stopAdminToolsPendingIndicator();
    }

    async function loadUserDisplay() {
      try {
        const userResponse = await fetch(window.location.origin + '/api/user/info');
        const userInfo = await userResponse.json().catch(function () { return null; });

        if (!userResponse.ok || !userInfo || userInfo.error) {
          clearSidebarUserLabel();
          return;
        }

        const disp = (userInfo.name != null && String(userInfo.name).trim())
          ? String(userInfo.name).trim()
          : '';

        const userDisplay = document.getElementById('userDisplay');
        if (userDisplay) {
          userDisplay.textContent = disp;
        }
        updateUserSettingsTooltip(disp);

        const adminToolsItem = document.getElementById('adminToolsItem');
        if (adminToolsItem) {
          const isMasterAdmin = String(userInfo.account_type || '').toLowerCase() === 'master_admin';
          adminToolsItem.style.display = isMasterAdmin ? 'flex' : 'none';
          if (isMasterAdmin) {
            _adminIndexPendingWsStopped = false;
            refreshAdminToolsAttentionIcon();
            setupAdminToolsPendingDbChangesWs();
          } else {
            stopAdminToolsPendingIndicator();
          }
        }
      } catch (error) {
        console.error('Error loading user display:', error);
        clearSidebarUserLabel();
      }
    }
    
    // Update user settings tooltip based on sidebar state
    function updateUserSettingsTooltip(userName) {
      const userSettingsItem = document.getElementById('userSettingsItem');
      const sidebar = document.getElementById('sidebar');
      if (!userSettingsItem || !sidebar) {
        return;
      }
      const isCollapsed = sidebar.classList.contains('collapsed');
      if (isCollapsed && userName) {
        userSettingsItem.setAttribute('data-tooltip', userName);
      } else {
        userSettingsItem.setAttribute('data-tooltip', 'User Settings');
      }
    }
    
    // System Health Tooltip Functions
    function initializeSystemHealthTooltip() {
      const systemMenuItem = document.getElementById('systemMenuItem');
      if (systemMenuItem) {
        systemMenuItem.addEventListener('mouseenter', async () => {
          await loadSystemHealth();
        });
      }
    }
    
    async function loadSystemHealth() {
      try {
        const response = await fetch(window.location.origin + '/api/db/system_health');
        if (response.ok) {
          const healthData = await response.json();
          updateSystemHealthTooltip(healthData);
        } else {
          updateSystemHealthTooltip({ error: 'Failed to load health data' });
        }
      } catch (error) {
        console.error('Error loading system health:', error);
        updateSystemHealthTooltip({ error: 'Connection error' });
      }
    }
    
    function updateSystemHealthTooltip(data) {
      const tooltip = document.getElementById('systemHealthTooltip');
      if (!tooltip) return;
      
      const statusElement = tooltip.querySelector('.health-status');
      const sidebar = document.getElementById('sidebar');
      const isCollapsed = sidebar.classList.contains('collapsed');
      
      if (data.error) {
        const statusText = isCollapsed ? 'System:' : 'Offline';
        statusElement.textContent = statusText;
        statusElement.className = 'health-status offline';
        return;
      }
      
      // Determine status
      let status = 'offline';
      let statusText = '';
      
      if (data.overall_status === 'healthy') {
        status = 'healthy';
        statusText = isCollapsed ? 'System:' : 'Live';
      } else if (data.overall_status === 'degraded' || data.overall_status === 'unhealthy') {
        status = 'unhealthy';
        statusText = isCollapsed ? 'System:' : 'Unhealthy';
      } else {
        statusText = isCollapsed ? 'System:' : 'Offline';
      }
      
      statusElement.textContent = statusText;
      statusElement.className = `health-status ${status}`;
    }
    
    // System health monitoring for icon updates
    let systemHealthInterval;
    let lastSystemStatus = null;
    
    function startSystemHealthMonitoring() {
      // Check immediately
      updateSystemIcon();
      
      // Then check every 15 seconds (same as system monitor)
      systemHealthInterval = setInterval(updateSystemIcon, 15000);
    }
    
    async function updateSystemIcon() {
      try {
        const response = await fetch(window.location.origin + '/api/db/system_health');
        if (response.ok) {
          const healthData = await response.json();
          const status = healthData.overall_status || 'offline';
          
          // Only update if status changed
          if (status !== lastSystemStatus) {
            lastSystemStatus = status;
            updateSystemIconInSidebar(status);
          }
        }
      } catch (error) {
        console.error('Error updating system icon:', error);
        // If we can't reach the API, assume offline
        if (lastSystemStatus !== 'offline') {
          lastSystemStatus = 'offline';
          updateSystemIconInSidebar('offline');
        }
      }
    }
    
    function updateSystemIconInSidebar(status) {
      const systemIcon = document.querySelector('#systemMenuItem img');
      if (systemIcon) {
        let iconPath;
        switch (status) {
          case 'healthy':
            iconPath = '/images/icons/system_icon_HEALTHY.png';
            break;
          case 'degraded':
          case 'unhealthy':
            iconPath = '/images/icons/system_icon_UNHEALTHY.png';
            break;
          case 'offline':
          default:
            iconPath = '/images/icons/system_icon_OFFLINE.png';
            break;
        }
        systemIcon.src = iconPath;
      }
    }
    
    // Update system tooltip text when sidebar state changes
    function updateSystemTooltipForSidebarState() {
      const tooltip = document.getElementById('systemHealthTooltip');
      if (!tooltip) return;
      
      const statusElement = tooltip.querySelector('.health-status');
      if (!statusElement) return;
      
      const sidebar = document.getElementById('sidebar');
      const isCollapsed = sidebar.classList.contains('collapsed');
      
      // Get current status from the element's class
      let currentStatus = 'offline';
      if (statusElement.classList.contains('healthy')) {
        currentStatus = 'healthy';
      } else if (statusElement.classList.contains('unhealthy')) {
        currentStatus = 'unhealthy';
      }
      
      // Update text based on current status and sidebar state
      let statusText = '';
      switch (currentStatus) {
        case 'healthy':
          statusText = isCollapsed ? 'System:' : 'Live';
          break;
        case 'unhealthy':
          statusText = isCollapsed ? 'System:' : 'Unhealthy';
          break;
        case 'offline':
        default:
          statusText = isCollapsed ? 'System:' : 'Offline';
          break;
      }
      
      statusElement.textContent = statusText;
    }
    
    // Collapsed Sidebar Tooltip Functions
    function initializeCollapsedSidebarTooltips() {
      const sidebar = document.getElementById('sidebar');
      const tooltipElements = sidebar.querySelectorAll('[data-tooltip]');
      
      tooltipElements.forEach(element => {
        element.addEventListener('mouseenter', showTooltip);
        element.addEventListener('mouseleave', hideTooltip);
      });
    }
    
    function showTooltip(event) {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('collapsed')) return;
      
      const tooltipText = event.target.getAttribute('data-tooltip');
      if (!tooltipText) return;
      
      // Remove any existing tooltip
      hideTooltip();
      
      // Create tooltip element
      const tooltip = document.createElement('div');
      tooltip.className = 'sidebar-tooltip';
      tooltip.textContent = tooltipText;
      
      // Position tooltip
      const rect = event.target.getBoundingClientRect();
      tooltip.style.left = rect.right + 8 + 'px';
      tooltip.style.top = rect.top + rect.height / 2 + 'px';
      tooltip.style.transform = 'translateY(-50%)';
      
      // Add to body and show
      document.body.appendChild(tooltip);
      setTimeout(() => {
        tooltip.style.opacity = '1';
        tooltip.style.visibility = 'visible';
      }, 10);
      
      // Store reference for cleanup
      event.target._tooltip = tooltip;
    }
    
    function hideTooltip(event) {
      const tooltips = document.querySelectorAll('.sidebar-tooltip');
      tooltips.forEach(tooltip => {
        tooltip.style.opacity = '0';
        tooltip.style.visibility = 'hidden';
        setTimeout(() => {
          if (tooltip.parentNode) {
            tooltip.parentNode.removeChild(tooltip);
          }
        }, 150);
      });
    }
    

    

    

  </script>

  <script>
  let lastFrontendChange = null;
  async function checkFrontendChanges() {
    try {
      const res = await fetch(window.location.origin + '/frontend-changes');
      const data = await res.json();
      if (lastFrontendChange && data.last_modified > lastFrontendChange) {
        location.reload();
      }
      lastFrontendChange = data.last_modified;
    } catch (e) {}
  }
  setInterval(checkFrontendChanges, 10000);
  </script>
