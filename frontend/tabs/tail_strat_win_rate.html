<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/rec_session.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tail_strat_win_rate</title>
  <link rel="stylesheet" href="/styles/global.css" />
  <script src="/js/db_changes_prefilter.js"></script>
  <script src="/js/realtime-ws-coordinator.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --page-bg: #101018;
      --panel: #323c4e;
      --border: #4a5568;
      --text: #ffffff;
      --muted: #c4c4c4;
      --chip: #2a3344;
      --w7: #4a9eff;
      --w30: #f0b429;
      --w90: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 24px 48px;
      background: var(--page-bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .toggle {
      display: inline-flex;
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .toggle button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle button.active {
      background: #1f6aa5;
      color: #fff;
    }
    .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .status.error { color: #ff8a8a; }
    .section-title {
      margin: 22px 0 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel-container {
      margin-bottom: 0;
      padding: 14px 16px 10px;
      min-height: 320px;
    }
    .panel-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .panel-title {
      margin-right: auto;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .panel-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stat {
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font: inherit;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      line-height: 1.45;
    }
    .stat:hover {
      border-color: #6a7a90;
      background: #323c4e;
    }
    .stat.active {
      border-color: #7a8aa0;
      background: #2c3648;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .stat strong {
      color: var(--text);
      font-weight: 700;
      margin-left: 4px;
    }
    .stat.w7 strong { color: var(--w7); }
    .stat.w30 strong { color: var(--w30); }
    .stat.w90 strong { color: var(--w90); }
    .stat.w7.active { border-color: var(--w7); }
    .stat.w30.active { border-color: var(--w30); }
    .stat.w90.active { border-color: var(--w90); }
    .chart-wrap {
      position: relative;
      height: 240px;
      margin-top: 4px;
      padding: 10px;
      background-color: #1f2530;
      border-radius: 5px;
      overflow: hidden;
    }
    .score-badge {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .score-badge.neg { color: #ff5c5c; }
    .score-badge.mid { color: #f0b429; }
    .score-badge.pos { color: #3ecf8e; }
    .score-badge.na { color: var(--muted); font-size: 14px; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 3px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 1px;
    }
    .legend .l7::before { background: var(--w7); }
    .legend .l30::before { background: var(--w30); }
    .legend .l90::before { background: var(--w90); }
    .legend .l1::before,
    .legend .l99::before {
      height: 0;
      border-top: 1px dashed rgba(255,255,255,0.55);
      background: transparent;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="toggle" role="group" aria-label="Tail side">
      <button type="button" id="btn-lt" class="active">Lower Tail</button>
      <button type="button" id="btn-ut">Upper Tail</button>
    </div>
  </div>

  <p class="status" id="status">Loading…</p>

  <div class="section-title">Crypto</div>
  <div class="grid" id="crypto-grid"></div>

  <div class="section-title">Commodities</div>
  <div class="grid" id="commodity-grid"></div>

  <script>
(function () {
  const API = "/api/tail_strat_win_rate";
  /** @type {Map<string, {chart: Chart, points: object[], panel: HTMLElement}>} */
  const charts = new Map();
  /** Per-series zoom window in calendar days (7/30/90), or null for full history. */
  const zoomBySeries = new Map();
  let side = "lt";

  const statusEl = document.getElementById("status");
  const cryptoGrid = document.getElementById("crypto-grid");
  const commodityGrid = document.getElementById("commodity-grid");
  const btnLt = document.getElementById("btn-lt");
  const btnUt = document.getElementById("btn-ut");

  function fmtPct(v) {
    if (v == null || Number.isNaN(Number(v))) return "—";
    return Number(v).toFixed(2) + "%";
  }

  /** 30d WR vs side baseline → −100..100 style score (pct points × 100). */
  function scoreFromLatest(latest) {
    if (!latest || latest.w30 == null || Number.isNaN(Number(latest.w30))) return null;
    const baseline = side === "ut" ? 99 : 1;
    return (Number(latest.w30) - baseline) * 100;
  }

  function scoreBadgeHtml(score) {
    if (score == null || Number.isNaN(Number(score))) {
      return '<div class="score-badge na">—</div>';
    }
    const s = Math.round(Number(score));
    const cls = s < 0 ? "neg" : s < 20 ? "mid" : "pos";
    const text = (s > 0 ? "+" : "") + String(s);
    return '<div class="score-badge ' + cls + '">' + text + "</div>";
  }

  function parseAsOf(raw) {
    const s = String(raw || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function slicePoints(points, days) {
    if (!days || !points || !points.length) return points || [];
    const end = parseAsOf(points[points.length - 1].as_of);
    if (!end) return points.slice(-days);
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return points.filter(function (p) {
      const d = parseAsOf(p.as_of);
      return d && d >= start && d <= end;
    });
  }

  function labelForPoint(p) {
    const s = String(p.as_of || "");
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(5, 10) : s;
  }

  function destroyCharts() {
    for (const entry of charts.values()) entry.chart.destroy();
    charts.clear();
  }

  function makePanel(asset) {
    const panel = document.createElement("div");
    panel.className = "panel-container";
    panel.dataset.series = asset.series;
    const latest = asset.latest || {};
    const zoom = zoomBySeries.get(asset.series) || null;
    panel.innerHTML =
      '<div class="panel-top">' +
        '<div class="panel-title">' + asset.symbol + "</div>" +
        '<div class="stats">' +
          '<button type="button" class="stat w7' + (zoom === 7 ? " active" : "") +
            '" data-zoom="7" title="Zoom chart to last 7 days">7d<strong>' +
            fmtPct(latest.w7) + "</strong></button>" +
          '<button type="button" class="stat w30' + (zoom === 30 ? " active" : "") +
            '" data-zoom="30" title="Zoom chart to last 30 days">30d<strong>' +
            fmtPct(latest.w30) + "</strong></button>" +
          '<button type="button" class="stat w90' + (zoom === 90 ? " active" : "") +
            '" data-zoom="90" title="Zoom chart to last 90 days">90d<strong>' +
            fmtPct(latest.w90) + "</strong></button>" +
        "</div>" +
        scoreBadgeHtml(scoreFromLatest(latest)) +
      "</div>" +
      '<div class="chart-wrap"><canvas></canvas></div>' +
      '<div class="legend">' +
        '<span class="l7">7d</span>' +
        '<span class="l30">30d</span>' +
        '<span class="l90">90d</span>' +
        '<span class="l1">' + (side === "ut" ? "99%" : "1%") + "</span>" +
      "</div>";
    return panel;
  }

  function setZoomActive(panel, days) {
    panel.querySelectorAll(".stat[data-zoom]").forEach(function (btn) {
      const d = Number(btn.getAttribute("data-zoom"));
      btn.classList.toggle("active", days != null && d === days);
    });
  }

  function applyChartWindow(series, days) {
    const entry = charts.get(series);
    if (!entry) return;
    const pts = slicePoints(entry.points, days);
    entry.chart.data.labels = pts.map(labelForPoint);
    entry.chart.data.datasets[0].data = pts.map(function (p) { return p.w7; });
    entry.chart.data.datasets[1].data = pts.map(function (p) { return p.w30; });
    entry.chart.data.datasets[2].data = pts.map(function (p) { return p.w90; });
    entry.chart.update("none");
    setZoomActive(entry.panel, days);
  }

  function wireZoomClicks(panel, series) {
    panel.querySelectorAll(".stat[data-zoom]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const days = Number(btn.getAttribute("data-zoom"));
        const cur = zoomBySeries.get(series) || null;
        const next = cur === days ? null : days;
        if (next == null) zoomBySeries.delete(series);
        else zoomBySeries.set(series, next);
        applyChartWindow(series, next);
      });
    });
  }

  function yAxisForSide() {
    return side === "ut"
      ? { min: 97.5, max: 100, step: 0.5, baseline: 99 }
      : { min: 0, max: 2.5, step: 0.5, baseline: 1 };
  }

  const baselinePlugin = {
    id: "fairBaselines",
    afterDraw: function (chart) {
      const yScale = chart.scales.y;
      const area = chart.chartArea;
      if (!yScale || !area) return;
      const level = chart.options.plugins && chart.options.plugins.fairBaselines
        ? chart.options.plugins.fairBaselines.level
        : 1;
      if (level < yScale.min || level > yScale.max) return;
      const y = yScale.getPixelForValue(level);
      const ctx = chart.ctx;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1;
      ctx.moveTo(area.left, y);
      ctx.lineTo(area.right, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#c4c4c4";
      ctx.font = "10px IBM Plex Sans, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(level + "%", area.right - 4, y - 4);
      ctx.restore();
    },
  };

  function buildChart(canvas, points) {
    const axis = yAxisForSide();
    const mk = (key, label, color) => ({
      label,
      data: points.map((p) => p[key]),
      borderColor: color,
      backgroundColor: "transparent",
      borderWidth: 1.75,
      pointRadius: 0,
      pointHoverRadius: 3,
      tension: 0.15,
      spanGaps: false,
    });
    return new Chart(canvas.getContext("2d"), {
      type: "line",
      data: {
        labels: points.map(labelForPoint),
        datasets: [
          mk("w7", "7d", "#4a9eff"),
          mk("w30", "30d", "#f0b429"),
          mk("w90", "90d", "#3ecf8e"),
        ],
      },
      plugins: [baselinePlugin],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          fairBaselines: { level: axis.baseline },
          tooltip: {
            callbacks: {
              label(ctx) {
                const v = ctx.parsed.y;
                return ctx.dataset.label + ": " + (v == null ? "—" : v.toFixed(3) + "%");
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: "#c4c4c4",
              maxRotation: 0,
              autoSkip: true,
              maxTicksLimit: 8,
              font: { size: 10 },
            },
            grid: { color: "rgba(255,255,255,0.06)" },
          },
          y: {
            min: axis.min,
            max: axis.max,
            ticks: {
              stepSize: axis.step,
              color: "#c4c4c4",
              font: { size: 10 },
              callback: function (v) { return v + "%"; },
            },
            grid: { color: "rgba(255,255,255,0.08)" },
            title: {
              display: true,
              text: "Win rate %",
              color: "#c4c4c4",
              font: { size: 11 },
            },
          },
        },
      },
    });
  }

  function render(payload) {
    destroyCharts();
    cryptoGrid.innerHTML = "";
    commodityGrid.innerHTML = "";
    for (const asset of payload.assets || []) {
      const panel = makePanel(asset);
      const fullPoints = asset.points || [];
      const zoom = zoomBySeries.get(asset.series) || null;
      const chart = buildChart(
        panel.querySelector("canvas"),
        slicePoints(fullPoints, zoom)
      );
      charts.set(asset.series, { chart: chart, points: fullPoints, panel: panel });
      wireZoomClicks(panel, asset.series);
      if (asset.asset_class === "commodity") commodityGrid.appendChild(panel);
      else cryptoGrid.appendChild(panel);
    }
  }

  let loadInFlight = null;
  let refreshTimer = null;
  let dbUnsub = null;

  async function load(opts) {
    const silent = !!(opts && opts.silent);
    if (!silent) {
      statusEl.classList.remove("error");
      statusEl.textContent = "Loading…";
    }
    const run = (async function () {
      try {
        const r = await fetch(API + "?side=" + encodeURIComponent(side), {
          credentials: "same-origin",
          headers: { Accept: "application/json" },
        });
        if (!r.ok) {
          const t = await r.text();
          throw new Error(r.status + " " + (t || r.statusText));
        }
        const payload = await r.json();
        render(payload);
        const n = (payload.assets || []).length;
        statusEl.classList.remove("error");
        statusEl.textContent =
          (side === "ut" ? "Upper Tail" : "Lower Tail") +
          " · " + n + " assets · pooled wins ÷ scored fills · live";
      } catch (err) {
        if (!silent) {
          statusEl.classList.add("error");
          statusEl.textContent = "Failed to load: " + (err && err.message ? err.message : err);
          destroyCharts();
          cryptoGrid.innerHTML = "";
          commodityGrid.innerHTML = "";
        }
      }
    })();
    loadInFlight = run;
    try {
      await run;
    } finally {
      if (loadInFlight === run) loadInFlight = null;
    }
  }

  function scheduleLiveRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      load({ silent: true });
    }, 400);
  }

  function connectLive() {
    if (dbUnsub) {
      try { dbUnsub(); } catch (e) { /* ignore */ }
      dbUnsub = null;
    }
    if (!window.recRealtimeWsCoordinator || typeof window.recRealtimeWsCoordinator.subscribe !== "function") {
      return;
    }
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = protocol + "//" + window.location.host + "/ws/db_changes";
    dbUnsub = window.recRealtimeWsCoordinator.subscribe(wsUrl, {
      onlyDbStreams: ["tail_backtest_rolling_rates"],
      onMessage: function (event) {
        try {
          const data =
            typeof recRealtimeWsJson === "function" ? recRealtimeWsJson(event) : JSON.parse(event.data);
          if (data && data.type === "db_change" && data.database === "tail_backtest_rolling_rates") {
            scheduleLiveRefresh();
          }
        } catch (e) {
          // ignore malformed frames
        }
      },
    });
  }

  btnLt.addEventListener("click", function () {
    if (side === "lt") return;
    side = "lt";
    btnLt.classList.add("active");
    btnUt.classList.remove("active");
    zoomBySeries.clear();
    load();
  });
  btnUt.addEventListener("click", function () {
    if (side === "ut") return;
    side = "ut";
    btnUt.classList.add("active");
    btnLt.classList.remove("active");
    zoomBySeries.clear();
    load();
  });

  connectLive();
  load();
})();
  </script>
</body>
</html>
