<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Session: load rec_session.js after optional dev handoff (#rec_dev=…) so standalone tabs on
    another port (e.g. :8091) can use the same tenant as the main app. See
    /tabs/trade_monitor_NEW_standalone_handoff.html (open while logged in on this origin).
  -->
  <script>
(function () {
  try {
    var hn = window.location.hostname || '';
    var dev =
      hn === 'localhost' ||
      hn === '127.0.0.1' ||
      hn.endsWith('.local') ||
      hn.startsWith('192.168.') ||
      hn.startsWith('10.');
    if (!dev) return;
    var raw = window.location.hash || '';
    var prefix = '#rec_dev=';
    if (raw.indexOf(prefix) !== 0) return;
    var encoded = raw.slice(prefix.length);
    if (!encoded) return;
    var decoded = decodeURIComponent(encoded);
    if (!decoded || decoded.length > 12000) return;
    var o = JSON.parse(decoded);
    if (!o || typeof o !== 'object') return;
    var tok = typeof o.token === 'string' ? o.token.trim() : '';
    var un = typeof o.user_no === 'string' ? o.user_no.trim() : '';
    if (!tok || !/^\d{4}$/.test(un)) return;
    var apiIn = typeof o.api_origin === 'string' ? o.api_origin.trim() : '';
    var apiOrigin = null;
    if (apiIn) {
      try {
        var u = new URL(apiIn);
        if (u.protocol === 'http:' || u.protocol === 'https:') apiOrigin = u.origin;
      } catch (e1) {}
    }
    if (apiOrigin) window.__TM_NEW_API_ORIGIN__ = apiOrigin;
    try {
      localStorage.setItem('rec_auth_token', tok);
      localStorage.setItem('rec_user_no', un);
    } catch (e2) {}
    try {
      history.replaceState(null, '', window.location.pathname + (window.location.search || ''));
    } catch (e3) {}
  } catch (e) {
    /* ignore malformed handoff */
  }
})();
  </script>
  <script src="/js/rec_session.js"></script>

.trade-monitor-new .book-table td.mid-row {

.trade-monitor-new .side-col {

</head>
<body class="trade-monitor-new-page">
  <div id="container">
    <div class="u-hidden" aria-hidden="true">
      <label class="u-hidden" for="monitor-picker">Active monitor</label>
      <select id="monitor-picker" class="dropdown-picker" name="monitor" aria-label="Active monitor" tabindex="-1"></select>
    </div>
    <div class="tm-new-top-row">
      <div class="panel-container trade-monitor-new tm-new-mkt-head-wrap">
        <div class="mkt-head" id="mktHead">
          <button
            type="button"
            class="tm-new-monitor-trigger"
            id="mktHeadTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="tmNewMonitorDropdown"
          >
            <div class="mkt-icon mkt-icon--btc" id="mktIcon" aria-hidden="true"></div>
            <div class="mkt-text">
              <p class="mkt-title" id="mktTitle">—</p>
              <p class="mkt-window" id="mktWindow"></p>
            </div>
          </button>
          <div class="tm-new-mkt-head-trailing">
            <div class="tm-new-auto-trade-block">
              <button
                type="button"
                class="tm-new-uat-settings-btn"
                id="tmNewAutoTradeSettingsBtn"
                aria-label="Monitor Settings"
              >
                <img src="/images/icons/panel_settings.png" alt="" width="16" height="16" draggable="false" />
              </button>
              <span class="auto-trade-label">AUTO TRADE</span>
              <div
                class="auto-trade-toggle"
                id="tmNewAutoTradeToggle"
                role="switch"
                tabindex="0"
                aria-checked="false"
                aria-label="Auto trade for active monitor"
              ></div>
            </div>
            <div class="ttc-chip" id="tmNewTtcClock" aria-live="polite">--:--</div>
          </div>
        </div>
        <div class="tm-new-monitor-dropdown" id="tmNewMonitorDropdown" aria-hidden="true">
          <div class="tm-new-monitor-dropdown-scroll" id="tmNewMonitorDropdownList" role="listbox" aria-label="Active monitors"></div>
        </div>
      </div>
      <div class="panel-container trade-monitor-new tm-new-account-panel" id="tmNewAccountPanel">
        <div class="tm-new-account-panel-inner">

            <div class="tm-new-account-display" id="tmNewAccountDisplay" aria-live="polite">
              <span class="trading-mode-mode trading-mode-mode--live" id="tmNewAccountMode">LIVE</span><span class="trading-mode-sep" id="tmNewAccountSep"></span><span class="trading-mode-name" id="tmNewAccountName"></span>
            </div>
            <div
              class="paper-trading-toggle live-mode"
              id="tmNewPaperTradeToggle"
              role="button"
              tabindex="0"
              aria-label="Toggle live or paper trading for this monitor"
            >
              <div class="paper-trading-toggle-slider" aria-hidden="true"></div>
              <div class="paper-trading-toggle-option">LIVE</div>
              <div class="paper-trading-toggle-option">PAPER</div>
            </div>
          </div>
          <div class="tm-new-monitor-bankroll-wrap">
            <span class="tm-new-monitor-bankroll-label" id="tmNewBankrollLabel">Monitor Bankroll:</span>
            <div
              class="tm-new-monitor-bankroll"
              id="tmNewMonitorBankroll"
              aria-labelledby="tmNewBankrollLabel"
              aria-live="polite"
            >
              —
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tm-new-lower-row">
    <div class="tm-new-main-grid">
      <!-- Row 1: TradingView; live spot + % changes overlaid top-left inside chart area -->
      <div class="panel-container trade-monitor-new tm-new-price-panel" id="tickerPanelContainer">
        <div id="tickerPanel" class="tm-new-ticker-panel">
          <div class="tm-new-chart-wrap">
            <div class="tm-new-price-overlay" aria-live="polite">
              <div class="tm-new-price-overlay-price">
                <span id="symbol-price-value">$—</span>
              </div>
              <div class="tm-new-price-overlay-changes" id="symbol-changes-cell">
                1h &nbsp;<span id="change-1h">—</span> &nbsp;&nbsp; 3h &nbsp;<span id="change-3h">—</span> &nbsp;&nbsp; 1d &nbsp;<span id="change-1d">—</span>
              </div>
            </div>
            <div id="tradingview_12345" class="tm-new-chart-mount"></div>
          </div>
        </div>
      </div>
      <!-- Strike table + orderbook (full width under chart) -->
      <div class="tm-new-orderbook-stack">
        <div class="panel-container trade-monitor-new" id="tmNewRoot">

          <div class="quote-row u-hidden" id="quoteRow" onclick="toggleOrderbook()" aria-hidden="true">

              <colgroup><col class="side"/><col class="price"/><col class="contracts"/><col class="total"/></colgroup>
              <thead><tr><th></th><th>Price</th><th>Contracts</th><th>Total</th></tr></thead>
            </table>
            <div class="panel-scroll" id="bookScroll">
              <table class="book-table">
                <colgroup><col class="side"/><col class="price"/><col class="contracts"/><col class="total"/></colgroup>
                <tbody id="asks" class="asks"></tbody>
                <tbody>
                  <tr><td colspan="4" id="midPrice" class="mid-row mid-yes"></td></tr>

      </div>

        <div class="tm-new-order-panel-placeholder"></div>
      </div>
    </div>
    </div>
    <!-- Hidden: active monitor symbol (rebuilt in trade-monitor-new-init). -->
    <select id="ticker-picker" class="u-hidden" aria-hidden="true" tabindex="-1"><option value="BTC">BTC</option></select>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var sym = (params.get('symbol') || 'BTC').toString().trim().toUpperCase() || 'BTC';
      var mkt = (params.get('market') || '15m').toString().trim().toLowerCase();
      if (mkt !== 'hourly') mkt = '15m';
      var p = window.__READ_API_PORT__ != null && window.__READ_API_PORT__ !== '' ? String(window.__READ_API_PORT__) : '3050';
      var proto = window.location.protocol || 'http:';
      var host = window.location.hostname || 'localhost';
      window.__ORDERBOOK_API__ =
        proto + '//' + host + ':' + p +
        '/api/trade-monitor/orderbook?symbol=' + encodeURIComponent(sym) +
        '&market=' + encodeURIComponent(mkt);
      try {
        document.body.dataset.currentSymbol = sym;
        document.body.dataset.currentMarket = mkt;
      } catch (e) {}
    })();
  </script>
