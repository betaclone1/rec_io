<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Session: load rec_session.js after optional dev handoff (#rec_dev=…) so standalone tabs on
    another port (e.g. :8091) can use the same tenant as the main app. See
    /tabs/trade_monitor_NEW_standalone_handoff.html (open while logged in on this origin).
  -->
  <script>
(function () {
  try {
    var hn = window.location.hostname || '';
    var dev =
      hn === 'localhost' ||
      hn === '127.0.0.1' ||
      hn.endsWith('.local') ||
      hn.startsWith('192.168.') ||
      hn.startsWith('10.');
    if (!dev) return;
    var raw = window.location.hash || '';
    var prefix = '#rec_dev=';
    if (raw.indexOf(prefix) !== 0) return;
    var encoded = raw.slice(prefix.length);
    if (!encoded) return;
    var decoded = decodeURIComponent(encoded);
    if (!decoded || decoded.length > 12000) return;
    var o = JSON.parse(decoded);
    if (!o || typeof o !== 'object') return;
    var tok = typeof o.token === 'string' ? o.token.trim() : '';
    var un = typeof o.user_no === 'string' ? o.user_no.trim() : '';
    if (!tok || !/^\d{4}$/.test(un)) return;
    var apiIn = typeof o.api_origin === 'string' ? o.api_origin.trim() : '';
    var apiOrigin = null;
    if (apiIn) {
      try {
        var u = new URL(apiIn);
        if (u.protocol === 'http:' || u.protocol === 'https:') apiOrigin = u.origin;
      } catch (e1) {}
    }
    if (apiOrigin) window.__TM_NEW_API_ORIGIN__ = apiOrigin;
    try {
      localStorage.setItem('rec_auth_token', tok);
      localStorage.setItem('rec_user_no', un);
    } catch (e2) {}
    try {
      history.replaceState(null, '', window.location.pathname + (window.location.search || ''));
    } catch (e3) {}
  } catch (e) {
    /* ignore malformed handoff */
  }
})();
  </script>
  <script src="/js/rec_session.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
.trade-monitor-new-page {

}

body.trade-monitor-new-page #container {
  background-color: transparent;
  width: 100%;
  max-width: 100%;
  min-height: calc(100vh - 20px);
  box-sizing: border-box;
}

/* Two-column layout: left = two stacked panels (legacy col1); right = market header + orderbook (unchanged blocks). */
.trade-monitor-new-page .tm-new-main-grid {
  display: grid;

  grid-template-columns: minmax(320px, 33.3333vw) minmax(520px, 1fr);

}

}

.trade-monitor-new-page .tm-new-monitor-picker-panel {

  grid-row: 1;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  min-width: 0;

  padding-top: 10px;
  padding-bottom: 10px;
}

.trade-monitor-new-page .tm-new-monitor-select {

  width: 100%;
  max-width: 100%;

  height: 100%;
}

.trade-monitor-new-page .tm-new-mkt-head-wrap .mkt-head {
  margin: 0;
}

.trade-monitor-new-page .tm-new-price-panel {

.trade-monitor-new-page .tm-new-orderbook-stack {

.trade-monitor-new .hourly-strike-table td.hourly-col-bufpct,

.trade-monitor-new .panel-head {

<body class="trade-monitor-new-page">
  <div id="container">
    <div class="tm-new-main-grid">
      <!-- Panel 1 (left, top): monitor picker only — same row as market header -->
      <div class="panel-container trade-monitor-new tm-new-monitor-picker-panel" id="tmNewMonitorPickerPanel">
        <label class="u-hidden" for="monitor-picker">Active monitor</label>
        <select id="monitor-picker" class="dropdown-picker tm-new-monitor-select" name="monitor" aria-label="Active monitor"></select>
      </div>
      <!-- Panel 2 (right, top): existing market header -->
      <div class="panel-container trade-monitor-new tm-new-mkt-head-wrap">
        <div class="mkt-head" id="mktHead">
          <div class="mkt-icon mkt-icon--btc" id="mktIcon" aria-hidden="true">₿</div>
          <div class="mkt-text">
            <p class="mkt-title" id="mktTitle">—</p>
            <p class="mkt-window" id="mktWindow"></p>
          </div>
          <div class="ttc-chip" id="tmNewTtcClock" aria-live="polite">--:--</div>
        </div>
      </div>
      <!-- Panel 3 (left, bottom): symbol price + changes + TradingView -->
      <div class="panel-container trade-monitor-new tm-new-price-panel" id="tickerPanelContainer">
        <table id="tickerPanel" class="panel-table">
          <tbody>
            <tr class="price-row">
              <td style="position: relative;">
                <span id="symbol-price-value" style="display: inline-block;">$—</span>
              </td>
            </tr>
            <tr class="change-row">
              <td id="symbol-changes-cell">1h &nbsp;<span id="change-1h">—</span> &nbsp;&nbsp; 3h &nbsp;<span id="change-3h">—</span> &nbsp;&nbsp; 1d &nbsp;<span id="change-1d">—</span></td>
            </tr>
            <tr class="chart-row">
              <td><div id="tradingview_12345"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- Right column bottom: quote + orderbook only (unchanged inner) -->
      <div class="tm-new-orderbook-stack">
        <div class="panel-container trade-monitor-new" id="tmNewRoot">
          <div id="loadErr" class="load-err u-hidden"></div>

          <div class="quote-row u-hidden" id="quoteRow" onclick="toggleOrderbook()" aria-hidden="true">
            <div class="quote-strike quote-strike--stack" id="quoteStrike">
              <span class="quote-strike-value">—</span>
            </div>
            <div class="tabs">
              <div class="tab active tab-yes" id="tabYes" onclick="setMode(event, 'yes')">Yes —</div>
              <div class="tab tab-no" id="tabNo" onclick="setMode(event, 'no')">No —</div>
            </div>
          </div>

          <div class="book-panel u-hidden" id="bookPanel" aria-hidden="true">
            <table class="book-table panel-head">
              <colgroup><col class="side"/><col class="price"/><col class="contracts"/><col class="total"/></colgroup>
              <thead><tr><th></th><th>Price</th><th>Contracts</th><th>Total</th></tr></thead>
            </table>
            <div class="panel-scroll" id="bookScroll">
              <table class="book-table">
                <colgroup><col class="side"/><col class="price"/><col class="contracts"/><col class="total"/></colgroup>
                <tbody id="asks" class="asks"></tbody>
                <tbody>
                  <tr><td colspan="4" id="midPrice" class="mid-row mid-yes"></td></tr>
                </tbody>
                <tbody id="bids" class="bids"></tbody>
              </table>
            </div>
          </div>
          <div class="hourly-strike-list" id="hourlyStrikeList"></div>
        </div>
      </div>
    </div>
    <!-- Hidden: active monitor symbol (rebuilt in trade-monitor-new-init). -->
    <select id="ticker-picker" class="u-hidden" aria-hidden="true" tabindex="-1"><option value="BTC">BTC</option></select>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var sym = (params.get('symbol') || 'BTC').toString().trim().toUpperCase() || 'BTC';
      var mkt = (params.get('market') || '15m').toString().trim().toLowerCase();
      if (mkt !== 'hourly') mkt = '15m';
      var p = window.__READ_API_PORT__ != null && window.__READ_API_PORT__ !== '' ? String(window.__READ_API_PORT__) : '3050';
      var proto = window.location.protocol || 'http:';
      var host = window.location.hostname || 'localhost';
      window.__ORDERBOOK_API__ =
        proto + '//' + host + ':' + p +
        '/api/trade-monitor/orderbook?symbol=' + encodeURIComponent(sym) +
        '&market=' + encodeURIComponent(mkt);
      try {
        document.body.dataset.currentSymbol = sym;
        document.body.dataset.currentMarket = mkt;
      } catch (e) {}
    })();
  </script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script src="/js/trade-monitor-new-init.js"></script>
  <script src="/js/orderbook-redis-ui.js"></script>
</body>
</html>
