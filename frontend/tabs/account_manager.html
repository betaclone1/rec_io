<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Account Overview</title>
  <link rel="stylesheet" href="/styles/global.css" />
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th, td {
      border: 1px solid #787878;
      padding: 6px 10px;
      text-align: center;
    }
    th {
      background-color: #1f2530;
      font-weight: bold;
    }
    tbody tr:hover {
      background-color: #4d586f !important;
      cursor: pointer;
    }
    .group-odd {
      background-color: #394559;
    }
    .group-even {
      background-color: #1f2633;
    }
  </style>
</head>
<body>
    <div class="panel-container" style="width: 750px;">
        <div class="panel">
      <div class="panel-header">Account Information</div>
      
      <div class="panel-body" style="padding-left: 30px;">
        <div style="margin-top: 5px; margin-bottom: 15px; font-size: 14px; display: flex; align-items: center; gap: 15px;">
          <span id="brokerage-info">Loading...</span>
          <a href="https://kalshi.com/account/profile" target="_blank" style="color: #4a9eff; text-decoration: none; font-size: 12px;">Account</a>
          <a href="https://kalshi.com/portfolio" target="_blank" style="color: #4a9eff; text-decoration: none; font-size: 12px;">Portfolio</a>
        </div>
        <div style="display: flex; font-size: 12px; align-items: center; margin-bottom: 4px;">
          <div style="font-weight: bold; width: 320px;">Portfolio</div>
          <div style="font-weight: bold; width: 320px;">Cash</div>
          <div style="font-weight: bold; width: 320px;">Positions</div>
        </div>
        <div style="display: flex; align-items: center;">
          <span id="portfolio-value" style="width: 320px;">Loading...</span>
          <span id="cash-value" style="width: 320px;">Loading...</span>
          <span id="positions-value" style="width: 320px;">Loading...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Open Positions panel -->
  <div class="panel-container" style="width: 750px;">
    <div class="panel">
      <div class="panel-header">Open Positions</div>
      <div class="panel-body">
        <table class="data-table" style="width: 100%; text-align: center;">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Buy</th>
              <th>Position</th>
              <th>Fees</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="positions-body">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Fills panel -->
  <div class="panel-container" style="width: 750px;">
    <div class="panel">
      <div class="panel-header">Fills</div>
     
      <div class="panel-body" style="height: 200px; overflow-y: auto;">
        <table class="data-table" style="width: 100%; text-align: center;">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Side</th>
              <th>Action</th>
              <th>Count</th>
              <th>Price</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="fills-body">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Settlements panel -->
  <div class="panel-container" style="width: 750px;">
    <div class="panel">
      <div class="panel-header">Settlements</div>
      <div class="panel-body" style="height: 200px; overflow-y: auto;">
        <table class="data-table" style="width: 100%; text-align: center;">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Result</th>
              <th>Yes</th>
              <th>No</th>
              <th>Revenue</th>
              <th>Settled At</th>
            </tr>
          </thead>
          <tbody id="settlements-body">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <script>
    let GLOBAL_ACCOUNT_MODE = "prod";  // Will be updated by backend

    fetch(window.location.origin + '/api/get_account_mode')
      .then(res => res.json())
      .then(data => {
        GLOBAL_ACCOUNT_MODE = data.mode;
        window.GLOBAL_ACCOUNT_MODE = GLOBAL_ACCOUNT_MODE;

        const selector = document.getElementById("account-selector");
        if (selector) {
          selector.value = data.mode === 'prod' ? 'live' : 'demo';
        }

        const statusEl = document.getElementById("account-status");
        if (statusEl) {
          if (GLOBAL_ACCOUNT_MODE === 'prod') {
            statusEl.textContent = "*** LIVE TRADING ***";
            statusEl.style.color = "#00ff00";
            statusEl.style.fontWeight = "bold";
          } else {
            statusEl.textContent = "Paper Trading";
            statusEl.style.color = "orange";
            statusEl.style.fontWeight = "normal";
          }
        }

        loadAccountData();
      })
      .catch(console.error);

    async function loadAccountData() {
      const [balanceRes, settlementsRes, fillsRes, positionsRes, emailRes] = await Promise.all([
        fetch(`${window.location.origin}/api/account/balance?mode=${GLOBAL_ACCOUNT_MODE}`),
        fetch(window.location.origin + "/api/db/settlements"),
        fetch(window.location.origin + "/api/db/fills"),
        fetch(window.location.origin + "/api/db/positions"),
        fetch(window.location.origin + "/api/get_kalshi_email"),
      ]);

      const settlementsJson = await settlementsRes.json();
      const fillsJson = await fillsRes.json();
      const positionsJson = await positionsRes.json();
      const emailJson = await emailRes.json();

      const settlements = settlementsJson.settlements;
      const fills = fillsJson.fills;
      const positions = positionsJson.positions || [];
      
      // Update brokerage info with email
      const brokerageInfoEl = document.getElementById("brokerage-info");
      if (brokerageInfoEl) {
        const email = emailJson.email || "No email found";
        brokerageInfoEl.textContent = `${email}`;
      }

      window.fills = fills;

      const [prodBalRes, demoBalRes] = await Promise.all([
        fetch(window.location.origin + "/api/account/balance?mode=prod"),
        fetch(window.location.origin + "/api/account/balance?mode=demo"),
      ]);

      const prodBalJson = await prodBalRes.json();
      const demoBalJson = await demoBalRes.json();

      const activeBal = GLOBAL_ACCOUNT_MODE === "prod" ? prodBalJson : demoBalJson;
      
      // Update Portfolio value
      const portfolioVal = activeBal.portfolio ?? 0;
      const portfolioInDollars = portfolioVal / 100; // Convert cents to dollars
      const portfolioEl = document.getElementById("portfolio-value");
      if (portfolioEl) {
        portfolioEl.textContent = `$${Number(portfolioInDollars).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      }
      
      // Update Positions value
      const positionsVal = activeBal.positions ?? 0;
      const positionsInDollars = positionsVal / 100; // Convert cents to dollars
      const positionsEl = document.getElementById("positions-value");
      if (positionsEl) {
        positionsEl.textContent = `$${Number(positionsInDollars).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      }
      
      // Calculate Cash as difference between portfolio and positions
      const cashVal = portfolioVal - positionsVal;
      const cashInDollars = cashVal / 100; // Convert cents to dollars
      const cashEl = document.getElementById("cash-value");
      if (cashEl) {
        cashEl.textContent = `$${Number(cashInDollars).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      }

            const settlementsBody = document.getElementById("settlements-body");
      if (settlementsBody) {
        // Sort settlements by settled_time in descending order (newest first)
        const sortedSettlements = settlements.sort((a, b) => new Date(b.settled_time) - new Date(a.settled_time));
        
        settlementsBody.innerHTML = sortedSettlements.map(s => {
        // Revenue is already in whole dollars, display as is
        const formattedRevenue = s.revenue.toLocaleString(undefined, { 
          minimumFractionDigits: 0, 
          maximumFractionDigits: 0 
        });
        
        return `
          <tr>
            <td>${s.ticker}</td>
            <td>${s.market_result === "yes" ? "Y" : "N"}</td>
            <td>${s.yes_count}</td>
            <td>${s.no_count}</td>
            <td>$${formattedRevenue}</td>
            <td>${new Date(s.settled_time).toLocaleString("en-US", { timeZone: "America/New_York" })}</td>
          </tr>
        `;
      }).join("");
        }

            const fillsBody = document.getElementById("fills-body");
      if (fillsBody) {
        fillsBody.innerHTML = fills.map(f => {
        // Get price based on side with no formatting
        const price = f.side === "yes" ? f.yes_price : f.no_price;
        
        return `
          <tr>
            <td>${f.ticker}</td>
            <td>${f.side === "yes" ? "Y" : "N"}</td>
            <td>${f.action.toUpperCase()}</td>
            <td>${f.count}</td>
            <td>${price}</td>
            <td>${new Date(f.created_time).toLocaleString("en-US", { timeZone: "America/New_York" })}</td>
          </tr>
        `;
      }).join("");
        }

      const positionsBody = document.getElementById("positions-body");
      if (positionsBody) {
        positionsBody.innerHTML = positions
          .filter(p => p.position !== 0)
          .map(p => `
            <tr>
              <td>${p.ticker}</td>
              <td>${p.market_exposure && p.position !== 0 ? (p.market_exposure / p.position / 100).toFixed(2) : "0.00"}</td>
              <td>${p.position}</td>
              <td>${p.fees_paid.toFixed(2)}</td>
              <td>${new Date(p.last_updated_ts).toLocaleString("en-US", { timeZone: "America/New_York" })}</td>
            </tr>
          `).join("");
      }
    }



    // Respect backend-set mode only
    loadAccountData();
    
    // WebSocket connection for database change notifications
    function setupDatabaseChangeListener() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${window.location.host}/ws/db_changes`);
      
      ws.onopen = function() {
        console.log('🔗 Connected to database change notifications (account manager)');
      };
      
      ws.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          console.log('📡 Received database change notification (account manager):', data);
          
          // Handle different database change types and refresh immediately
          if (data.database === 'fills' || data.database === 'positions' || 
              data.database === 'settlements' || data.database === 'account_balance') {
            console.log('🔄 Refreshing account data due to database change (account manager)');
            loadAccountData();
          }
        } catch (error) {
          console.error('❌ Error parsing database change notification (account manager):', error);
        }
      };
      
      ws.onerror = function(error) {
        console.error('❌ WebSocket error (account manager):', error);
      };
      
      ws.onclose = function() {
        console.log('🔌 Database change WebSocket connection closed (account manager)');
        // Attempt to reconnect after a delay
        setTimeout(() => {
          console.log('🔄 Attempting to reconnect to database change notifications (account manager)...');
          setupDatabaseChangeListener();
        }, 5000);
      };
    }
    
    // Set up WebSocket connection for database change notifications
    setupDatabaseChangeListener();

    // Periodic auto-refresh every 10 seconds
    function setupPeriodicRefresh() {
      const refreshInterval = 10000; // 10 seconds
      
      setInterval(() => {
        console.log('⏰ Periodic refresh triggered (account manager)');
        loadAccountData();
      }, refreshInterval);
      
      console.log('⏰ Periodic refresh setup: every 10 seconds (account manager)');
    }

    // Set up periodic auto-refresh every 10 seconds
    setupPeriodicRefresh();

    function arrayToCSV(rows, headerOrder) {
      const escape = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const header = headerOrder.map(escape).join(',');
      const body = rows.map(r => headerOrder.map(k => escape(r[k])).join(',')).join('\n');
      return `${header}\n${body}`;
    }

    function downloadCSV() {
      if (!Array.isArray(window.fills) || !window.fills.length) {
        alert('No fills loaded yet.');
        return;
      }

      const columns = ['ticker','side','action','count','yes_price','no_price','created_time'];
      const csv = arrayToCSV(window.fills, columns);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `fills_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();

      URL.revokeObjectURL(url);
    }

    const downloadBtn = document.getElementById('download-csv-btn');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', downloadCSV);
    }
  </script>
</body>
</html>
