<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/rec_session.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Tools - REC.IO</title>
  <link rel="stylesheet" href="/styles/global.css">
  <script src="/js/db_changes_prefilter.js"></script>
  <script src="/js/realtime-ws-coordinator.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding-right: 5%;
    }

    :root {
      --bg-primary: #1e1e2f;
      --bg-secondary: #323c4e;
      --border-color: #3d4552;
      --text-primary: #ffffff;
      --text-secondary: #c4c4c4;
      --accent-color: #3498db;
    }

    .master-user-search-row {
      margin-bottom: 10px;
    }

    .master-user-search-row label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .master-user-search-input {
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }

    .master-user-search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.85;
    }

    .master-user-search-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .table-wrap {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: auto;
      max-width: 100%;
    }

    .master-users-table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      font-size: 12px;
      font-family: inherit;
    }

    .master-users-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 10px 8px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .master-users-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      vertical-align: top;
      font-family: inherit;
    }

    .master-users-table tr:last-child td {
      border-bottom: none;
    }

    .master-users-table tbody tr:hover {
      background: var(--bg-primary);
    }

    .admin-master-select.admin-status-pending-approval {
      background-color: #7f1d1d !important;
      color: #fecaca !important;
      border: 1px solid #991b1b !important;
    }

    .loading, .error, .empty {
      padding: 32px;
      text-align: center;
      color: var(--text-secondary);
 }

    .error {
      color: #ef4444;
    }

    .admin-section-title {
      margin: 28px 0 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .master-events-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .master-events-controls label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .master-events-controls select,
    .master-events-controls input[type="number"] {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
    }

    .master-events-btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--accent-color);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .master-events-btn.secondary {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .master-events-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 12px;
    }

    .master-events-table th,
    .master-events-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      vertical-align: top;
    }

    .master-events-table th {
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      z-index: 1;
    }

    .sev-critical { color: #f87171; font-weight: 600; }
    .sev-warning { color: #fbbf24; }
    .sev-info { color: var(--text-secondary); }

    .detail-link {
      color: var(--accent-color);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
    }

    .master-events-message {
      max-width: 420px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="status"></div>
  <div class="master-user-search-row">
    <label for="masterUserSearch">Search users</label>
    <input type="search" id="masterUserSearch" class="master-user-search-input"
      placeholder="Match any column (name, email, user ID, status, …)" autocomplete="off" spellcheck="false">
  </div>
  <div id="tableHost"></div>

  <h2 class="admin-section-title">System Event Log</h2>
  <div id="masterEventsStatus"></div>
  <div class="master-events-controls">
    <div>
      <label for="masterEventsCategory">Category</label>
      <select id="masterEventsCategory">
        <option value="">All</option>
        <option value="RESTART">RESTART</option>
        <option value="WS">WS</option>
        <option value="DEPLOY">DEPLOY</option>
        <option value="TRADING_HALT">TRADING_HALT</option>
        <option value="MAINTENANCE">MAINTENANCE</option>
        <option value="ANOMALY">ANOMALY</option>
        <option value="MONITOR">MONITOR</option>
        <option value="BACKUP">BACKUP</option>
      </select>
    </div>
    <div>
      <label for="masterEventsSeverity">Severity</label>
      <select id="masterEventsSeverity">
        <option value="">All</option>
        <option value="critical">critical</option>
        <option value="warning">warning</option>
        <option value="info">info</option>
      </select>
    </div>
    <div>
      <label for="masterEventsLimit">Limit</label>
      <select id="masterEventsLimit">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </div>
    <div>
      <button type="button" class="master-events-btn" id="masterEventsRefresh">Refresh</button>
    </div>
    <div>
      <button type="button" class="master-events-btn secondary" id="masterEventsLiveToggle">Live: off</button>
    </div>
  </div>
  <div class="table-wrap" id="masterEventsHost"></div>

  <script>
    (function () {
      var COLUMN_ORDER = [
        'id', 'user_no', 'user_id', 'first_name', 'last_name', 'email', 'phone',
        'account_type', 'status', 'monitors', 'registration_date', 'last_login'
      ];

      var HIDDEN_COLUMNS = {
        name: true,
        system_version: true,
        kalshi_user_id: true,
        exchange_credentials: true,
        email_verification_sent_at: true,
        email_verification_code_hash: true,
        notes: true,
        updated_at: true,
        last_updated: true
      };

      var ACCOUNT_TYPE_OPTIONS = ['master_admin', 'admin', 'user_basic', 'user_premium'];
      var STATUS_OPTIONS = [
        'pending_email_verification',
        'pending_admin_approval',
        'active',
        'inactive'
      ];

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /** API ISO timestamps → mm/dd/yyyy, HH:mm (local). Date-only YYYY-MM-DD uses local midnight. */
      function formatAdminDateTimeDisplay(val) {
        if (val == null || val === '') return '—';
        var s = String(val).trim();
        var d;
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
          var p = s.split('-');
          d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 0, 0, 0, 0);
        } else {
          d = new Date(s);
        }
        if (isNaN(d.getTime())) return esc(String(val));
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        var yyyy = d.getFullYear();
        var hh = String(d.getHours()).padStart(2, '0');
        var min = String(d.getMinutes()).padStart(2, '0');
        return esc(mm + '/' + dd + '/' + yyyy + ', ' + hh + ':' + min);
      }

      function formatCell(key, val) {
        if (key === 'registration_date' || key === 'last_login') {
          return formatAdminDateTimeDisplay(val);
        }
        if (val == null) return '—';
        if (typeof val === 'object') {
          try {
            return esc(JSON.stringify(val, null, 0));
          } catch (e) {
            return esc(String(val));
          }
        }
        return esc(String(val));
      }

      /** snake_case → Title Case with spaces; id/ip/uuid tokens normalized */
      function humanizeColumnKey(k) {
        return String(k).split('_').map(function (part) {
          if (!part) return '';
          var low = part.toLowerCase();
          if (low === 'id') return 'ID';
          if (low === 'ip') return 'IP';
          if (low === 'uuid') return 'UUID';
          return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
        }).join(' ');
      }

      function escAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;');
      }

      /** Lowercase haystack of all row values shown in the table (for client filter). */
      function rowFilterHaystack(row, keys) {
        var parts = [];
        keys.forEach(function (k) {
          var v = row[k];
          if (v == null) return;
          if (typeof v === 'object') {
            try {
              parts.push(JSON.stringify(v));
            } catch (e) {
              parts.push(String(v));
            }
          } else {
            var s = String(v);
            parts.push(s);
            if (/[_]/.test(s)) {
              parts.push(humanizeColumnKey(s));
            }
          }
        });
        return parts.join(' ').replace(/\s+/g, ' ').trim().toLowerCase();
      }

      function applyMasterUserFilter() {
        var inp = document.getElementById('masterUserSearch');
        var q = (inp && inp.value || '').trim().toLowerCase();
        var tbody = document.querySelector('.master-users-table tbody');
        if (!tbody) return;
        var trs = tbody.querySelectorAll('tr');
        if (!q) {
          trs.forEach(function (tr) { tr.style.display = ''; });
          return;
        }
        trs.forEach(function (tr) {
          var hay = tr.getAttribute('data-admin-row-filter') || '';
          tr.style.display = hay.indexOf(q) !== -1 ? '' : 'none';
        });
      }

      function theadHtml(keys) {
        var row = keys.map(function (k) {
          return '<th>' + esc(humanizeColumnKey(k)) + '</th>';
        }).join('');
        return '<thead><tr>' + row + '</tr></thead>';
      }

      function mergeCurrentEnumOption(baseOpts, current) {
        var c = current == null ? '' : String(current).trim();
        var out = baseOpts.slice();
        if (c && out.indexOf(c) === -1) out.push(c);
        return out;
      }

      function slotAttr(row) {
        var un = row.user_no;
        if (un == null) return '';
        var s = String(un).trim();
        if (/^\d+$/.test(s) && s.length < 4) s = ('0000' + s).slice(-4);
        return s;
      }

      function buildAccountTypeSelect(row) {
        var un = slotAttr(row);
        var cur = row.account_type == null ? '' : String(row.account_type).trim();
        var opts = mergeCurrentEnumOption(ACCOUNT_TYPE_OPTIONS, row.account_type);
        var html = '<select class="dropdown-picker admin-master-select" data-master-field="account_type" data-user-no="' +
          esc(un) + '" data-prev-value="' + esc(cur) + '">';
        opts.forEach(function (v) {
          var sel = cur === v ? ' selected' : '';
          html += '<option value="' + esc(v) + '"' + sel + '>' + esc(humanizeColumnKey(v)) + '</option>';
        });
        html += '</select>';
        return html;
      }

      function buildStatusSelect(row) {
        var un = slotAttr(row);
        var cur = row.status == null ? '' : String(row.status).trim();
        var opts = mergeCurrentEnumOption(STATUS_OPTIONS, row.status);
        var pendingCls = cur === 'pending_admin_approval' ? ' admin-status-pending-approval' : '';
        var html = '<select class="dropdown-picker admin-master-select' + pendingCls +
          '" data-master-field="status" data-user-no="' + esc(un) + '" data-prev-value="' + esc(cur) + '">';
        opts.forEach(function (v) {
          var sel = cur === v ? ' selected' : '';
          html += '<option value="' + esc(v) + '"' + sel + '>' + esc(humanizeColumnKey(v)) + '</option>';
        });
        html += '</select>';
        return html;
      }

      function applyPendingApprovalStyle(selectEl) {
        if (!selectEl || selectEl.getAttribute('data-master-field') !== 'status') return;
        if (selectEl.value === 'pending_admin_approval') {
          selectEl.classList.add('admin-status-pending-approval');
        } else {
          selectEl.classList.remove('admin-status-pending-approval');
        }
      }

      async function onAdminMasterSelectChange(ev) {
        var sel = ev.target;
        if (!sel || sel.tagName !== 'SELECT' || !sel.classList.contains('admin-master-select')) return;
        var field = sel.getAttribute('data-master-field');
        var userNo = sel.getAttribute('data-user-no');
        var prev = sel.getAttribute('data-prev-value') || '';
        var v = sel.value;
        if (!userNo || !field || v === prev) return;
        var body = { user_no: userNo };
        body[field] = v;
        try {
          var res = await fetch(window.location.origin + '/api/user/admin/master_users', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            cache: 'no-store'
          });
          var data = await res.json().catch(function () { return null; });
          if (!res.ok) {
            sel.value = prev;
            var msg = (data && data.error) ? data.error : 'Update failed';
            window.alert(msg);
            return;
          }
          sel.setAttribute('data-prev-value', v);
          applyPendingApprovalStyle(sel);
        } catch (e) {
          sel.value = prev;
          window.alert('Network error');
        }
      }

      function render(rows) {
        var host = document.getElementById('tableHost');
        var status = document.getElementById('status');
        if (!rows || !rows.length) {
          status.innerHTML = '<div class="empty">No rows returned.</div>';
          host.innerHTML = '';
          return;
        }
        var keySet = {};
        rows.forEach(function (r) {
          Object.keys(r).forEach(function (k) { keySet[k] = true; });
        });
        var keys = COLUMN_ORDER.filter(function (k) { return keySet[k] && !HIDDEN_COLUMNS[k]; });
        Object.keys(keySet).sort().forEach(function (k) {
          if (HIDDEN_COLUMNS[k]) return;
          if (keys.indexOf(k) === -1) keys.push(k);
        });

        var body = rows.map(function (row) {
          var hay = escAttr(rowFilterHaystack(row, keys));
          var tds = keys.map(function (k) {
            if (k === 'account_type') return '<td>' + buildAccountTypeSelect(row) + '</td>';
            if (k === 'status') return '<td>' + buildStatusSelect(row) + '</td>';
            var raw = row[k];
            return '<td>' + formatCell(k, raw) + '</td>';
          }).join('');
          return '<tr data-admin-row-filter="' + hay + '">' + tds + '</tr>';
        }).join('');

        status.innerHTML = '';
        host.innerHTML =
          '<div class="table-wrap"><table class="master-users-table">' +
          theadHtml(keys) + '<tbody>' + body + '</tbody></table></div>';
        var tbl = host.querySelector('.master-users-table');
        if (tbl) tbl.addEventListener('change', onAdminMasterSelectChange);
        applyMasterUserFilter();
      }

      var _adminToolsPaused = false;
      var _adminDbChangesUnsub = null;
      var _adminDbRefreshTimer = null;
      var _ADMIN_WS_DEBOUNCE_MS = 600;

      function scheduleAdminToolsRefetchFromDbChange() {
        if (_adminToolsPaused) return;
        if (_adminDbRefreshTimer) clearTimeout(_adminDbRefreshTimer);
        _adminDbRefreshTimer = setTimeout(function () {
          _adminDbRefreshTimer = null;
          load({ quiet: true });
        }, _ADMIN_WS_DEBOUNCE_MS);
      }

      function setupAdminToolsDbChangesWs() {
        if (_adminToolsPaused) return;
        if (_adminDbChangesUnsub) return;
        if (!window.recRealtimeWsCoordinator || typeof window.recRealtimeWsCoordinator.subscribe !== 'function') {
          return;
        }
        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = protocol + '//' + window.location.host + '/ws/db_changes';
        _adminDbChangesUnsub = window.recRealtimeWsCoordinator.subscribe(wsUrl, {
          onlyDbStreams: ['master_users', 'monitor_list'],
          onMessage: function (event) {
            try {
              var data =
                typeof recRealtimeWsJson === 'function' ? recRealtimeWsJson(event) : JSON.parse(event.data);
              if (!data) return;
              if (data.type === 'db_change' &&
                  (data.database === 'master_users' || data.database === 'monitor_list')) {
                scheduleAdminToolsRefetchFromDbChange();
              }
            } catch (e) { /* ignore malformed frames */ }
          },
        });
      }

      function teardownAdminToolsDbChangesWs() {
        if (_adminDbChangesUnsub) {
          try { _adminDbChangesUnsub(); } catch (e) {}
          _adminDbChangesUnsub = null;
        }
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'tab-visibility') return;
        var visible = event.data.visible === true;
        _adminToolsPaused = !visible;
        if (visible) {
          if (_adminDbRefreshTimer) {
            clearTimeout(_adminDbRefreshTimer);
            _adminDbRefreshTimer = null;
          }
          setupAdminToolsDbChangesWs();
          load({ quiet: true });
        } else {
          teardownAdminToolsDbChangesWs();
          if (_adminDbRefreshTimer) {
            clearTimeout(_adminDbRefreshTimer);
            _adminDbRefreshTimer = null;
          }
        }
      });

      async function load(opts) {
        opts = opts || {};
        var quiet = opts.quiet === true;
        var status = document.getElementById('status');
        var host = document.getElementById('tableHost');
        if (!quiet) {
          status.innerHTML = '<div class="loading">Loading…</div>';
          host.innerHTML = '';
        }
        try {
          var res = await fetch(window.location.origin + '/api/user/admin/master_users', { cache: 'no-store' });
          var data = await res.json().catch(function () { return null; });
          if (res.status === 403) {
            status.innerHTML = '<div class="error">You do not have access to this page.</div>';
            return;
          }
          if (!res.ok || !data || data.error) {
            if (!quiet) {
              status.innerHTML = '<div class="error">' + esc((data && data.error) || 'Request failed') + '</div>';
            }
            return;
          }
          render(data.rows || []);
        } catch (e) {
          if (!quiet) {
            status.innerHTML = '<div class="error">Could not load data.</div>';
          }
        }
      }

      var masterUserSearch = document.getElementById('masterUserSearch');
      if (masterUserSearch) {
        masterUserSearch.addEventListener('input', applyMasterUserFilter);
        masterUserSearch.addEventListener('search', applyMasterUserFilter);
      }
      load({ quiet: false });
      setupAdminToolsDbChangesWs();
    })();
  </script>
  <script>
    (function () {
      var _liveTimer = null;
      var _liveOn = false;
      var _eventsPaused = false;

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatEventTimestamp(val) {
        if (val == null || val === '') return '—';
        var s = String(val).trim();
        var d = new Date(s);
        if (isNaN(d.getTime())) return esc(s);
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        var yyyy = d.getFullYear();
        var hh = String(d.getHours()).padStart(2, '0');
        var min = String(d.getMinutes()).padStart(2, '0');
        var ss = String(d.getSeconds()).padStart(2, '0');
        return esc(mm + '/' + dd + '/' + yyyy + ' ' + hh + ':' + min + ':' + ss);
      }

      function sevClass(sev) {
        var s = (sev || 'info').toLowerCase();
        if (s === 'critical') return 'sev-critical';
        if (s === 'warning') return 'sev-warning';
        return 'sev-info';
      }

      function openDetailLog(detailRef) {
        if (!detailRef) return;
        var script = String(detailRef).replace(/^logs\//, '').replace(/\.(out|err)\.log$/, '').replace(/\.log$/, '');
        if (!script) return;
        window.open(
          '/log-viewer.html?script=' + encodeURIComponent(script),
          'log_' + script,
          'width=1200,height=800,scrollbars=yes,resizable=yes'
        );
      }

      function renderMasterEvents(data) {
        var host = document.getElementById('masterEventsHost');
        var status = document.getElementById('masterEventsStatus');
        if (!host) return;
        var events = (data && data.events) || [];
        var total = (data && data.total) != null ? data.total : events.length;
        if (status) {
          status.innerHTML = '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">'
            + esc(String(events.length)) + ' shown of ' + esc(String(total)) + ' matching events</div>';
        }
        if (!events.length) {
          host.innerHTML = '<div class="empty">No system events found.</div>';
          return;
        }
        var html = '<table class="master-events-table"><thead><tr>'
          + '<th>Timestamp</th><th>Severity</th><th>Category</th><th>Source</th><th>Message</th><th>Detail</th>'
          + '</tr></thead><tbody>';
        events.forEach(function (ev) {
          html += '<tr>'
            + '<td>' + formatEventTimestamp(ev.timestamp) + '</td>'
            + '<td class="' + sevClass(ev.severity) + '">' + esc(ev.severity || 'info') + '</td>'
            + '<td>' + esc(ev.category || '') + '</td>'
            + '<td>' + esc(ev.source || '') + '</td>'
            + '<td class="master-events-message">' + esc(ev.message || '') + '</td>'
            + '<td>';
          if (ev.detail_ref) {
            html += '<button type="button" class="detail-link" data-script="' + esc(ev.detail_ref) + '">'
              + esc(ev.detail_ref) + '</button>';
          } else {
            html += '—';
          }
          html += '</td></tr>';
        });
        html += '</tbody></table>';
        host.innerHTML = html;
        host.querySelectorAll('.detail-link').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openDetailLog(btn.getAttribute('data-script'));
          });
        });
      }

      async function loadMasterEvents(opts) {
        opts = opts || {};
        var quiet = opts.quiet === true;
        var host = document.getElementById('masterEventsHost');
        var catEl = document.getElementById('masterEventsCategory');
        var sevEl = document.getElementById('masterEventsSeverity');
        var limEl = document.getElementById('masterEventsLimit');
        if (!quiet && host) {
          host.innerHTML = '<div class="loading">Loading events…</div>';
        }
        var params = new URLSearchParams();
        params.set('limit', (limEl && limEl.value) || '100');
        params.set('offset', '0');
        if (catEl && catEl.value) params.set('category', catEl.value);
        if (sevEl && sevEl.value) params.set('severity', sevEl.value);
        try {
          var res = await fetch(
            window.location.origin + '/api/user/admin/master_events?' + params.toString(),
            { cache: 'no-store' }
          );
          var data = await res.json().catch(function () { return null; });
          if (res.status === 403) {
            if (host) host.innerHTML = '<div class="error">Forbidden</div>';
            return;
          }
          if (!res.ok || !data || data.error) {
            if (host) host.innerHTML = '<div class="error">' + esc((data && data.error) || 'Request failed') + '</div>';
            return;
          }
          renderMasterEvents(data);
        } catch (e) {
          if (host) host.innerHTML = '<div class="error">Could not load events.</div>';
        }
      }

      function setLive(on) {
        _liveOn = on;
        var btn = document.getElementById('masterEventsLiveToggle');
        if (btn) btn.textContent = 'Live: ' + (on ? 'on' : 'off');
        if (_liveTimer) {
          clearInterval(_liveTimer);
          _liveTimer = null;
        }
        if (on && !_eventsPaused) {
          _liveTimer = setInterval(function () {
            loadMasterEvents({ quiet: true });
          }, 15000);
        }
      }

      var refreshBtn = document.getElementById('masterEventsRefresh');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', function () { loadMasterEvents({ quiet: false }); });
      }
      var liveBtn = document.getElementById('masterEventsLiveToggle');
      if (liveBtn) {
        liveBtn.addEventListener('click', function () { setLive(!_liveOn); });
      }
      ['masterEventsCategory', 'masterEventsSeverity', 'masterEventsLimit'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', function () { loadMasterEvents({ quiet: false }); });
      });

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'tab-visibility') return;
        _eventsPaused = event.data.visible !== true;
        if (_eventsPaused) {
          if (_liveTimer) {
            clearInterval(_liveTimer);
            _liveTimer = null;
          }
        } else if (_liveOn) {
          setLive(true);
          loadMasterEvents({ quiet: true });
        }
      });

      loadMasterEvents({ quiet: false });
    })();
  </script>
</body>
</html>
