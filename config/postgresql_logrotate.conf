# PostgreSQL Log Rotation Configuration for Homebrew PostgreSQL
# This file should be copied to /etc/logrotate.d/postgresql-homebrew on macOS
# Or use newsyslog on macOS (see below)

# Homebrew PostgreSQL 15 log rotation
/opt/homebrew/var/log/postgresql@15.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 ericwais1 admin
    postrotate
        # Reload PostgreSQL configuration (doesn't require restart)
        psql -U rec_io_user -d rec_io_db -c "SELECT pg_reload_conf();" > /dev/null 2>&1 || true
    endscript
}

# Alternative: For macOS newsyslog, create /etc/newsyslog.d/postgresql.conf:
# /opt/homebrew/var/log/postgresql@15.log    ericwais1:admin    644  7     100M  *     Z

