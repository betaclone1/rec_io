# Trading System Log Rotation Configuration
# Canonical install target: /etc/logrotate.d/trading-system
#
# Supervisord keeps stdout/stderr log FDs open for the life of each program.
# Rename+create rotation (default logrotate) moves the inode under log_archive/
# while supervisord keeps writing there, leaving empty live stubs in logs/.
# copytruncate keeps the same inode at the live path so writers never go stale.
# (create/postrotate reload do not reopen those FDs on this supervisord.)

/opt/rec_io_server/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    olddir /opt/rec_io_server/logs/log_archive
}

# Bound compressed archive volume (older than ~30 rotations when run daily).
/opt/rec_io_server/logs/log_archive/*.gz {
    daily
    rotate 30
    missingok
    notifempty
}
