# Trading System Log Rotation Configuration
# Clean version without duplicate entries

# All trading system logs - general pattern
/opt/rec_io_server/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    olddir /opt/rec_io_server/logs/log_archive
    postrotate
        # Reload supervisor services if they exist
        supervisorctl -c /opt/rec_io_server/backend/supervisord.conf reload > /dev/null 2>&1 || true
    endscript
}

# Clean up old archived logs (older than 30 days)
/opt/rec_io_server/logs/log_archive/*.gz {
    daily
    rotate 30
    missingok
    notifempty
}
