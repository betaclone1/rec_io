# Trading System Log Rotation Configuration
# Updated to include log archiving and monitor-specific logs

# Global settings for all logs
/opt/rec_io_server/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    olddir /opt/rec_io_server/logs/log_archive
    postrotate
        # Reload supervisor services if they exist
        supervisorctl -c /opt/rec_io_server/backend/supervisord.conf reload > /dev/null 2>&1 || true
    endscript
}

# Monitor-specific logs (auto_entry_supervisor and active_trade_supervisor)
/opt/rec_io_server/logs/auto_entry_supervisor_*.log {
    daily
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    olddir /opt/rec_io_server/logs/log_archive
    postrotate
        # No supervisor reload needed for monitor-specific processes
    endscript
}

