# Trading System Log Rotation Configuration
# Prefer config/logrotate_clean.conf for new installs (single glob + copytruncate).
# Kept for operators who want slightly tighter retention on monitor/symbol families.

/opt/rec_io_server/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    olddir /opt/rec_io_server/logs/log_archive
}

/opt/rec_io_server/logs/auto_entry_supervisor_*.log {
    daily
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    olddir /opt/rec_io_server/logs/log_archive
}

