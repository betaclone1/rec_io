# Trading System Log Rotation Configuration
#
# Production (DigitalOcean): install the absolute-path canonical file:
#   sudo cp config/logrotate_clean.conf /etc/logrotate.d/trading-system
#
# This relative-path variant is for local/dev checkouts. Same policy: copytruncate
# so supervisord-held FDs keep writing the live log path after rotation.

logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    olddir logs/log_archive
}

logs/log_archive/*.gz {
    daily
    rotate 30
    missingok
    notifempty
}
