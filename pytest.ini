[pytest]
# Discover test_*.py and *_test.py in tests/
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
# Markers (also registered in conftest.py)
markers =
    unit: Unit tests (no DB, no external API).
    integration: Integration tests (DB, API, or multi-component).
addopts = -v --tb=short
# Run from repo root so PYTHONPATH includes backend
filterwarnings =
    ignore::DeprecationWarning
