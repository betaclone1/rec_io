# Fail if database.py table definitions drift from MASTER_DB_SCHEMA_REFERENCE.md
# for critical tables (trades_0001, trades_simulated_0001, monitor_list_0001, strategy_list_0001).
# No database connection required; compares doc and code only.
name: DB schema drift check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DB schema drift
        run: |
          PYTHONPATH="${{ github.workspace }}" python3 scripts/db/check_db_schema_drift.py
