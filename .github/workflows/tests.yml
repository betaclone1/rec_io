# Unit tests on push/PR. Lint was removed: it flagged hundreds of legacy issues on whole files whenever
# any Python path changed, causing failure emails without reflecting deploy risk. Run Ruff locally if desired.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit -v --tb=short

      - name: Run tests with coverage (unit only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit -v --cov=backend --cov-report=term-missing --cov-fail-under=0
