# Single workflow = one email per outcome (was: tests.yml + db-schema-drift.yml per push).
# Changelog-only pushes to main skip CI (paths-ignore) — those edits don't affect runtime.
# Use python -m pytest so the runner does not rely on a scripts/ PATH entry (avoids exit 127).
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/changelog/**"
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: DB schema drift check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/db/check_db_schema_drift.py

      - name: Legacy Kalshi quote guard (dollars-only contract)
        run: bash scripts/dev/check_no_legacy_kalshi_quotes.sh

      - name: Unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/unit -v --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=0
