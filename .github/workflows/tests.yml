# One workflow per push/PR: drift check, Kalshi dollars guard, unit tests + coverage.
# Every commit to main/master is validated (no path skips — avoids silent broken merges).
# Use `python -m pip` / `python -m pytest` only — bare `pip`/`pytest` are not always on PATH (exit 127).
#
# Strong guarantee: GitHub → Settings → Branches → add rule for main → require status check
# "CI / test" (or the exact name shown after this workflow runs once) before merge.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Unit tests import backend modules that resolve ports via default_pool_user_number();
    # a clean Actions runner has no REC_* tenant vars unless we set them here.
    env:
      REC_USER_NO: "0001"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: DB schema drift check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/db/check_db_schema_drift.py

      - name: Legacy Kalshi quote guard (dollars-only contract)
        run: bash scripts/dev/check_no_legacy_kalshi_quotes.sh

      - name: Unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/unit -v --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=0

      - name: Guard new hardcoded users_*_0001 literals in main.py
        run: python scripts/ci/scan_main_tenant_literals.py
